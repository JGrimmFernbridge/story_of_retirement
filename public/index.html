ent of the assets in Enron’s 401(k) plan were invested in Enron stock. Shares that traded above $80 in January 2001 were worth less than 70 cents by January 2002, after the company filed for bankruptcy on December 2, 2001.","itemId":"codify-his-3","type":"history"},{"year":2001,"title":"China joins the WTO","detail":"The World Trade Organization approved China’s accession on November 10, 2001, accelerating the global competition the book links to the end of American manufacturing hegemony and the geographic stability that had anchored lifelong employment.","itemId":"codify-his-4","type":"history"},{"year":2001,"endYear":null,"title":"September 11","detail":"Terrorist attacks on September 11, 2001, killed nearly 3,000 people in New York, at the Pentagon and in Pennsylvania. U.S. stock markets closed for four trading days.","significance":"His note: social, political and economic at once. It struck in the middle of the dot-com bear market.","decline":null,"type":"history","itemId":"m-911","master":true,"hand":"9/11 — Social · Political · Economic"},{"year":2007,"endYear":2009,"title":"The Great Recession","detail":"The recession ran from December 2007 to June 2009, the longest since World War II at the time; Lehman Brothers failed in September 2008, unemployment peaked at 10 percent in October 2009, and household net worth fell by about $14 trillion.","itemId":"codify-his-5","type":"history","master":true,"hand":"Great Recession"}],"seeds":[{"seed":1,"stage":"blooming","detail":"Boundaries no longer needed explicit exclusions: they now ran through who worked for an employer that offered a plan, who earned enough to contribute, and who held wealth to fall back on. The 2009 racial wealth gap—20 to 1 between white and Black median households—shows how earlier exclusions compounded."},{"seed":2,"stage":"blooming","detail":"Government remained deeply involved but changed roles—from provider to tax subsidizer and rule-writer for private accounts: ERTA, TRA ’86, the Roth IRA, EGTRRA, and the PPA. It also rescued and trimmed Social Security in 1983 and refused to privatize it in 2005."},{"seed":3,"stage":"blooming","detail":"The 1983 amendments began moving the full retirement age to 67 and the ADEA ended most mandatory retirement in 1986, yet 65 remained the cultural endpoint—and Medicare eligibility stayed at 65. The book says this era codified age 65."},{"seed":4,"stage":"blooming","detail":"With the 401(k), the belief that markets reliably rise became the engine of private retirement. Quick recoveries after 1982 and 1987 seemed to confirm it; the 2000–02 and 2007–09 declines of roughly 49 and 57 percent tested it on people with no time left to wait."},{"seed":5,"stage":"blooming","detail":"The book argues this era codified leisure as the escape and work as something to flee. Financial marketing sold “your number” as the price of a golf-and-grandchildren retirement that, Grimm writes, most savers would never be able to fund."},{"seed":6,"stage":"blooming","detail":"The 1990s bull market and the dot-com mania revived speculation as a path to retirement: the Nasdaq peaked at 5,048.62 in March 2000 and then fell 78 percent by October 2002."},{"seed":7,"stage":"blooming","detail":"Access to the new system tracked income: in 2007 top-quartile earners were more than three times as likely as bottom-quartile earners to participate in a defined-contribution plan. The Two Americas now divided those with accounts from those without."},{"seed":8,"stage":"blooming","detail":"The Promise reached full flower and began to wither in the same era: defined-benefit plans fell from about 170,000 in 1985 to about 47,000 in 2010. For workers, the shift felt less like a policy change than a broken covenant."},{"seed":9,"stage":"blooming","detail":"Individualism arrives in 1981—the IRS’s 401(k) rules, universal IRAs, and Reagan’s inaugural—and blooms within a decade. The book’s summary: it converts systemic failure into personal failure. “The plan didn’t fail you. You failed the plan.”"}],"twoPersonLens":{"year":2010,"older":{"born":1950,"headline":"Still time to panic","text":"Born in 1950, she was 31 when the IRS issued the rules that made the 401(k) usable, and she spent her career as the system changed underneath her—from a pension promised by the company to an account she was told to manage herself. She did everything right: thirty-plus years of work, steady contributions, a portfolio that grew through the bull markets of the 1990s. She had a number, close enough that retiring at her full retirement age of 66 felt like a plan. Then, in her late fifties, the market fell 57 percent. She lost savings not because she was reckless but because she was exactly where the system told her to be—fully invested, trusting the model—when the model failed. She’s still working, because the math doesn’t close."},"younger":{"born":1990,"headline":"Already improvising","text":"Born in 1990, he has never known a world without the 401(k). He was eleven when Enron’s employees watched their retirement accounts collapse with the company’s stock, and a teenager when the longest recession since World War II began. Now 20, he enters a labor market where unemployment recently peaked at 10 percent, carrying student debt that shapes what any first job can offer. The wealth-building decade earlier generations used to lay a foundation has been lost at the start—not to bad choices, but to timing. His full retirement age is 67, his employer offers an account rather than a pension, and his planning app tells him to save more than he earns. He has moved past grief into improvisation."},"irony":"The 60-year-old still has time to panic; the 20-year-old has already moved past grief into improvisation—and neither was ever asked who gave them the dream."},"keyTerms":[{"term":"Defined-contribution (DC) plan","definition":"A retirement plan, such as a 401(k), in which contributions go into an individual account; the eventual benefit depends on contributions and investment returns, and the worker bears the risk."},{"term":"401(k) plan","definition":"A DC plan named for the tax-code section added in 1978 that lets employees defer part of their salary before tax, often with an employer match."},{"term":"The Great Risk Transfer","definition":"Grimm’s term for the shift of investment, longevity, and inflation risk from employers’ pooled pensions to individual workers’ accounts, presented to workers as freedom and choice."},{"term":"Counterfeit (the book’s usage)","definition":"The book’s charge that the individual account kept the name “retirement” while sharing none of the pooled-risk, guaranteed-income substance of what it replaced."},{"term":"Full retirement age (FRA)","definition":"The age at which Social Security pays an unreduced benefit. The 1983 amendments raised it gradually from 65 to 67 for people born in 1960 or later."},{"term":"Roth IRA","definition":"An individual retirement account created in 1997 that is funded with after-tax dollars and allows tax-free qualified withdrawals."},{"term":"Automatic enrollment","definition":"A plan design that enrolls workers in a 401(k) by default unless they opt out. The Pension Protection Act of 2006 made it safer for employers to adopt."},{"term":"Qualified default investment alternative (QDIA)","definition":"A default investment, such as a target-date or balanced fund, into which a plan may place participants who make no choice, with fiduciary protection for the employer."},{"term":"“Your number”","definition":"The industry’s single dollar figure for a comfortable retirement. The book argues it turned a social question—how do we care for the aging?—into a personal one: did you save enough?"}],"keyFigures":[{"name":"Ted Benna","role":"Pennsylvania benefits consultant often called the “father of the 401(k)” for designing an early plan with pre-tax employee contributions and an employer match at the Johnson Companies in 1981. He later became a critic, saying the plan “was never intended to be what it is today.”"},{"name":"Ronald Reagan","role":"President from 1981 to 1989 whose first inaugural framed government as the problem and who signed ERTA (1981) and the 1983 Social Security rescue—an embodiment of both the individualist turn and the limits of it."},{"name":"Margaret Thatcher","role":"British prime minister from 1979 to 1990 whose 1987 remark that “there is no such thing as society” became shorthand, often stripped of her context, for the era’s individualism."},{"name":"Alan Greenspan","role":"Chaired the National Commission on Social Security Reform, whose January 1983 report led to the 1983 amendments that taxed some benefits and raised the full retirement age to 67."}],"primarySources":[{"title":"Ronald Reagan, First Inaugural Address","year":1981,"source":"Avalon Project, Yale Law School","url":"https://avalon.law.yale.edu/20th_century/reagan1.asp","why":"Read the full sentence around “government is the problem,” including “in this present crisis,” and ask how the qualifier changes its meaning."},{"title":"Report of the National Commission on Social Security Reform (Greenspan Commission)","year":1983,"source":"SSA History","url":"https://www.ssa.gov/history/reports/gspan.html","why":"Note how the commission framed the financing crisis and which burdens it chose to spread across workers, retirees, and the future."},{"title":"The Republican Contract with America","year":1994,"source":"American Presidency Project, UC Santa Barbara","url":"https://www.presidency.ucsb.edu/documents/the-republican-contract-with-america","why":"Read the Senior Citizens Fairness Act: what does it assume about older Americans, work, and private insurance?"},{"title":"Pension Protection Act implementation release","year":2006,"source":"U.S. Department of Labor","url":"https://www.dol.gov/newsroom/releases/ebsa/ebsa20060926","why":"Look at how the government justified automatic enrollment and default investments—and what that implies about the do-it-yourself model."},{"title":"Private Pension Plan Bulletin Historical Tables and Graphs, 1975–2023","year":2010,"source":"U.S. Department of Labor, EBSA","url":"https://www.dol.gov/sites/default/files/ebsa/researchers/statistics/retirement-bulletins/private-pension-plan-bulletin-historical-tables-and-graphs.pdf","why":"Use Tables E1, E7, and E10 to measure the shift from DB to DC plans in plans, participants, and assets."}],"discussionQuestions":["The book calls the 401(k) a counterfeit that kept the name “retirement.” Which features of a defined-benefit pension did it drop, and which (portability, ownership, inheritability) did it add? Is “counterfeit” the right word?","Test the book’s argument: defenders of the 401(k) model point out that elderly poverty fell from 15.7 percent in 1980 to 8.9 percent in 2010, that DC accounts are portable for workers who change jobs, and that the PPA’s automatic enrollment raised participation. Using data, weigh these points against the book’s claim that the era codified a catastrophe.","Social Security survived two very different reform efforts in this era—a bipartisan rescue in 1983 and a failed privatization push in 2005. Why did one succeed and the other fail, and what does that say about the public’s view of pooled versus individual risk?","Tax incentives for retirement saving flow mostly to higher earners. Is that an unavoidable feature of tax-based incentives or a design choice? Propose one change and predict its effects.","Enron employees held 62 percent of their 401(k) assets in company stock. Was that a failure of individual judgment, of plan design, or of the system’s premise that workers should manage their own risk?","Compare the two people in the 2010 Two-Person Lens. Which risks did each face that a defined-benefit pension would have absorbed, and which would remain even with a pension?"],"assignment":{"title":"Following the Risk: A DB-to-DC Data Investigation","type":"Data investigation with chart and policy memo","prompt":"Investigate the Great Risk Transfer with official data. Using the Department of Labor’s Private Pension Plan Bulletin Historical Tables (Tables E1, E7, E10) and at least one Survey of Consumer Finances source (Federal Reserve or a CRS/GAO summary), build two charts: (1) active participants in DB vs. DC plans, 1975–2010; and (2) median retirement-account balances or account ownership by age or income group. Then test one of the book’s claims against your data—for example, its statement that two-thirds of workers had DB plans in the early 1980s (compare EBRI’s 38 percent of private wage and salary workers in 1979 and DOL’s participant counts), or its claim about median balances for workers aged 55–64. Finally, write a memo to a congressional staffer explaining which risks moved, to whom, and what one policy could do about it.","deliverable":"Two original charts with source notes, a 300-word methods-and-data appendix, and a 1,000–1,200 word policy memo citing at least four sources (at least three official).","points":100,"rubric":[{"criterion":"Data accuracy & sourcing","points":30,"exemplary":"Pulls correct figures from official tables, documents table numbers and definitions (e.g., active participants vs. workers), and notes limitations such as double-counting of workers in multiple plans.","proficient":"Figures accurate and sourced; minor gaps in definitions or limitations.","developing":"Some figures inaccurate or loosely sourced; definitions confused.","beginning":"Data largely inaccurate, unsourced, or missing."},{"criterion":"Charts & visual communication","points":20,"exemplary":"Charts are clear, honest (appropriate axes and scales), labeled with units and sources, and each makes one point a reader grasps in seconds.","proficient":"Charts accurate and labeled with minor design issues.","developing":"Charts cluttered, mislabeled, or only loosely tied to the argument.","beginning":"Charts missing or misleading."},{"criterion":"Testing the book’s claim","points":25,"exemplary":"Precisely states one claim, reconciles differing measures, and reaches a fair, evidence-based judgment—whether confirming, qualifying, or refuting it.","proficient":"Tests a claim with relevant data; judgment reasonable but reconciliation of measures is partial.","developing":"Restates the claim with limited or mismatched data.","beginning":"No genuine test of a claim."},{"criterion":"Policy memo","points":25,"exemplary":"Identifies specific risks (investment, longevity, inflation, behavioral) and who bears them; recommends one feasible policy with trade-offs; concise, professional prose.","proficient":"Clear analysis and recommendation; trade-offs only partly addressed.","developing":"Analysis general; recommendation vague or disconnected from data.","beginning":"Memo missing key elements or unclear."}]},"quiz":[{"q":"Section 401(k) was added to the tax code in 1978. What happened on November 10, 1981?","options":["Congress repealed defined-benefit pensions","The IRS issued regulations allowing pre-tax salary deferrals, unlocking widespread adoption","The first Roth IRA was opened","ERISA was signed"],"answer":1,"explain":"The IRS regulations clarified that employees could defer salary before tax, and many large employers launched plans in January 1982."},{"q":"Which change did the 1983 Social Security Amendments make?","options":["Created automatic COLAs","Gradually raised the full retirement age from 65 to 67","Created Medicare Part D","Lowered the early retirement age to 60"],"answer":1,"explain":"The amendments phased in an FRA of 67 for people born in 1960 or later and also made up to half of benefits taxable for higher-income beneficiaries."},{"q":"Between 1980 and 2010, how did active participants in private DB and DC plans change (DOL data)?","options":["DB rose from 18.9 to 73.4 million","Both stayed roughly constant","DB fell from 30.1 to 17.2 million while DC rose from 18.9 to 73.4 million","DC fell by half"],"answer":2,"explain":"DOL Table E7 shows the reversal at the heart of the Great Risk Transfer."},{"q":"What share of Enron’s 401(k) plan assets was invested in Enron stock at the end of 2000?","options":["About 10 percent","About 25 percent","About 62 percent","100 percent"],"answer":2,"explain":"About 62 percent of plan assets were in company stock, which lost nearly all its value by early 2002."},{"q":"What did the Pension Protection Act of 2006 encourage?","options":["Converting Social Security into personal accounts","Automatic enrollment in 401(k) plans with protected default investments","Abolishing IRAs","Mandatory defined-benefit pensions for large employers"],"answer":1,"explain":"The PPA eased automatic enrollment and created a fiduciary safe harbor for qualified default investment alternatives."}],"sources":[{"label":"CRS 96-20 — IRA legislative history (ERTA, TRA ’86, Roth)","url":"https://www.everycrsreport.com/reports/96-20.html"},{"label":"Reagan Library blog — ERTA of 1981","url":"https://reagan.blogs.archives.gov/2016/08/15/reaganomics-the-economic-recovery-tax-act-of-1981"},{"label":"PSCA — 401(k) history","url":"https://www.psca.org/node/242"},{"label":"PSCA — 401(k) contribution-limit history (TRA ’86)","url":"https://www.psca.org/node/237"},{"label":"ASPPA — The “real” 401(k) Day","url":"https://www.asppa-net.org/news/2025/11/the-real-401k-day/"},{"label":"History.com — Ted Benna and the 401(k)","url":"https://www.history.com/articles/meet-the-man-who-invented-modern-retirement-401k"},{"label":"401(k) — history and Pension Protection Act","url":"https://en.wikipedia.org/wiki/401(k)"},{"label":"SSA — 1983 Amendments legislative history","url":"https://www.ssa.gov/history/1983amend.html"},{"label":"SSA — Greenspan Commission report","url":"https://www.ssa.gov/history/reports/gspan.html"},{"label":"SSA — Brief History of Social Security","url":"https://www.ssa.gov/history/briefhistory3.html"},{"label":"SSA — Full retirement age by year of birth","url":"https://www.ssa.gov/benefits/retirement/planner/agereduction.html"},{"label":"SSA — The Notch archive","url":"https://www.ssa.gov/history/notchfile1.html"},{"label":"SSA — Life expectancy at 65 by cohort","url":"https://www.ssa.gov/history/lifeexpect.html"},{"label":"SSA — Ratio of covered workers to beneficiaries","url":"https://www.ssa.gov/history/ratios.html"},{"label":"Christian Science Monitor (1984) — Retirement Equity Act provisions","url":"https://www.csmonitor.com/1984/0808/080842.html"},{"label":"Older Women’s League","url":"https://en.wikipedia.org/wiki/Older_Women%27s_League"},{"label":"Workforce — Legislative history of employee benefits","url":"https://www.workforce.com/news/legislative-history-of-employee-benefits"},{"label":"CRS 97-479 — ADEA amendments","url":"https://www.everycrsreport.com/reports/97-479.html"},{"label":"Taxpayer Relief Act of 1997","url":"https://en.wikipedia.org/wiki/Taxpayer_Relief_Act_of_1997"},{"label":"CRS RS20629 — EGTRRA pension provisions","url":"https://www.everycrsreport.com/reports/RS20629.html"},{"label":"Journal of Accountancy (2001) — EGTRRA catch-up contributions","url":"https://www.journalofaccountancy.com/issues/2001/nov/newtaxlawpermitscatchupemployeeplancontributions/"},{"label":"CRS RL31966 — Medicare Modernization Act overview","url":"https://www.everycrsreport.com/reports/RL31966.html"},{"label":"Brookings — Why the 2005 Social Security initiative failed","url":"https://www.brookings.edu/articles/why-the-2005-social-security-initiative-failed-and-what-it-means-for-the-future/"},{"label":"U.S. DOL — Pension Protection Act release (2006)","url":"https://www.dol.gov/newsroom/releases/ebsa/ebsa20060926"},{"label":"U.S. DOL — Private Pension Plan Bulletin Historical Tables","url":"https://www.dol.gov/sites/default/files/ebsa/researchers/statistics/retirement-bulletins/private-pension-plan-bulletin-historical-tables-and-graphs.pdf"},{"label":"EBRI — DB and DC participation, 1979 vs. 2017","url":"https://www.ebri.org/retirement/content/only-11-percent-of-us-private-sector-wage-and-salary-workers-participate-in-defined-benefit-pension-plans"},{"label":"CRS RL30922 — Retirement Savings and Household Wealth in 2007","url":"https://www.everycrsreport.com/reports/RL30922.html"},{"label":"Urban Institute — Distributional Effects of DC Plans and IRAs (2004)","url":"https://www.urban.org/research/publication/distributional-effects-defined-contribution-plans-and-individual-retirement-accounts"},{"label":"Center for American Progress — CBO 2019 distribution of retirement tax benefits","url":"https://www.americanprogress.org/article/tax-breaks-for-retirement-savings-do-not-help-the-workers-who-need-them-most/"},{"label":"Pew Research Center — Wealth gaps rise to record highs (2011)","url":"https://www.pewresearch.org/social-trends/2011/07/26/wealth-gaps-rise-to-record-highs-between-whites-blacks-hispanics/"},{"label":"CRS — Enron bankruptcy and employer stock in retirement plans","url":"https://legistorm.com/reports/view/crs/216324/Enron_Bankruptcy_and_Employer_Stock_in_Retirement_Plans.html"},{"label":"ICI Fact Book — Mutual fund total net assets","url":"https://icifactbook.org/2022/pdf/22-fb-table01.pdf"},{"label":"Avalon Project — Reagan First Inaugural Address","url":"https://avalon.law.yale.edu/20th_century/reagan1.asp"},{"label":"Big Issue — Thatcher’s “no such thing as society” in context","url":"https://www.bigissue.com/news/politics/margaret-thatcher-no-such-thing-as-society/"},{"label":"American Presidency Project — Contract with America","url":"https://www.presidency.ucsb.edu/documents/the-republican-contract-with-america"},{"label":"WTO — China accession approved (2001)","url":"https://www.wto.org/english/news_e/pres01_e/pr252_e.htm"},{"label":"Federal Reserve History — Stock Market Crash of 1987","url":"https://www.federalreservehistory.org/essays/stock-market-crash-of-1987"},{"label":"Federal Reserve History — The Great Recession","url":"https://www.federalreservehistory.org/essays/great-recession-of-200709"},{"label":"Federal Reserve History — The Great Recession and its aftermath","url":"https://www.federalreservehistory.org/essays/great-recession-and-its-aftermath"},{"label":"Dot-com bubble (Nasdaq peak and decline)","url":"https://en.wikipedia.org/wiki/Dot-com_bubble"},{"label":"Yardeni Research — S&P 500 bear market tables","url":"https://archive.yardeni.com/pub/sp500corrbeartables.pdf"},{"label":"Stacker/KEYT — S&P 500 corrections and recovery times since 1950","url":"https://keyt.com/stacker-business-economy/2026/08/12/every-major-stock-market-correction-since-1950-and-how-long-recovery-took/"},{"label":"House Education & Labor hearing (Oct. 2008) — Orszag on $2 trillion in retirement losses","url":"https://www.govinfo.gov/content/pkg/CHRG-110hhrg45031/html/CHRG-110hhrg45031.htm"},{"label":"FRED — Poverty rate, people 65 and over (Census)","url":"https://fred.stlouisfed.org/data/HSTPOVAR65YOBPPP"},{"label":"FRED — U.S. consumer-price inflation (World Bank)","url":"https://fred.stlouisfed.org/data/FPCPITOTLZGUSA"},{"label":"Federal Reserve History — The Great Inflation","url":"https://www.federalreservehistory.org/essays/great-inflation"},{"label":"Grimm, A Concise History of Retirement (draft), Chapters 5–6","url":"https://docs.google.com/document/d/1P0EMAca6c4jzB47BAsQLuZUq3Jdl3hvQ3nMszjFixXA"}],"chapter":{"title":"Codify","years":"1980–2010","subtitle":null,"definition":"cod·i·fy (verb) the standardization of something","epigraph":null,"status":"draft","words":2224,"minutes":10,"html":"<p>By 1980, retirement had spent thirty years looking like it worked so we codified it. Again, this is a word we don’t often use in our daily vocabulary but it is powerful in this context. Simply put, to codify something is to systematize and standardize it. This is what we, today, have come to know retirement to be. So how did it happen.</p>\n<p>What the previous era produced — the golden retirement of 1950 to 1980 — was an anomaly. Not a design. Not a proof of concept. Not a model that had been studied, understood, and deliberately constructed. An anomaly: a convergence of conditions so specific, so historically unrepeatable, that the system appeared to function not because it was well-built but because everything around it was temporarily cooperating.</p>\n<p>The conditions were real. Sixteen workers for every Social Security beneficiary. Retirements that lasted ten years, not thirty. Healthcare costs that were manageable. A generation of workers whose lives had been shaped by depression and war and who asked for very little. Defined-benefit pensions funded by the most profitable industrial economy in human history. Five social pillars — family, church, employer, government, similarity — all intact simultaneously, all bearing weight together. It worked. For thirty years, it worked.</p>\n<p>But an anomaly is not a model. A model is what you build when you study an anomaly — when you ask what conditions produced this, which of those conditions can be replicated deliberately, and how you construct systems that honor the underlying dynamics rather than depend on the accident. The golden era was never studied this way. The question was never asked.</p>\n<p>I still don’t believe it has been asked. I may be the only one, especially the only one from within the financial services industry, asking. Why did we not study this? Why have we not put these time periods under the microscope in this way? Why has it taken until now and this book to provide “the kick” needed to wake us up? Why did we not model the anomaly?</p>\n<p>Why? Because as long as the anomaly persisted, no one needed to understand it. It simply worked, the way a watch keeps time without anyone needing to know the mechanics.</p>\n<p>Then the conditions disappeared. The anomaly was ending. The question of what to replace it with should have been the defining policy question of the era.</p>\n<p>It was never asked.</p>\n<p>Instead, something else happened. Something that would prove to be the decisive act of the Codify era: the anomaly was not replaced with a model. It was replaced with a counterfeit that came in the form of accounts, individualism and the rise of shareholders. Broadly, there grew “the game” of retirement and “the industry.”</p>\n<p>One representative piece was the 401(k) account. To be honest, the 401(k) can be a type of scapegoat because it fits so nicely and is very representative. It is a much larger thing than how this particular tax code of the 1970’s was used. Nonetheless that is what a scapegoat was used for in the past as a representative sacrifice for the broader ‘sins.’ The 401(k) was and is an individual savings mechanism. A tax deferral. A fee structure. A critical piece to an industry built around accumulation. Fundamentally, none of these things were retirement — not in any meaningful sense of what that word had meant for thirty years. They did not pool risk. They did not guarantee income. They did not guarantee security. They did not protect the individual from the catastrophic uncertainty that community arrangements exist to absorb.</p>\n<p>Yet, this tax code was labelled retirement.</p>\n<p>This is the crime of the Codify era. Not that the new system was imperfect. Not that the transition was difficult. The crime is that the anomaly that could have been a model was instead replaced by something that wore the original&rsquo;s name while sharing none of its substance. The word stayed. The thing it described was quietly, thoroughly, replaced.</p>\n<p>No announcement. No debate. No acknowledgment that what was being codified bore only cosmetic resemblance to what it claimed to be.</p>\n<p>A generation of Americans were handed a counterfeit and told it was the original. The rules changed. Nobody said a thing. Here is where the conflation became complete.</p>\n<h2 id=\"ch-the-great-risk-transfer-how-the-game-changed\">The Great Risk Transfer: How the Game Changed</h2>\n<p>Understanding what the 401(k) did and what it symbolically represents requires understanding what it replaced — and why replacing it with something structurally opposite while keeping the same name was a defining act of the era.</p>\n<p>The defined-benefit pension was a community instrument dressed in corporate clothes. An employer promised a worker: work here for thirty years, and we will pay you a guaranteed monthly income for the rest of your life. The company bore the investment risk, the longevity risk, the inflation risk. Actuaries ran the numbers across thousands of employees. Risk was pooled. The individual retiree was protected from the catastrophic uncertainty of personal portfolio management because they were part of something larger than themselves.</p>\n<p>By the early 1980s, two-thirds of American workers had defined-benefit pension plans. Then came the 401(k). And the word retirement was quietly transferred to describe something that shared none of these features.</p>\n<p>No pooled risk. Individual accounts, bearing individual volatility. No guaranteed income. A balance that could grow or collapse depending on markets, decisions, timing, and luck. No institutional accountability. A matching contribution the employer could reduce or eliminate at will. No collective protection. You, alone, managing your own financial future with instruments you had never been trained to use.</p>\n<p>This was not retirement. It was savings with a retirement-shaped label. But the label was everything — because the label allowed the substitution to happen without acknowledgment.</p>\n<p>American corporations in the 1980s were under enormous pressure: global competition, rising labor costs, shrinking margins. Pension obligations showed up on balance sheets as massive liabilities. When 401(k) plans offered an alternative, corporate finance departments recognized immediately what they were looking at: a legal mechanism to transfer decades of financial risk from the institution to the worker, while framing the transfer as liberation.</p>\n<p>&ldquo;You don&rsquo;t want to be tied to one company for your whole career. You want control over your own destiny. You want to choose your own investments.&rdquo;</p>\n<p>It was the rhetorical triumph of the era. The language of autonomy — control, flexibility, portability, choice — was deployed to disguise what was actually happening: the largest transfer of financial risk in American history. From institutions that could handle that risk to individuals who could not. And they sold it as freedom.</p>\n<p>This is not a savings problem. It never was. It is a game problem. The rules of the game were rewritten in 1978, and the players were not informed. Workers kept showing up to play the old game while the institution had already left the field.</p>\n<h2 id=\"ch-the-ideology-individualism-as-civic-virtue\">The Ideology: Individualism as Civic Virtue</h2>\n<p>The 401(k) did not arrive in a political vacuum. It arrived in the Reagan revolution.</p>\n<p>Reagan&rsquo;s first inaugural address crystallized it: &ldquo;Government is not the solution to our problem; government is the problem.&rdquo; Margaret Thatcher&rsquo;s version was &ldquo;There is no such thing as society&rdquo; which has often been interpreted as an “every man for themselves” sentiment that is a seed of this time period. What both articulated — and what the economic consensus of the era absorbed wholesale — was that collective arrangements were either inefficient or immoral, and that individual initiative, individual saving, individual responsibility were not just practical necessities but expressions of personal virtue. You and your own bootstraps.</p>\n<p>In this ideological climate, converting workers from pension recipients to individual investors was not a corporate cost-cutting maneuver. It was moral progress. The retiree who managed her own 401(k) was exercising her freedom. The company that terminated its pension plan was liberating its workforce from dependency.</p>\n<p>Natural order economics sees this clearly as the violation it was. The natural order principle of community — that risk should be distributed, that no individual should bear alone what a community can distribute — was not replaced by something better. It was replaced by an ideology that redefined bearing risk alone as strength.</p>\n<h2 id=\"ch-the-industry-selling-tickets-to-a-destination-th\">The Industry: Selling Tickets to a Destination That No Longer Exists</h2>\n<p>You cannot transfer risk to individuals without an industry to manage the transfer.</p>\n<p>Between 1980 and 2010, the financial services industry grew from a back-office function of corporate America into one of the dominant sectors of the economy. Assets under management in mutual funds grew from $135 billion in 1980 to $11.9 trillion in 2010. The opening voice over narrative of the movie The Big Short captures this all too well.</p>\n<blockquote>\n<p>In the late seventies banking was not a job you went into to make large sums of money. It was a good stable profession like selling insurance or accounting…And America barely noticed as its number one industry became boring old banking. Then one day&hellip;almost thirty years later&hellip; in 2008&hellip; It all came crashing down.</p>\n</blockquote>\n<p>I need to say something here as someone who works and operates inside this industry: we were not building strategies for the people who needed them. We were perfecting strategies for a world that was disappearing, and selling them as universal truth that will always work.</p>\n<p>The financial advice industry became, in these thirty years, a modern-day equivalent of an assembly line factory profession. We perfected strategies for complete work cessation at 65 in a world where complete work cessation at 65 was becoming mathematically impossible for most Americans. We optimized withdrawal rates from multi-million-dollar portfolios for people who would never accumulate multi-million-dollar portfolios. We kept selling the dream of golf and grandchildren to people who were going to be working until they died.</p>\n<p>We were travel agents for a country that was falling off the map and we just kept doing the exact same thing.</p>\n<p>This is where &ldquo;your number&rdquo; was born. &ldquo;Your number&rdquo; — the single dollar figure you need to retire comfortably — became the central organizing myth of the Codify era. It was elegant, marketable, and wrong in almost every way that mattered. It assumed individual portfolio performance could substitute for institutional risk pooling. It assumed healthcare costs were predictable. It assumed longevity was manageable.</p>\n<p>Most importantly, &ldquo;your number&rdquo; transformed the question of retirement from a social question to a personal one. &ldquo;How do we ensure our aging population is cared for?&rdquo; became &ldquo;Did you save enough?&rdquo; The moral failure of a system that produced mass retirement insecurity was reframed as individual financial inadequacy. The structural problem became a character problem.</p>\n<h2 id=\"ch-the-numbers-that-should-have-stopped-us\">The Numbers That Should Have Stopped Us</h2>\n<p>The evidence was available. It was simply not heeded.</p>\n<p>The median 401(k) balance was consistently and catastrophically below what anyone&rsquo;s retirement math required. A household approaching retirement needed — at minimum, by the industry&rsquo;s own calculations — somewhere between $500,000 and $1,000,000 to sustain twenty to thirty years of modest income. Actual median balances for workers ages 55–64 hovered around $80,000 to $120,000 throughout the 1990s and 2000s.</p>\n<p>This was not a gap. This was a chasm. And it was a chasm that the structure of the system had made mathematically inevitable.</p>\n<p>The 401(k) system worked for workers who were consistently employed at companies with matching contributions, who earned enough that they had discretionary income to save, who had the financial literacy to allocate investments appropriately, who avoided catastrophic healthcare events. These workers existed. They were not the median. They were not the majority.</p>\n<p>You cannot save your way out of a rigged system. That is not a political statement. It is an arithmetic one. Think about the often thrown around target of $1 million as the goal nest egg for retirement. Now pair that with the reality that only 3% ever retire make that target.</p>\n<h2 id=\"ch-what-codify-leaves-behind\">What Codify Leaves Behind</h2>\n<p>A chapter called Codify should end with what was codified — and what was lost in the act of codification.</p>\n<p>The anomaly of 1950 could have been a model. That is the tragedy this chapter must carry. It was not inevitable that the end of the anomaly produced a counterfeit. The anomaly could have been studied. Its underlying dynamics could have been identified: pooled risk, guaranteed floors, contribution sustained across the lifespan. Systems could have been built that honored those dynamics deliberately rather than accidentally.</p>\n<p>Instead, between 1980 and 2010, American society codified five things that would prove catastrophic. It codified individual responsibility for collective risk. It codified accumulation as the measure of retirement readiness. It codified work as something to escape. It codified the ideology of independence. It codified age 65. It codified leisure as the escape. And it codified the name — transferring the word &ldquo;retirement&rdquo; from the thing it had described to the thing that replaced it, ensuring that most people would never realize what had happened.</p>\n<p>Are you watching closely?</p>\n<p>All along this history seeds were planted and allowed to grow unchecked and unexamined.</p>\n<p>The workers went to bed in one system and woke up in another, and both systems had the same name.</p>\n<p>The system did not break. It arrived. Everything that happens next was written in these thirty years.</p>\n<p>All of this leads to those that are age 60 in 2010 and those entering the workforce in 2010. If this book is a kick, 2008 for those people is a UFC fight.</p>","outline":[{"id":"the-great-risk-transfer-how-the-game-changed","text":"The Great Risk Transfer: How the Game Changed"},{"id":"the-ideology-individualism-as-civic-virtue","text":"The Ideology: Individualism as Civic Virtue"},{"id":"the-industry-selling-tickets-to-a-destination-th","text":"The Industry: Selling Tickets to a Destination That No Longer Exists"},{"id":"the-numbers-that-should-have-stopped-us","text":"The Numbers That Should Have Stopped Us"},{"id":"what-codify-leaves-behind","text":"What Codify Leaves Behind"}]},"downloads":{"pdf":"downloads/05-codify.pdf"},"unit":3,"role":"How we got here","chapterLabel":"Chapter 5 of the book","cultureEvents":[{"year":1989,"endYear":null,"title":"CNBC launches","detail":"CNBC began broadcasting on April 17, 1989, bringing all-day business news and live market prices into living rooms.","significance":"Money becomes television: fuel for both the Market Growth and Get Rich Quick seeds.","decline":null,"type":"culture","itemId":"m-cnbc-1989","master":true,"hand":"’89 CNBC $TV"},{"year":1991,"endYear":null,"title":"The World Wide Web goes public","detail":"Tim Berners-Lee’s World Wide Web became publicly available in August 1991, and CERN released it royalty-free in April 1993.","significance":"","decline":null,"type":"tech","itemId":"m-www-1991","master":true,"hand":"World Wide Web"},{"year":1994,"endYear":null,"title":"Amazon is founded","detail":"Jeff Bezos founded Amazon in July 1994 as an online bookstore.","significance":"","decline":null,"type":"tech","itemId":"m-amazon-1994","master":true,"hand":"Amazon ’94"},{"year":1995,"endYear":null,"title":"The O.J. Simpson trial","detail":"The televised murder trial of O.J. Simpson ended in an acquittal on October 3, 1995, one of the most-watched events of the decade.","significance":"","decline":null,"type":"culture","itemId":"m-oj-1995","master":true,"hand":"OJ"},{"year":1999,"endYear":null,"title":"Y2K","detail":"Fear that computers would fail when dates rolled over to 2000 prompted a costly worldwide fix. The new year arrived with few problems.","significance":"","decline":null,"type":"tech","itemId":"m-y2k","master":true,"hand":"Y2K"}]},{"id":"climax","number":4,"title":"Climax","years":"1950–1980","definition":"cli·max (noun) the height of something","tagline":"For thirty years retirement worked—once, for some, and never again at scale.","bigQuestion":"Was the golden age of retirement a model we could rebuild, or an anomaly we mistook for one?","overview":"From roughly 1950 to 1980, the book argues, retirement actually worked—materially, for millions of Americans, for the first time in history. Social Security expanded and finally kept pace with inflation; union-negotiated pensions spread through steel, autos, rubber, and mining; and Medicare, created in 1965, armored older households against the medical bills that had ruined so many. Leisure stopped being a moment and became a destination: in 1960 about 100,000 people turned out for the opening weekend of Sun City, Arizona. Elderly poverty fell from 35.2 percent in 1959 to 14.6 percent in 1974.\n\nGrimm’s central claim is that this was an anomaly, not a model. It rested on ten pillars that could not last—five economic (manufacturing hegemony, a demographic dividend, cheap energy, capital markets with limited global competition, productivity growth) and five social (institutional trust, an intergenerational compact, a culture of deferred gratification, geographic stability, and the one-earner nuclear family as a design specification).\n\nBy the 1970s the pillars were cracking: the dollar left gold, oil quadrupled, stocks fell 48 percent, and inflation passed 11 percent. Congress answered with ERISA, the IRA, and, almost unnoticed, Section 401(k). Your task in this module is to weigh the book’s thesis against the evidence of what actually worked.","learningObjectives":["Explain how Social Security expansion, defined-benefit pensions, and Medicare combined into the “three-legged stool” of postwar retirement security.","Evaluate the book’s “anomaly vs. model” thesis by testing each of the ten pillars against economic and demographic data.","Analyze who was included in and excluded from the golden age, using evidence on pension coverage, vesting, race, and sex.","Trace how the shocks of 1971–1980—the end of gold convertibility, the oil embargo, the 1973–74 bear market, and stagflation—strained the system.","Compare the retirement prospects of the 1920 and 1960 birth cohorts at the 1980 threshold using the Two-Person Lens."],"policyEvents":[{"year":1950,"title":"Social Security Amendments of 1950","type":"legislation","detail":"Signed by President Truman on August 28, 1950, the amendments raised benefits for current beneficiaries by an average of about 77 percent and extended coverage to roughly 10 million more people, including regularly employed farm and domestic workers and most of the nonfarm self-employed. State and local government and nonprofit employees could join on an elective basis.","significance":"Social Security moved from a modest floor toward an adequate base income—the leg of the stool that would carry the most weight and outlast the others.","itemId":"climax-pol-0"},{"year":1950,"title":"The “Treaty of Detroit”","type":"policy","detail":"On May 23, 1950, General Motors and the United Auto Workers reached a five-year contract—a private collective-bargaining agreement—that included a fully funded pension of $125 a month counting Social Security, continued cost-of-living raises, and GM payment of half the cost of health coverage. Fortune magazine dubbed it the “Treaty of Detroit.”","significance":"The Promise (seed 8) in its purest form: long-term security in exchange for labor peace, tying a worker’s old age to one company’s fortunes.","itemId":"climax-pol-1"},{"year":1956,"title":"Disability insurance and early retirement","type":"legislation","detail":"After a 1954 “disability freeze” protected the records of disabled workers, the 1956 amendments paid cash benefits to disabled workers aged 50–64 and to disabled adult children. They also let women claim reduced retirement benefits at 62; the 1961 amendments extended the age-62 option to men.","significance":"Age 62 created an earlier exit ramp without retiring the cultural meaning of 65—seed 3 now had a soft and a hard boundary.","itemId":"climax-pol-2"},{"year":1963,"endYear":null,"title":"Equal Pay Act","detail":"Signed June 10, 1963, the act required equal pay for women and men doing substantially equal work in the same workplace.","significance":"Wages drive savings, pensions and Social Security benefits. A pay gap becomes a retirement gap.","decline":null,"type":"legislation","itemId":"m-equal-pay-1963","master":true,"hand":"Equal Pay Act"},{"year":1965,"title":"Medicare and Medicaid","type":"legislation","detail":"President Johnson signed the law on July 30, 1965, at the Truman Library in Independence, Missouri, and Harry Truman became Medicare’s first enrollee. Nearly 20 million beneficiaries enrolled in Medicare in its first three years.","significance":"The third leg of the stool: the book argues medical catastrophe had been retirement’s hidden enemy, and Medicare armored older households against it.","itemId":"climax-pol-3","master":true,"hand":"Medicare + Medicaid"},{"year":1967,"title":"Age Discrimination in Employment Act","type":"legislation","detail":"The ADEA barred employment discrimination against workers aged 40 to 65. Congress raised the upper limit to 70 in 1978 and eliminated it in 1986, ending most mandatory retirement.","significance":"As first written, the law protected workers only until 65—quietly confirming 65 = Old and Done (seed 3) even as it fought age bias.","itemId":"climax-pol-4"},{"year":1968,"endYear":null,"title":"Fair Housing Act","detail":"Signed April 11, 1968, Title VIII of the Civil Rights Act of 1968 banned discrimination in the sale, rental and financing of housing.","significance":"Outlawed redlining going forward, but could not return the decades of home equity families had been denied.","decline":null,"type":"legislation","itemId":"m-fair-housing-1968","master":true,"hand":"’68 Fair Housing Act to end REDLINING"},{"year":1972,"title":"Social Security Amendments of 1972","type":"legislation","detail":"A July 1972 law raised benefits 20 percent and created automatic cost-of-living adjustments, first paid in January 1975. An October 1972 law created Supplemental Security Income (SSI), a federal means-tested benefit for aged, blind, and disabled people that began January 1, 1974.","significance":"The book calls automatic COLAs the high-water mark of the program’s ambition: for the first time, inflation could not quietly erode a promised benefit.","itemId":"climax-pol-5"},{"year":1974,"title":"Employee Retirement Income Security Act (ERISA)","type":"legislation","detail":"Signed by President Ford on September 2, 1974, ERISA set federal standards for private-plan reporting, funding, participation, vesting, and fiduciary conduct and created the Pension Benefit Guaranty Corporation to insure defined-benefit pensions. It also created the individual retirement account for workers without an employer plan, with deductible contributions up to the lesser of $1,500 or 15 percent of earnings.","significance":"ERISA protected The Promise after Studebaker—but its IRA quietly introduced the individual account into federal retirement policy.","itemId":"climax-pol-6","master":true,"hand":"ERISA · IRA"},{"year":1974,"endYear":null,"title":"Equal Credit Opportunity Act","detail":"Signed October 28, 1974, and effective in 1975, the act barred lenders from discriminating on the basis of sex or marital status; 1976 amendments added race, color, religion, national origin and age. Before it, lenders often refused women credit in their own names or required a husband’s signature.","significance":"Credit in your own name comes before owning a home or a business, two of the main ways families build wealth for later life.","decline":null,"type":"legislation","itemId":"m-ecoa-1974","master":true,"hand":"Equal Credit Opportunity Act. Women get the right to have bank acct + credit + loans w/o male co-signer."},{"year":1977,"title":"Social Security Amendments of 1977","type":"legislation","detail":"Stagflation had exposed a flaw in the 1972 COLA method that over-indexed benefits for new retirees and threatened solvency. The 1977 amendments raised payroll taxes and the taxable wage base, slightly reduced future benefits, and switched to wage indexing, with a transition that produced the so-called “notch” for people born in 1917–1921.","significance":"The first major retrenchment: the anomaly’s arithmetic had to be repaired, and the people who paid were the cohort about to retire.","itemId":"climax-pol-7"},{"year":1977,"endYear":null,"title":"Community Reinvestment Act","detail":"Signed October 12, 1977, the act requires federal regulators to assess whether banks meet the credit needs of their whole communities, including low- and moderate-income neighborhoods.","significance":"The third step in the redlining thread: from drawing the lines (1930s), to banning them (1968), to requiring lending inside them (1977).","decline":null,"type":"legislation","itemId":"m-cra-1977","master":true,"hand":"’77 Community Reinvestment Act — combat REDLINING"},{"year":1978,"title":"Revenue Act of 1978: Section 401(k)","type":"legislation","detail":"Signed by President Carter on November 6, 1978, a tax bill added Section 401(k) to the Internal Revenue Code, effective January 1, 1980, letting employees defer part of their pay into qualified plans before tax. The same law created simplified employee pensions (SEPs).","significance":"Grimm writes that the rules of the game were rewritten in 1978 and the players were not informed; historians of the provision note it was not designed to replace pensions.","itemId":"climax-pol-8","master":true,"hand":"401K → seed: Individualism"}],"marketDrops":[{"year":1961,"endYear":1962,"name":"The Kennedy Slide","decline":"−28.0% (S&P 500, Dec. 12, 1961 – June 26, 1962)","detail":"Stocks fell 28 percent in about six months in the middle of the postwar boom. The S&P 500 regained its prior high in September 1963.","retirementImpact":"A quick recovery reinforced the era’s belief that markets bend but do not break—while most workers’ retirement income still came from pooled, guaranteed sources.","itemId":"climax-mar-0","type":"crisis"},{"year":1968,"endYear":1970,"name":"The 1968–70 bear market","decline":"−36.1% (S&P 500, Nov. 29, 1968 – May 26, 1970)","detail":"As inflation rose and the economy slid into the 1969–70 recession, the S&P 500 lost more than a third of its value. It did not break even until March 1972.","retirementImpact":"For anyone counting on stocks, it was the first serious postwar test of the Market Growth seed (4); most workers’ retirement income still came from guaranteed sources.","itemId":"climax-mar-1","type":"crisis"},{"year":1973,"endYear":1974,"name":"The oil-shock bear market","decline":"−48.2% (S&P 500, Jan. 11, 1973 – Oct. 3, 1974)","detail":"The oil embargo, accelerating inflation, and recession drove the S&P 500 down by nearly half; ERISA was signed a month before the bottom. The index did not regain its 1973 high until July 1980, and with inflation above 11 percent in 1974, real losses ran deeper still.","retirementImpact":"Pension sponsors watched invested assets shrink just as ERISA’s new funding standards arrived—pressure the book links to the corporate appetite for alternatives such as the 401(k).","itemId":"climax-mar-2","type":"crisis"},{"year":1976,"title":"The first index fund for individual investors","detail":"John Bogle launched the First Index Investment Trust (now the Vanguard 500 Index Fund) on August 31, 1976. It hoped to raise $50–150 million and raised a little more than $11 million, an outcome Bogle called “an abject failure.”","itemId":"climax-his-4","type":"money"}],"socialMovements":[{"year":1954,"endYear":1968,"title":"The civil rights movement","detail":"From the Montgomery bus boycott to the Civil Rights, Voting Rights and Fair Housing Acts, a mass movement dismantled legal segregation.","significance":"Won formal equality, while systems built on earlier exclusions, in housing and in retirement, kept compounding.","decline":null,"type":"movement","itemId":"m-civil-rights","master":true,"hand":"Civil Rights Movement"},{"year":1958,"name":"AARP","detail":"Retired teacher Ethel Percy Andrus, who had founded the National Retired Teachers Association in 1947, incorporated the American Association of Retired Persons on July 1, 1958, after hundreds of non-teachers wrote asking for access to affordable health insurance.","significance":"Retirees became an organized constituency—a consumer market and, before long, one of the most influential lobbies in American politics.","itemId":"climax-soc-0","type":"movement"},{"year":1961,"endYear":1965,"name":"National Council of Senior Citizens and the Medicare campaign","detail":"Formally announced in July 1961 with seed money from the AFL-CIO and unions such as the UAW and Steelworkers, the NCSC organized union retirees through rallies—including a televised event at Madison Square Garden—letter-writing, and pressure on opponents to win health insurance for the aged.","significance":"Organized labor carried its fight for security beyond the bargaining table into national politics, helping deliver Medicare in 1965.","itemId":"climax-soc-1","type":"movement"},{"year":1970,"name":"Gray Panthers","detail":"Forced to retire from her job with the Presbyterian Church at 65 in 1970, Maggie Kuhn and friends in similar circumstances founded the group that became the Gray Panthers. It campaigned on pension rights and age discrimination under the banner of “young and old together.”","significance":"The first organized challenge to 65 = Old and Done (seed 3); the movement helped bring about the end of most forced-retirement rules.","itemId":"climax-soc-2","type":"movement"}],"inequities":[{"title":"A golden age for a minority","detail":"Private pensions covered about 22 percent of private wage and salary workers in 1950 and about 44 percent at the end of 1974. In 1979, at the system’s height, 38 percent of private-sector wage and salary workers participated in a defined-benefit plan—so even at the peak, most private-sector workers were not in the kind of pension the era is remembered for.","vars":["job"]},{"title":"The vesting cliff","detail":"Before ERISA there was no federal minimum vesting standard. When Studebaker closed its South Bend plant and terminated its pension in 1963, about 3,600 older retirees received full benefits, about 4,000 active workers received roughly 15 percent of what they expected, and thousands under 40 lost their benefits entirely.","vars":["job"]},{"title":"Women by design","detail":"The book calls the one-earner household a “design specification”: wives’ security came through husbands’ earnings records and pensions. Divorced wives became eligible for Social Security spousal benefits only in 1965, and until the Retirement Equity Act of 1984 a worker could waive his pension’s survivor benefit without his wife’s written consent.","vars":["gender"]},{"title":"The color line of the bloom","detail":"Farm and domestic workers—disproportionately Black—were not fully covered by Social Security until 1954, and federal law did not prohibit employment discrimination by race or sex until Title VII of the Civil Rights Act, signed July 2, 1964. Exclusion from union, pension-bearing jobs and from redlined suburbs meant the era’s three legs of security were unevenly available by race.","vars":["race","job"]},{"title":"Poverty at the peak","detail":"Elderly poverty fell dramatically—from 35.2 percent in 1959 to 14.6 percent in 1974—but it never vanished. In 1980, at the close of the golden age, 15.7 percent of Americans 65 and older still lived below the official poverty line.","vars":["income"]}],"historicalContext":[{"year":1954,"endYear":null,"title":"Brown v. Board of Education","detail":"On May 17, 1954, the Supreme Court ruled that state-mandated segregation of public schools violates the Fourteenth Amendment.","significance":"Education is now one of the strongest predictors of household wealth. Who could attend which schools shaped who would later retire securely.","decline":null,"type":"history","itemId":"m-brown-1954","master":true,"hand":"Brown v Board of Education ’54"},{"year":1957,"endYear":null,"title":"Sputnik and the space race","detail":"The Soviet Union launched Sputnik, the first artificial satellite, on October 4, 1957.","significance":"","decline":null,"type":"history","itemId":"m-sputnik-1957","master":true,"hand":"Space race · Sputnik ’57"},{"year":1960,"title":"The demographic dividend shrinks","detail":"The ratio of covered workers to Social Security beneficiaries fell from 16.5 in 1950 to 5.1 in 1960 and 3.2 by 1980 as the program matured. Meanwhile a man reaching 65 could expect about 13.1 more years in 1950 and 14.6 in 1980; a woman, 16.2 and 19.1.","itemId":"climax-his-0","type":"history"},{"year":1962,"endYear":null,"title":"The Cuban Missile Crisis","detail":"In October 1962 the United States and the Soviet Union came to the brink of nuclear war over Soviet missiles in Cuba.","significance":"","decline":null,"type":"history","itemId":"m-cuba-1962","master":true,"hand":"Cuban missile crisis ’62"},{"year":1963,"endYear":null,"title":"President Kennedy is assassinated","detail":"John F. Kennedy was assassinated in Dallas on November 22, 1963.","significance":"","decline":null,"type":"history","itemId":"m-jfk-1963","master":true,"hand":"JFK"},{"year":1964,"title":"Civil Rights Act","detail":"Signed July 2, 1964, the Act’s Title VII prohibited employment discrimination based on race, color, religion, sex, or national origin and created the Equal Employment Opportunity Commission.","itemId":"climax-his-1","type":"history","master":true,"hand":"Civil Rights Act"},{"year":1965,"endYear":1973,"title":"The Vietnam War","detail":"U.S. combat troops arrived in Vietnam in 1965 and the last left in 1973. Saigon fell in 1975.","significance":"The Climax chapter names Vietnam and Watergate as what corroded the institutional trust that collective promises depend on.","decline":null,"type":"history","itemId":"m-vietnam","master":true,"hand":"Vietnam War"},{"year":1968,"endYear":null,"title":"Martin Luther King Jr. is assassinated","detail":"King was assassinated in Memphis on April 4, 1968. Congress passed the Fair Housing Act a week later.","significance":"","decline":null,"type":"history","itemId":"m-mlk-1968","master":true,"hand":"MLK"},{"year":1971,"title":"The Nixon shock","detail":"On August 15, 1971, President Nixon ended the dollar’s convertibility to gold, imposed a 90-day wage and price freeze, and added a 10 percent import surcharge. The Bretton Woods system that had anchored the postwar order soon collapsed.","itemId":"climax-his-2","type":"history"},{"year":1972,"endYear":1974,"title":"Watergate","detail":"The June 1972 break-in at the Democratic National Committee’s offices led to President Nixon’s resignation on August 9, 1974.","significance":"With Vietnam, the book’s example of trust in institutions eroding just as retirement depended on it.","decline":null,"type":"history","itemId":"m-watergate","master":true,"hand":"Watergate"},{"year":1973,"endYear":1974,"title":"The oil embargo","detail":"Arab oil producers embargoed the United States from October 19, 1973, to March 1974, and the price of oil nearly quadrupled, from about $2.90 to $11.65 a barrel. The book reads the embargo as the announcement that cheap energy—one of its five economic pillars—had ended.","itemId":"climax-his-3","type":"history"},{"year":1979,"endYear":1980,"title":"Stagflation peaks","detail":"U.S. consumer-price inflation reached 11.1 percent in 1974, 11.3 percent in 1979, and 13.5 percent in 1980, alongside weak growth. Fixed incomes without cost-of-living protection lost purchasing power rapidly.","itemId":"climax-his-5","type":"history"},{"year":1979,"endYear":1982,"title":"Iran, the energy crisis and the early-1980s recession","detail":"The Iranian Revolution sent oil prices soaring in 1979. To break double-digit inflation the Federal Reserve pushed interest rates to record highs (the prime rate reached 21.5 percent), and unemployment hit 10.8 percent in late 1982, the highest since the Great Depression.","significance":"High rates and inflation strained pensions and household budgets just as the 401(k) arrived.","decline":null,"type":"history","itemId":"m-iran-1979","master":true,"hand":"Iran · Energy crisis ’79–’82 · High % rate → Worst recession since Great Depression. ↑ Unemploy · ↑ Inflation · Global crisis."}],"seeds":[{"seed":1,"stage":"growing","detail":"Formal exclusions narrowed—farm and domestic workers were fully covered by 1954 and Title VII banned job discrimination in 1964—but boundaries persisted through pension coverage, redlined housing, and the uneven reach of union jobs. The book calls this the seed of boundaries operating inside the bloom."},{"seed":2,"stage":"blooming","detail":"Washington built out every leg of the stool: coverage expansion (1950), disability insurance (1956), Medicare (1965), automatic COLAs and SSI (1972), and ERISA’s pension protections (1974). The same era created the IRA (1974) and Section 401(k) (1978), the instruments of the next chapter."},{"seed":3,"stage":"growing","detail":"Sixty-five hardened into an identity: the ADEA protected workers only until 65, leaving retirement at 65 enforceable, and age 62 added an earlier exit without changing the endpoint. The Gray Panthers’ founding in 1970 began the first organized resistance."},{"seed":4,"stage":"sprouting","detail":"Defined-contribution plan assets more than doubled from $74 billion in 1975 to $162 billion in 1980, and Bogle’s 1976 index fund offered individuals a low-cost way into the whole market. The 1973–74 bear market tested the belief that stocks reliably rise and could carry retirement."},{"seed":5,"stage":"blooming","detail":"The seed planted in the 1920s blooms. Sun City’s 1960 opening drew about 100,000 visitors and a Time cover story, and retirement became a lifestyle with its own communities, products, and imagery. The book: leisure was not escape, it was arrival."},{"seed":7,"stage":"growing","detail":"The industrial, unionized, covered America collected pensions, Social Security, and Medicare together; workers outside those sectors relied on Social Security alone or, after 1974, SSI. The stool had three legs for some Americans and one for others."},{"seed":8,"stage":"blooming","detail":"The Treaty of Detroit made the employer pension a cultural norm: thirty years with one company, then a check for life. Studebaker’s 1963 failure showed how fragile The Promise was, and ERISA’s 1974 rescue confirmed that its failure was experienced as betrayal."}],"twoPersonLens":{"year":1980,"older":{"born":1920,"headline":"Cashing out the promise","text":"Born in 1920, they were nine when the market crashed and thirteen when one in four workers had no job. They turned twenty the year Ida May Fuller received the first check, and spent their early twenties in uniform. The GI Bill, a union card, a pension negotiated in the Treaty of Detroit era, a house in the suburbs—they built the golden age and lived inside it. Now 60, they can see the finish line: a defined-benefit check for life, Social Security that has risen with inflation since 1975, Medicare at 65. One small betrayal: as a “notch baby,” born 1917–1921, their benefit will be smaller than a neighbor born a few years earlier. Still, they are about to collect on the promise."},"younger":{"born":1960,"headline":"Handed a calculator","text":"Born in 1960, the year Sun City opened, they were five when Medicare passed and grew up assuming pensions, suburbs, and rising wages were simply how life works—the anomaly, though told it was the template. They were thirteen when the oil embargo hit and fourteen when stocks bottomed after losing nearly half their value. Now 20, they enter a labor market with inflation above 13 percent, the year Section 401(k) takes effect. Within a few years their full Social Security retirement age will be pushed to 67, and their employer will more likely offer an account than a pension. They will be in their late forties when the 2008 crash cuts stocks by more than half."},"irony":"In 1980 the 60-year-old was cashing out a promise; the 20-year-old was being handed a calculator and told “good luck.”"},"keyTerms":[{"term":"Three-legged stool","definition":"The metaphor for postwar retirement income resting on Social Security, employer pensions, and personal savings; the book’s draft adds Medicare to the government leg."},{"term":"Anomaly vs. model","definition":"Grimm’s distinction: a model has transferable mechanisms that can be studied and rebuilt, while an anomaly depends on unrepeatable conditions. The book argues 1950–1980 was an anomaly mistaken for a model."},{"term":"Cost-of-living adjustment (COLA)","definition":"An automatic increase in benefits tied to inflation. Social Security’s automatic COLAs, enacted in 1972, were first paid in 1975."},{"term":"Vesting","definition":"The point at which a worker earns a non-forfeitable right to pension benefits. ERISA set the first federal minimum vesting standards in 1974."},{"term":"Pension Benefit Guaranty Corporation (PBGC)","definition":"The federal agency created by ERISA to insure private defined-benefit pensions when plans fail. It paid its first pension check, for $140.75, on February 28, 1975."},{"term":"Individual retirement account (IRA)","definition":"A tax-favored personal retirement account created by ERISA in 1974, initially for workers without an employer plan."},{"term":"Supplemental Security Income (SSI)","definition":"A federal means-tested cash benefit for low-income aged, blind, and disabled people, created in 1972 and paid from January 1974."},{"term":"Stagflation","definition":"The combination of high inflation and weak economic growth that marked the 1970s, eroding fixed incomes and straining pension finances."},{"term":"Index fund","definition":"A fund that holds the securities in a market index rather than picking stocks. Bogle’s 1976 fund made the approach available to individual investors."}],"keyFigures":[{"name":"Walter Reuther","role":"President of the United Auto Workers whose 1950 contract with General Motors—the “Treaty of Detroit”—set the pattern for funded pensions, health coverage, and cost-of-living raises in exchange for long-term labor peace."},{"name":"Ethel Percy Andrus","role":"Retired teacher who founded the National Retired Teachers Association in 1947 and AARP in 1958, turning retirees into an organized constituency."},{"name":"Del Webb","role":"Developer whose company opened Sun City, Arizona, on January 1, 1960, giving the Search for Leisure (seed 5) a physical address and a marketable image."},{"name":"Maggie Kuhn","role":"Forced out of her church job at 65 in 1970, she co-founded the Gray Panthers and challenged mandatory retirement and the idea that age 65 marks the end of usefulness."},{"name":"Jacob Javits","role":"New York senator who introduced pension reform legislation in 1967 after the Studebaker failure, beginning the push that produced ERISA in 1974."}],"primarySources":[{"title":"The Social Security Act Amendments of 1950: A Summary and Legislative History","year":1950,"source":"SSA History","url":"https://ssa.gov/history/1950amend.html","why":"Identify which groups were newly covered and how planners justified the size of the benefit increase."},{"title":"LBJ’s remarks at the signing of the Medicare bill, Independence, Missouri","year":1965,"source":"SSA History","url":"https://www.ssa.gov/history/lbjstmts.html","why":"Notice how Johnson frames Medicare as a moral obligation to older Americans—and how he links it to Truman’s earlier failed attempt."},{"title":"Legislative history of the Social Security Amendments of 1972","year":1972,"source":"SSA History","url":"https://www.ssa.gov/history/1972amend.html","why":"Trace how automatic COLAs were justified and what assumptions about inflation and wages were built into them."},{"title":"The Social Security “Notch” archive","year":1977,"source":"SSA History","url":"https://www.ssa.gov/history/notchfile1.html","why":"Follow how a technical fix to the 1972 formula became a lasting grievance for the cohort born in 1917–1921."},{"title":"Private Pension Plan Bulletin Historical Tables and Graphs, 1975–2023","year":1975,"source":"U.S. Department of Labor, EBSA","url":"https://www.dol.gov/sites/default/files/ebsa/researchers/statistics/retirement-bulletins/private-pension-plan-bulletin-historical-tables-and-graphs.pdf","why":"Use Tables E1 and E7 to see how many defined-benefit and defined-contribution plans and participants existed at the end of the golden age."}],"discussionQuestions":["Choose two of the book’s ten pillars—one economic, one social. What evidence shows each pillar was in place from 1950 to 1980, and what evidence shows it eroding by 1980?","Test the book’s argument: elderly poverty fell from 35.2 percent in 1959 to 14.6 percent in 1974, largely through deliberate legislation (benefit increases, Medicare, COLAs, SSI). Does this record suggest that at least part of the golden age was a replicable model rather than an accident of conditions? Use data to defend your answer.","Studebaker’s 1963 failure and ERISA’s 1974 response show The Promise being broken and then repaired. Why might the book describe broken pension promises as a moral betrayal rather than a financial loss?","Sun City sold retirement as a reward. How did the Search for Leisure change what Americans expected retirement to be, and who could afford the version being sold?","If the system was designed around a one-earner household, what happened to people who did not fit the design—single women, divorced wives, workers in uncovered or nonunion jobs?","Congress created the IRA (1974) and Section 401(k) (1978) while the defined-benefit system was at its height. Were these complements to the pension system, or the first move toward replacing it? What evidence would you need to decide?"],"assignment":{"title":"Anomaly or Model? A Debate Brief","type":"Debate brief with data","prompt":"You will be assigned a side: the golden age of retirement (1950–1980) was (A) an unrepeatable anomaly, as the book argues, or (B) a replicable model whose core mechanisms could be rebuilt today. Using the book’s ten pillars as your framework, evaluate at least six pillars with quantitative evidence—for example, worker-to-beneficiary ratios, elderly poverty rates, pension coverage, inflation, oil prices, or life expectancy at 65. For each pillar, state whether it was a condition (unrepeatable) or a mechanism (designable), and why. Include one chart you build from an official data source. Anticipate the strongest two arguments from the other side and rebut them. End with a one-paragraph policy implication: what, if anything, from 1950–1980 should be rebuilt?","deliverable":"1,500–1,800 word debate brief with one original chart, at least five cited sources (at least three official data sources such as SSA, Census, BLS, or DOL), and a 3-minute opening statement for in-class debate.","points":100,"rubric":[{"criterion":"Use of evidence & data","points":30,"exemplary":"Each of six or more pillars is assessed with accurate, well-chosen data from official sources; the chart is clear, correctly labeled, and central to the argument.","proficient":"Most pillars supported with accurate data; chart present and readable.","developing":"Data thin, partly inaccurate, or not tied to specific pillars; chart decorative.","beginning":"Little or no data; chart missing or misleading."},{"criterion":"Analytical framework","points":30,"exemplary":"Sharply distinguishes conditions from mechanisms for each pillar and shows how pillars depended on one another.","proficient":"Applies the condition/mechanism distinction consistently with some interdependence noted.","developing":"Framework applied unevenly or mostly descriptive.","beginning":"Framework absent or misunderstood."},{"criterion":"Engagement with counterarguments","points":20,"exemplary":"States the opposing side’s two strongest arguments fairly and rebuts them with evidence.","proficient":"Addresses two counterarguments with reasonable rebuttals.","developing":"Counterarguments weak, straw-manned, or only partly answered.","beginning":"No engagement with the other side."},{"criterion":"Policy implication & communication","points":20,"exemplary":"Concise, specific implication that follows from the analysis; brief and oral statement are polished and persuasive.","proficient":"Clear implication and organized presentation with minor lapses.","developing":"Implication vague or disconnected; presentation uneven.","beginning":"No implication; disorganized."}]},"quiz":[{"q":"What did the Social Security Amendments of 1972 add that the book calls the program’s high-water mark?","options":["Medicare","Automatic cost-of-living adjustments, first paid in 1975","Disability insurance","Coverage for farm workers"],"answer":1,"explain":"The 1972 amendments created automatic COLAs, first paid in January 1975, so that inflation could no longer quietly erode benefits."},{"q":"What happened to Studebaker workers’ pensions when the company closed its South Bend plant in 1963?","options":["The PBGC paid everyone in full","Older retirees were paid in full, about 4,000 active workers got roughly 15 percent, and most under 40 got nothing","All workers received lump sums equal to their contributions","The UAW took over the plan and paid full benefits"],"answer":1,"explain":"With no federal insurance yet, about 3,600 older retirees got full benefits, about 4,000 active workers got roughly 15 percent, and thousands under 40 lost everything; the PBGC did not exist until 1974."},{"q":"Which of these did ERISA (1974) NOT do?","options":["Create the Pension Benefit Guaranty Corporation","Set minimum vesting and funding standards","Create the individual retirement account","Create Section 401(k)"],"answer":3,"explain":"Section 401(k) came from the Revenue Act of 1978, effective in 1980; ERISA created the PBGC, the IRA, and federal vesting and funding standards."},{"q":"How did the ratio of covered workers to Social Security beneficiaries change from 1950 to 1980?","options":["It rose from 3.2 to 16.5","It stayed near 5","It fell from 16.5 to 3.2","It fell from 159 to 42"],"answer":2,"explain":"As the program matured, the ratio fell from 16.5 in 1950 to 3.2 in 1980—the demographic dividend the book counts among its five economic pillars."},{"q":"What triggered Maggie Kuhn’s founding of the group that became the Gray Panthers in 1970?","options":["Being forced to retire at 65","The passage of Medicare","The Studebaker bankruptcy","The 1973 oil embargo"],"answer":0,"explain":"Kuhn was forced to retire from her job with the Presbyterian Church at 65 and organized others in the same situation."}],"sources":[{"label":"SSA — Social Security Act Amendments of 1950","url":"https://ssa.gov/history/1950amend.html"},{"label":"SSA — Brief History of Social Security","url":"https://www.ssa.gov/history/briefhistory3.html"},{"label":"SSA — 1972 Amendments legislative history","url":"https://www.ssa.gov/history/1972amend.html"},{"label":"SSA — The Notch archive","url":"https://www.ssa.gov/history/notchfile1.html"},{"label":"SSA — LBJ Medicare signing remarks","url":"https://www.ssa.gov/history/lbjstmts.html"},{"label":"SSA — Ratio of covered workers to beneficiaries","url":"https://www.ssa.gov/history/ratios.html"},{"label":"SSA — Life expectancy at 65 by cohort","url":"https://www.ssa.gov/history/lifeexpect.html"},{"label":"DeWitt, Social Security Bulletin 70(4) — farm and domestic coverage 1950/1954","url":"https://www.ssa.gov/policy/docs/ssb/v70n4/v70n4p49.html"},{"label":"Skolnik, “Private Pension Plans, 1950–74,” Social Security Bulletin","url":"https://www.ssa.gov/policy/docs/ssb/v39n6/v39n6p3.pdf"},{"label":"CRS R41479 — Social Security spousal and survivor benefits","url":"https://www.everycrsreport.com/files/20190206_R41479_9dd58a12f19d5f8169be00c92b77272757011d84.html"},{"label":"Reuther’s Treaty of Detroit","url":"https://en.wikipedia.org/wiki/Reuther%27s_Treaty_of_Detroit"},{"label":"Lawyers, Guns & Money — Labor history: May 23, 1950","url":"https://www.lawyersgunsmoneyblog.com/2018/05/day-labor-history-may-23-1950"},{"label":"LBJ Presidential Library — Medicare and Medicaid Act","url":"https://www.lbjlibrary.org/news-and-press/media-kits/medicare-and-medicaid"},{"label":"CRS — ADEA legal overview","url":"https://www.everycrsreport.com/files/20100623_RL34652_9b42b12308b299998a4ac68411ef96babfb64c11.html"},{"label":"CRS 97-479 — ADEA amendments of 1978 and 1986","url":"https://www.everycrsreport.com/reports/97-479.html"},{"label":"PBGC — History","url":"https://www.pbgc.gov/about/who-we-are/history"},{"label":"PBGC — Studebaker","url":"https://www.pbgc.gov/about/pbgc-pensions-studebaker"},{"label":"ICI — Happy Birthday ERISA","url":"https://www.ici.org/viewpoints/view_14_HB_ERISA"},{"label":"CRS 96-20 — IRA legislative history","url":"https://www.everycrsreport.com/reports/96-20.html"},{"label":"PSCA — 401(k) history","url":"https://www.psca.org/node/242"},{"label":"ASPPA — The “real” 401(k) Day","url":"https://www.asppa-net.org/news/2025/11/the-real-401k-day/"},{"label":"Workforce — Rise and fall of employer-sponsored pension plans","url":"https://workforce.com/news/the-rise-and-fall-of-employer-sponsored-pension-plans"},{"label":"EBRI — DB and DC participation, 1979 vs. 2017","url":"https://www.ebri.org/retirement/content/only-11-percent-of-us-private-sector-wage-and-salary-workers-participate-in-defined-benefit-pension-plans"},{"label":"AARP — Founding days","url":"https://www.aarp.org/about-aarp/history/aarp-founding-days/"},{"label":"Sun City, Arizona","url":"https://en.wikipedia.org/wiki/Sun_City,_Arizona"},{"label":"Alliance for Retired Americans (NCSC history)","url":"https://en.wikipedia.org/wiki/Alliance_for_Retired_Americans"},{"label":"National Women’s Hall of Fame — Maggie Kuhn","url":"https://www.womenofthehall.org/inductee/maggie-kuhn/"},{"label":"National Archives — Civil Rights Act of 1964","url":"https://www.archives.gov/milestone-documents/civil-rights-act"},{"label":"Federal Reserve History — Nixon ends gold convertibility","url":"https://www.federalreservehistory.org/essays/gold-convertibility-ends"},{"label":"Federal Reserve History — Oil Shock of 1973–74","url":"https://www.federalreservehistory.org/essays/oil-shock-of-1973-74"},{"label":"Vanguard — 50 years of indexing","url":"https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/50-years-50-facts-indexing-since-1976.html"},{"label":"Yardeni Research — S&P 500 bear market tables","url":"https://archive.yardeni.com/pub/sp500corrbeartables.pdf"},{"label":"Stacker/KEYT — S&P 500 corrections and recovery times since 1950","url":"https://keyt.com/stacker-business-economy/2026/08/12/every-major-stock-market-correction-since-1950-and-how-long-recovery-took/"},{"label":"FRED — Poverty rate, people 65 and over (Census)","url":"https://fred.stlouisfed.org/data/HSTPOVAR65YOBPPP"},{"label":"FRED — U.S. consumer-price inflation (World Bank)","url":"https://fred.stlouisfed.org/data/FPCPITOTLZGUSA"},{"label":"SSA — Full retirement age by year of birth","url":"https://www.ssa.gov/benefits/retirement/planner/agereduction.html"},{"l

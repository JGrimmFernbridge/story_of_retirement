% (1892–1894); unemployment est. 17–19%","detail":"Treasury gold reserves fell to about $100 million, and more than 100 banks suspended in June 1893. From mid-July to mid-August another 340 suspended. The NBER contraction ran from January 1893 to June 1894, and a second recession followed from late 1895 to mid-1897.","retirementImpact":"Older workers with no pension had nowhere to go when they lost wages. Their only fallbacks were family, mutual aid or the county poorhouse.","itemId":"conception-mar-0","type":"crisis"},{"year":1906,"endYear":1908,"name":"Panic of 1907","decline":"≈ −49% (Dow, 103.00 on Jan 19, 1906 to 53.00 on Nov 15, 1907)","detail":"After the Knickerbocker Trust Company suspended on October 22, 1907, runs on New York trust companies forced J.P. Morgan to organize private rescues. Unemployment rose from under 3 percent to about 8 percent, and the real economy recovered in a little over a year.","retirementImpact":"A private banker had to rescue the financial system, which pushed reformers toward the Federal Reserve. It also showed how exposed savers were in a system with no backstop.","itemId":"conception-mar-1","type":"crisis"},{"year":1919,"endYear":1921,"name":"Postwar depression of 1920–1921","decline":"−47% (Dow, 119.62 on Nov 3, 1919 to 63.90 on Aug 24, 1921)","detail":"The NBER dates the recession from January 1920 to July 1921, an 18-month contraction in which wholesale prices fell 36.8 percent. Unemployment estimates for 1921 range from 8.7 percent (Romer) to 11.7 percent (Lebergott).","retirementImpact":"The era closed with a severe deflationary bust just before the speculative 1920s, when Seed 4 (Market Growth) is first planted.","itemId":"conception-mar-2","type":"crisis"}],"socialMovements":[{"year":1892,"name":"The Populist revolt","detail":"At its founding convention in Omaha, the People’s Party adopted its platform on July 4, 1892. It demanded a graduated income tax, government ownership of the railroads, telegraph and telephones, and free coinage of silver.","significance":"Indebted farmers voiced the grievances of the agrarian America. The industrial retirement system then being built would mostly pass them by (Seed 7).","itemId":"conception-soc-0","type":"movement"},{"year":1894,"name":"Coxey’s Army","detail":"Jacob Coxey’s ‘petition in boots’ left Massillon, Ohio, on March 25, 1894 and reached Washington on April 30. Its demand was federal public-works jobs for workers left unemployed by the Panic of 1893. Coxey was arrested the next day for walking on the Capitol grounds.","significance":"It was an early demand that the federal government answer for unemployment, a question the New Deal would take up forty years later.","itemId":"conception-soc-1","type":"movement"},{"year":1894,"name":"Pullman Strike","detail":"Workers at the Pullman factories struck on May 11, 1894, after wage cuts. Eugene V. Debs’s American Railway Union, which grew to 150,000 members, launched a national boycott of Pullman cars. A federal injunction citing the Sherman Antitrust Act and federal troops sent over Governor Altgeld’s objection broke the strike. Fighting in the rail yards left dozens dead.","significance":"The strike showed how far workers had come to depend on one employer: Pullman controlled wages and the company town at once. Corporate paternalism, including pensions, became a tool of labor control.","itemId":"conception-soc-2","type":"movement"},{"year":1906,"endYear":1920,"name":"Progressive campaigns for social insurance","detail":"The American Association for Labor Legislation, chartered in 1906, campaigned for workers’ compensation and later for health insurance. Massachusetts set up the first public commission on aging in 1909, the same year the first federal old-age pension bill was introduced. The Progressive Party’s 1912 platform called for ‘a system of social insurance adapted to American use’ against ‘sickness, irregular employment, and old age.’","significance":"Reformers named the problem of old-age poverty decades before Congress acted on it. Nearly all of their health and old-age proposals failed in this era.","itemId":"conception-soc-3","type":"movement"}],"inequities":[{"title":"Who could afford to stop working","detail":"In 1900, 84.1 percent of Black men aged 65 and older were in the labor force, compared with 64.4 percent of white men. Older Southerners worked at 82.9 percent versus 66.0 percent in the North, and farm residents at 80.6 percent versus 62.7 percent off the farm (Costa).","vars":["race","place","job"]},{"title":"A pension system with a regional map","detail":"Confederate veterans could not draw federal pensions. Southern states built their own systems later and paid less: by 1910 the average Confederate pension was about one-third of the average Union pension. In 1900 about 90 percent of Black Americans still lived in the South, far from most federal pension spending. Black Union veterans were eligible, but white officials decided their claims, and they were approved less often.","vars":["place"]},{"title":"Women’s security through a husband’s service","detail":"Under the 1890 act a widow qualified only if she had no means of support other than her daily labor and had married the soldier before the law passed. She received $8 a month plus $2 per child under 16. Missouri and Illinois passed the first state ‘mothers’ aid’ laws in 1911, and women won the national vote only in 1920.","vars":["gender"]},{"title":"Immigrant workers in unprotected jobs","detail":"Nearly 15 percent of Americans were foreign-born in 1910, and 1,285,349 European immigrants arrived in 1907 alone. The Triangle Shirtwaist fire of March 25, 1911 killed 146 garment workers, 123 of them women and girls, most of them recent Italian and Jewish immigrants. Workers like them were the least likely to stay with one employer long enough to earn a pension.","vars":["immigration","job"]},{"title":"Pensions as discretionary gifts","detail":"Only twelve private pension plans existed in 1900. Most early plans were noncontributory, unfunded and discretionary: a gift the employer could reduce or end at will. Requirements like the Pennsylvania Railroad’s thirty years of service left out anyone who changed jobs or was laid off. Even by 1930, private plans covered only about 10 percent of private wage and salary workers.","vars":["job"]}],"historicalContext":[{"year":1910,"endYear":1940,"title":"The Great Migration begins","detail":"About 1.6 million Black Southerners moved to Northern industrial cities in the first Great Migration. They left the agricultural South, where about 90 percent of Black Americans had lived in 1900, for factory work.","itemId":"conception-his-1","type":"history"},{"year":1917,"endYear":1918,"title":"World War I","detail":"The United States declared war on Germany on April 6, 1917. About 4.7 million Americans served, with 53,402 battle deaths and 63,114 other deaths in service. The war also accustomed Americans to federal mobilization at scale.","itemId":"conception-his-2","type":"history","master":true,"hand":"WWI 1914–1918"},{"year":1918,"endYear":1919,"title":"The 1918 influenza pandemic","detail":"The CDC estimates that about one-third of the world’s population was infected, at least 50 million people died worldwide and about 675,000 died in the United States. Unusually, it killed many healthy adults aged 20 to 40, the generation that would otherwise support aging parents.","itemId":"conception-his-3","type":"history","master":true,"hand":"Spanish Flu. “The original COVID-19.”"},{"year":1920,"title":"Nineteenth Amendment ratified","detail":"Tennessee’s vote on August 18, 1920 completed ratification of women’s suffrage, and the amendment was certified on August 26. Women entered the next era as voters on old-age policy that still treated them mainly as dependents.","itemId":"conception-his-4","type":"history","master":true,"hand":"Women’s (some) right to vote"}],"seeds":[{"seed":1,"stage":"sprouting","detail":"Boundaries harden into pension rules. Only Union veterans qualified, widows only if destitute and married before 1890, and Britain screened claimants on ‘character.’ Railroads used age limits to decide who stayed and who was pushed out."},{"seed":2,"stage":"planted","detail":"Government Involvement begins with Bismarck in 1889. The state pays people to leave work in order to manage a political threat. In the United States the federal government became the largest pension payer through veterans’ benefits, and with the Civil Service Retirement Act of 1920 it became a pension-paying employer."},{"seed":3,"stage":"planted","detail":"This is the precursor of 65 = Old and Done. The numbers arrive first: 70 in Germany (1889) and 65 there in 1916; 62, 65, 68 and 70 in the Pension Bureau’s 1904 schedule; 62 in the 1907 act; 70, 65 and 62 in the 1920 civil service law. Age begins to replace ability as the line for leaving work."},{"seed":7,"stage":"sprouting","detail":"The industrial, urban, pensioned America separates from the agricultural, rural, unpensioned one. Railroad workers and federal clerks got pensions while farmers, sharecroppers and domestic workers did not. In 1900, older farm men worked at 80.6 percent and others at 62.7 percent."},{"seed":8,"stage":"planted","detail":"This is a precursor of The Promise, which the book dates to after 1946. The Pennsylvania Railroad’s plan (1900) and the federal civil service law (1920) offer a pension for long service in exchange for a forced exit. Carnegie’s 1905 promise of free pensions for professors proved too costly by 1917 and was replaced by the funded TIAA in 1918: an early promise that had to be rewritten."}],"twoPersonLens":{"year":1920,"older":{"born":1860,"headline":"Built the factories, no exit in sight","text":"Born in 1860, they were a child during the Civil War and too young to fight in it, so the age pensions Congress passed in 1907 were never theirs. They were thirteen in the Panic of 1873 and thirty-three when the Panic of 1893 pushed unemployment toward one in five. They spent their prime in mills and on rail lines, and in 1918 they saw influenza kill people half their age. Now, in 1920, they are sixty. Their employer almost certainly has no pension plan; even ten years later, private plans will cover only about one in ten private-sector workers. Their state has no old-age law. If they stop, they lose their income. Most men their age keep working, and they will too, for as long as the line lets them."},"younger":{"born":1900,"headline":"The first to be paid to stop","text":"Born in 1900, they have never known a world without the automobile, and the assembly line was running by the time they turned thirteen. At seventeen they watched the country go to war, and at eighteen they survived a flu that killed people their own age. In 1920 they are twenty and entering a wage economy that is still volatile. Ahead are the 1929 crash at twenty-nine and the Social Security Act at thirty-five. They turn sixty-five in 1965, the year Medicare is signed. For many in their generation, especially white men in industrial jobs, stopping at 65 will feel like the natural shape of a life. Nobody will tell them that the forced exit at a fixed age is a corporate invention as young as they are."},"irony":"The sixty-year-old built the industrial economy that made retirement necessary and will never have one; the twenty-year-old will take that economy’s exit as a birthright."},"keyTerms":[{"term":"Vacancy mechanism","definition":"Grimm’s term for the original function of retirement: a way to open positions in an industrial labor market with no natural turnover by moving older workers out."},{"term":"Exit subsidy","definition":"The book’s reading of Bismarck’s pension. It was not a reward for a life’s work but a payment that made leaving work survivable, and so made it possible."},{"term":"Zero-Sum Machine","definition":"The book’s image of the factory economy, where a fixed number of jobs meant an old worker who could not afford to leave blocked a young one at the gate."},{"term":"Social insurance","definition":"A compulsory, usually government-run system that pools risks such as sickness, injury, disability or old age, funded by contributions or taxes, and pays benefits as a right when the risk occurs."},{"term":"Dependent pension","definition":"Under the 1890 act, a Union veteran’s pension based on present inability to do manual labor, from any cause, rather than an injury suffered in the war."},{"term":"Service and age pension","definition":"A pension awarded for military service plus reaching a set age, as in the 1907 act (62 and older), with no disability required."},{"term":"Mandatory retirement","definition":"An employer rule forcing workers out at a set age, such as 70 at the Pennsylvania Railroad (1900) and in the 1920 federal civil service law."},{"term":"Labor force participation rate","definition":"The share of a population group that is working or looking for work. For men 65 and older it fell from about 78 percent in 1880 to about 60 percent in 1920 (Costa)."},{"term":"Noncontributory, unfunded pension","definition":"An early employer plan paid out of current revenues with no worker contributions and no money set aside, and usually revocable at the employer’s discretion."}],"keyFigures":[{"name":"Otto von Bismarck","role":"German chancellor whose government enacted old-age and disability insurance in 1889 at age 70. The book reads the law as a political weapon against socialism and a vacancy mechanism."},{"name":"Theodore Roosevelt","role":"His administration’s 1904 Pension Bureau order treated age 62 as grounds for a veteran’s pension. In 1912 his Progressive Party platform called for American social insurance against old age."},{"name":"Eugene V. Debs","role":"Leader of the 150,000-member American Railway Union in the 1894 Pullman boycott. He was indicted for defying the federal injunction that broke the strike."},{"name":"Andrew Carnegie","role":"Endowed a $10 million fund in 1905 to give free pensions to college teachers. When the promise proved unaffordable, his Carnegie Corporation helped found the funded TIAA in 1918."},{"name":"Frances Perkins","role":"Witnessed the 1911 Triangle Shirtwaist fire and led New York’s Committee on Public Safety afterward. As Secretary of Labor she later chaired the committee that drafted the Social Security Act."}],"primarySources":[{"title":"Dependent Pension Act of 1890 (26 Stat. 182)","year":1890,"source":"GovInfo, U.S. Statutes at Large","url":"https://www.govinfo.gov/link/statute/26/182","why":"Notice the wording ‘unable to earn a support by manual labor’ and the conditions placed on widows. Ask who the law imagines as deserving."},{"title":"Act of February 6, 1907: Service and Age Pensions (34 Stat. 879)","year":1907,"source":"GovInfo, U.S. Statutes at Large","url":"https://www.govinfo.gov/link/statute/34/879","why":"Find the exact sentence where age replaces disability as the qualifying condition."},{"title":"Progressive Party Platform","year":1912,"source":"Teaching American History","url":"https://teachingamericanhistory.org/document/the-progressive-party-platform-1912/","why":"Compare its social-insurance plank with Bismarck’s design. Who would pay, and who would be protected?"},{"title":"Civil Service Retirement Act of 1920 (41 Stat.)","year":1920,"source":"GovInfo, U.S. Statutes at Large","url":"https://www.govinfo.gov/link/statute/41/618","why":"Look at how retirement ages vary by occupation and how the annuity scale rewards long service. Both are evidence for or against the vacancy-mechanism thesis."},{"title":"Age 65 Retirement (the Bismarck myth)","year":1889,"source":"SSA Historian’s Office","url":"https://www.ssa.gov/history/age65.html","why":"Use the SSA’s account to separate what Bismarck did from what popular history credits him with."}],"discussionQuestions":["Test the vacancy-mechanism thesis. If Germany’s 1889 law paid at 70 and, as the book argues, most contributors died before collecting, how many jobs could it actually have opened? Does the 1889 law fit the thesis as well as the Pennsylvania Railroad’s mandatory retirement at 70 does? Use evidence from both.","The book calls Bismarck’s pension ‘a political weapon wrapped in social welfare.’ Can a policy be both politically motivated and genuinely humanitarian? Use the 1881 imperial message and the 1878 Anti-Socialist Law in your answer.","Union pensions grew from 537,944 recipients in 1890 to 966,012 in 1893 under pressure from the Grand Army of the Republic. Was this a fair expansion of support to aging veterans, or the template the book describes of ‘costs that escalate far beyond original projections’? What evidence would settle it?","In 1900, 84.1 percent of older Black men and 64.4 percent of older white men were in the labor force. What explains the gap: occupation, region, wealth, pension access or discrimination? What would you need to know to separate these causes?","Compare the German (insurance), British (means-tested pension with a character test) and American (veterans’ pension) answers to old age. Which one best honors the Natural Order principles of Not Poverty, Community and Generativity?","The book argues ‘a man who had grown old on a farm had a role; a man who had grown old in a factory had a problem.’ Does the evidence from this era support that contrast, or does it romanticize farm life? Consider sharecroppers and farm widows."],"assignment":{"title":"Policy Brief: Was Retirement Born as a Vacancy Mechanism?","type":"Policy brief","prompt":"Write to a modern congressional committee as a staff historian. Your brief evaluates the book’s thesis that the first retirement systems were ‘a vacancy mechanism… designed to clear a position’ rather than to honor a life. Examine at least two of these cases: Bismarck’s 1889 law and its 1916 change; the Dependent Pension Act of 1890 and the age-based pensions of 1904 and 1907; the Pennsylvania Railroad plan of 1900; the Civil Service Retirement Act of 1920. For each, identify the stated purpose, the design features (age, service, funding, mandatory exit) and the evidence of actual purpose. Reach a verdict: supported, partly supported, or not supported. Close with one lesson for today’s debate over retirement ages.","deliverable":"1,000–1,300 word policy brief with an executive summary (≤150 words), a findings section, a verdict and one recommendation; at least four sources, including two primary sources.","points":100,"rubric":[{"criterion":"Evidence & historical accuracy","points":30,"exemplary":"Uses precise, correctly cited facts from primary statutes and scholarship, such as ages, rates, dates and coverage, with no errors.","proficient":"Evidence is accurate and relevant, with minor gaps or a missing citation.","developing":"Evidence is general or partly inaccurate, or relies on a single source.","beginning":"Little evidence, or significant factual errors."},{"criterion":"Evaluation of the thesis","points":30,"exemplary":"Tests the thesis case by case, engages the strongest counter-evidence, and reaches a nuanced verdict that follows from the evidence.","proficient":"Reaches a clear verdict supported by evidence, with some attention to counterarguments.","developing":"The verdict is asserted more than demonstrated, or counter-evidence is ignored.","beginning":"No clear verdict, or the brief simply restates the book."},{"criterion":"Policy relevance & recommendation","points":20,"exemplary":"Draws a specific, well-reasoned lesson for today’s retirement-age debate that follows from the findings.","proficient":"Offers a reasonable lesson loosely tied to the findings.","developing":"The lesson is generic or disconnected from the evidence.","beginning":"No recommendation."},{"criterion":"Brief format & clarity","points":20,"exemplary":"Tight executive summary, scannable structure, plain professional prose, and correct citations.","proficient":"Follows the format with minor clarity or citation issues.","developing":"Format is partly followed; the prose is wordy or unclear.","beginning":"Does not follow the brief format."}]},"quiz":[{"q":"At what age did Germany’s 1889 old-age pension originally begin paying?","options":["60","65","70","75"],"answer":2,"explain":"The original age was 70, and Bismarck was 74. Germany lowered it to 65 in 1916, eighteen years after his death."},{"q":"What did the Act of February 6, 1907 make sufficient for a Union veteran’s pension?","options":["Any wound received in battle","Reaching age 62, with 90 days’ service and an honorable discharge","Proof of poverty","Thirty years of federal employment"],"answer":1,"explain":"The 1907 act paid veterans on age alone: $12 a month at 62, $15 at 70 and $20 at 75. No disability was required."},{"q":"Roughly what share of federal expenditures went to Union Army pensions in 1893?","options":["About 5 percent","About 15 percent","More than 40 percent","About 75 percent"],"answer":2,"explain":"Economic historian Dora Costa estimates Union Army pensions took more than 40 percent of federal expenditures in 1893."},{"q":"Which 1920 law created a retirement system for federal civil servants?","options":["The Social Security Act","The Railroad Retirement Act","The Civil Service Retirement Act","The Revenue Act"],"answer":2,"explain":"The Civil Service Retirement Act, approved May 22, 1920, set retirement ages of 70, 65 or 62 depending on occupation, with at least 15 years of service."},{"q":"In 1900, about what share of Black men aged 65 and older were in the labor force?","options":["About 25 percent","About 45 percent","About 64 percent","About 84 percent"],"answer":3,"explain":"Costa’s census data show 84.1 percent of older Black men in the labor force in 1900, compared with 64.4 percent of older white men."}],"sources":[{"label":"SSA Historian’s Office — Otto von Bismarck","url":"https://www.ssa.gov/history/ottob.html"},{"label":"SSA Historian’s Office — Age 65 Retirement","url":"https://www.ssa.gov/history/age65.html"},{"label":"SSA Historian’s Office — Pre-Social Security period timeline","url":"https://www.ssa.gov/history/1900.html"},{"label":"SSA Historian’s Office — Frances Perkins","url":"https://www.ssa.gov/history/fperkins.html"},{"label":"GovInfo — Dependent Pension Act, June 27, 1890 (26 Stat. 182)","url":"https://www.govinfo.gov/link/statute/26/182"},{"label":"GovInfo — Act of February 6, 1907 (34 Stat. 879)","url":"https://www.govinfo.gov/link/statute/34/879"},{"label":"GovInfo — Civil Service Retirement Act, May 22, 1920","url":"https://www.govinfo.gov/link/statute/41/618"},{"label":"SSA Social Security Bulletin — Civil Service Retirement (1941)","url":"https://ssa.gov/policy/docs/ssb/v4n4/v4n4p29.pdf"},{"label":"SSA Social Security Bulletin — early private pension plans","url":"https://ssa.gov/policy/docs/ssb/v16n3/v16n3p7.pdf"},{"label":"Costa, The Evolution of Retirement, ch. 2 (NBER)","url":"https://www.nber.org/chapters/c6108.pdf"},{"label":"Costa, Union Army pensions chapter (NBER)","url":"https://www.nber.org/chapters/c6114.pdf"},{"label":"EH.Net — Economic History of Retirement in the United States","url":"https://eh.net/encyclopedia/economic-history-of-retirement-in-the-united-states/"},{"label":"Gratton, ‘A Triumph in Modern Philanthropy’: Age Criteria at the Pennsylvania Railroad, Business History Review (1990)","url":"https://ideas.repec.org/a/cup/buhirw/v64y1990i04p630-656_05.html"},{"label":"Essays in Economic & Business History — Pennsylvania Railroad pension plan","url":"https://ebhsoc.org/journal/index.php/ebhs/article/view/180"},{"label":"VCU Social Welfare History Project — Veteran’s Pensions","url":"https://socialwelfare.library.vcu.edu/social-security/veterans-pensions-early-history/"},{"label":"VCU Social Welfare History Project — Old Age Assistance: A Brief History","url":"https://socialwelfare.library.vcu.edu/public-welfare/old-age-assistance-a-brief-history/"},{"label":"Dependent and Disability Pension Act (citing McConnell, Quadagno, Linker)","url":"https://en.wikipedia.org/wiki/Dependent_and_Disability_Pension_Act"},{"label":"Sherwood Act (1912)","url":"https://en.wikipedia.org/wiki/Sherwood_Act"},{"label":"Essential Civil War Curriculum — Civil War Pensions","url":"https://www.essentialcivilwarcurriculum.com/civil-war-pensions.html"},{"label":"EBSCO Research Starters — Anti-Socialist Law of 1878","url":"https://www.ebsco.com/research-starters/history/anti-socialist-law-1878"},{"label":"Old Age Pensions Act 1908 (UK)","url":"https://en.wikipedia.org/wiki/Old_Age_Pensions_Act_1908"},{"label":"Carnegie Corporation of New York — Carnegie Teachers Pension Fund and TIAA","url":"https://carnegie.org/?p=3744"},{"label":"TIAA","url":"https://en.wikipedia.org/wiki/TIAA"},{"label":"National Archives (Reagan Library blog) — Sixteenth Amendment","url":"https://reagan.blogs.archives.gov/2022/09/20/constitutional-amendments-series-amendment-xvi-income-taxes"},{"label":"FRASER — Federal Reserve Act","url":"https://fraser.stlouisfed.org/blog/2016/12/federal-reserve-act"},{"label":"Federal Reserve History — Banking Panics of the Gilded Age","url":"https://www.federalreservehistory.org/essays/banking_panics_of_the_gilded_age"},{"label":"Federal Reserve History — The Panic of 1907","url":"https://www.federalreservehistory.org/essays/panic-of-1907"},{"label":"Panic of 1907 (citing Bruner & Carr 2007)","url":"https://en.wikipedia.org/wiki/Panic_of_1907"},{"label":"Closing milestones of the Dow Jones Industrial Average","url":"https://en.wikipedia.org/wiki/Closing_milestones_of_the_Dow_Jones_Industrial_Average"},{"label":"Recession of 1920–1921 (citing NBER, Romer, Lebergott)","url":"https://en.wikipedia.org/wiki/Recession_of_1920%E2%80%931921"},{"label":"NBER — U.S. Business Cycle Expansions and Contractions","url":"https://www.nber.org/research/data/us-business-cycle-expansions-and-contractions"},{"label":"National Park Service — The Strike of 1894 (Pullman)","url":"https://home.nps.gov/pull/learn/historyculture/the-strike-of-1894.htm"},{"label":"Coxey’s Army","url":"https://en.wikipedia.org/wiki/Coxey%27s_Army"},{"label":"Omaha Platform (1892)","url":"https://en.wikipedia.org/wiki/Omaha_Platform"},{"label":"American Association for Labor Legislation","url":"https://en.wikipedia.org/wiki/American_Association_for_Labor_Legislation"},{"label":"Teaching American History — Progressive Party Platform (1912)","url":"https://teachingamericanhistory.org/document/the-progressive-party-platform-1912/"},{"label":"Triangle Shirtwaist Factory fire","url":"https://en.wikipedia.org/wiki/Triangle_Shirtwaist_Factory_fire"},{"label":"Immigration to the United States (historical tables)","url":"https://en.wikipedia.org/wiki/Immigration_to_the_United_States"},{"label":"Great Migration (African American)","url":"https://en.wikipedia.org/wiki/Great_Migration_(African_American)"},{"label":"Ford Model T","url":"https://en.wikipedia.org/wiki/Ford_Model_T"},{"label":"American entry into World War I","url":"https://en.wikipedia.org/wiki/American_entry_into_World_War_I"},{"label":"U.S. Department of Veterans Affairs — America’s Wars fact sheet","url":"https://www.va.gov/opa/publications/factsheets/fs_americas_wars.pdf"},{"label":"CDC — 1918 Pandemic (H1N1 virus)","url":"https://archive.cdc.gov/www_cdc_gov/flu/pandemic-resources/1918-pandemic-h1n1.html"},{"label":"National Archives — 19th Amendment","url":"https://www.archives.gov/milestone-documents/19th-amendment"},{"label":"SSA Historian’s Office — Medicare signed July 30, 1965","url":"https://www.ssa.gov/history/1960.html"}],"chapter":{"title":"Conception","years":"1890–1920","subtitle":null,"definition":"con·cep·tion (noun) the beginning of something","epigraph":null,"status":"draft","words":1562,"minutes":7,"html":"<p>Consider a person born in 1890 — the year after Otto von Bismarck&rsquo;s old-age pension became reality in Germany. At ten, this person lives in a world lit by gas lamps, moved by horse-drawn carriages, connected by telegraph. More than three-quarters of men over sixty-five are still working. The word &ldquo;retirement&rdquo; means almost nothing to almost everyone.</p>\n<p>By twenty-four, this person watches the world descend into industrialized slaughter — trenches, poison gas, sixteen and a half million dead. By thirty, the war is over and the Roaring Twenties have begun — consumer economy, radio, automobiles, the stock market climbing toward the sky. By thirty-nine, Black Tuesday. By forty-three, the Depression has reached its floor — one in four Americans unemployed, more than half of the elderly destitute. By forty-five, Franklin Roosevelt signs the Social Security Act. By fifty-five, the atomic bomb drops on Hiroshima.</p>\n<p>By sixty, this person stands at the threshold of something no prior generation had ever imagined as a mass experience: the end of work. Not death. Not disability. A new phase of life that needed a new name.</p>\n<p><em>Retirement.</em></p>\n<p>This person absorbed more change, more trauma, more whiplash than any generation before them — and arrived at sixty wanting something no prior generation had thought to want: the right to rest. And the economy they&rsquo;d helped build was just strong enough, just abundant enough, just structured enough to make that rest look possible.</p>\n<p>For a moment. Before the math caught up.</p>\n<p>This chapter tells the story of those thirty years — from the moment the idea was born in Bismarck&rsquo;s Reichstag to the point where industrialization had made it unavoidable. How retirement was conceived — not born whole, but emerging piece by piece from the logic of a labor problem that no prior society had ever faced.</p>\n<p>But you must hold two questions simultaneously throughout this story, because they will determine everything that follows. The first is the humanitarian question: How do we care for people who can no longer care for themselves? The second is the structural question: What happens to human beings when the economic model that sustains them is designed to discard them?</p>\n<p>The humanitarian question is real, urgent, and eternal. The structural question is what makes retirement a uniquely modern problem — because it&rsquo;s the Industrial Revolution&rsquo;s exchange model, not aging itself, that creates the crisis.</p>\n<h2 id=\"ch-part-one-the-original-seed-bismarck-rsquo-s-pens\">Part One: The Original Seed — Bismarck&rsquo;s Pension and the Design Flaw Nobody Noticed</h2>\n<p>Here is what most people think they know about retirement&rsquo;s origin: Otto von Bismarck, the Iron Chancellor of Germany, invented the pension in 1889. He set the retirement age at sixty-five. He was sixty-five himself. Life expectancy was around forty. It was generous in concept and conservative in practice. End of story.</p>\n<p>Almost none of that is accurate.</p>\n<p>Bismarck&rsquo;s old-age and disability pension, enacted on May 24, 1889, set the retirement age at seventy, not sixty-five. Bismarck was seventy-four at the time. The age wasn&rsquo;t lowered to sixty-five until 1916 — eighteen years after Bismarck&rsquo;s death. These details matter because they reveal the pension&rsquo;s actual design logic. German male life expectancy at birth in 1889 was under forty-five years. In German cities, one in three newborns died within their first year. The pension was designed so that most contributors would die before collecting a single payment.</p>\n<p>This was not a miscalculation. It was the point.</p>\n<p>Bismarck was not a humanitarian. He was solving two political problems simultaneously: neutralizing the socialist movement that threatened the German state, and managing a visible crisis of elderly industrial workers dying in poverty in Germany&rsquo;s rapidly industrializing cities. The pension was a political weapon wrapped in social welfare. And its design reveals the original seed of the entire retirement concept: it was conceived as end-of-life care for exceptional survivors, not as a lifestyle phase for the general population.</p>\n<p><strong>The pension was not a reward. It was an exit subsidy.</strong></p>\n<p>Every crisis documented in the chapters that follow — every underfunded pension, every inadequate 401(k), every elderly person living in poverty — flows from this original design flaw. The pension was built for a world where most people didn&rsquo;t survive to use it. We kept the architecture. The world changed underneath it.</p>\n<h2 id=\"ch-the-zero-sum-machine\">The Zero-Sum Machine</h2>\n<p>The problem Bismarck was solving had a specific, structural character that the agrarian world had never produced. Industrialization had created a fixed number of jobs in any given factory, city, or industry. Those positions didn&rsquo;t expand automatically to accommodate new workers. An old man who could not survive without his wages could not leave. He had no mechanism for exit. And so he stayed — slower, less productive, increasingly costly, but present — because the alternative was destitution.</p>\n<p>Meanwhile, a young man of working age stood outside the factory gate. There was no room. The generation ahead of him hadn&rsquo;t left. Couldn&rsquo;t leave. This is the zero-sum condition at the heart of the industrial economy — one that agrarian life had never produced. On a farm, a father slowing down didn&rsquo;t block his son from working. They worked the same land together. The son didn&rsquo;t need the father to disappear. He needed the father to shift roles, which happened naturally, across seasons and years, within the organic rhythms of a family working the land together.</p>\n<p>Bismarck had invented retirement. But what he had invented was not a phase of life. It was a vacancy mechanism. A way to open positions in a system that had no natural turnover. Old workers were not being honored. They were being cleared.</p>\n<h2 id=\"ch-america-rsquo-s-different-road-the-civil-war-pen\">America&rsquo;s Different Road: The Civil War Pension</h2>\n<p>Across the Atlantic, the United States was arriving at a similar destination by a completely different road.</p>\n<p>The Civil War pension system had, by 1890, become the largest public expenditure in American history. By 1893, it consumed nearly 40 percent of the federal budget. What had begun as compensation for battlefield sacrifice had metastasized into something else entirely — a sprawling, politically manipulated income support system for aging Union veterans and their dependents. The Grand Army of the Republic was among the most powerful political lobbying organizations in the country. Pension eligibility expanded steadily, detached increasingly from service-related injury, evolving toward something that looked, functionally, like old age support for an entire generation of men.</p>\n<p>Americans had encountered a pension system — a large, federally administered one — before they had ever agreed retirement was a concept worth having.</p>\n<p>In 1907, old age itself was declared sufficient cause for a pension — no disability required. The line between &ldquo;compensation for sacrifice&rdquo; and &ldquo;payment for being old&rdquo; had quietly been erased.</p>\n<p>The Civil War pension system is America&rsquo;s proto-retirement industry, and it established a template that would repeat for the next 130 years: benefits that start modest and expand under political pressure; lobbying by beneficiary groups for broader eligibility; public skepticism about fraud and abuse; costs that escalate far beyond original projections.</p>\n<h2 id=\"ch-the-world-before-retirement\">The World Before Retirement</h2>\n<p>To understand what retirement&rsquo;s conception changed, you have to understand what existed before it. In 1880, more than seventy-six percent of American men over sixty-five were in the labor force. A twenty-year-old could expect roughly 2.3 years in retirement — less than six percent of their lifespan. The numbers carried racial and geographic disparities that reveal the underlying economics: 84.1 percent of Black men over sixty-five were still working, compared to 64.4 percent of white men. Farm residents over sixty-five worked at far higher rates than those in cities.</p>\n<p>What these gaps tell us is that the people closest to the old exchange model — relational, embedded, agricultural — were the ones who kept working longest. Not because they couldn&rsquo;t stop, but because the structure of their lives didn&rsquo;t require stopping. On the farm, you didn&rsquo;t retire. You shifted what you contributed.</p>\n<p>The factory destroyed that possibility. Factory work had no equivalent of passing lighter tasks to an aging family member. It was binary: you could produce at the required pace, or you couldn&rsquo;t. And when you couldn&rsquo;t, you were replaced. The Industrial Revolution&rsquo;s exchange model — time and labor for money, individualized — made human beings economically disposable the moment their productive capacity declined.</p>\n<h2 id=\"ch-what-was-born-here\">What Was Born Here</h2>\n<p>These were the seeds. A Prussian vacancy mechanism. An American war debt that outgrew its original purpose. And seventy-year-old men who had spent their lives in the mills, standing at the factory gate because there was nowhere else to stand.</p>\n<p>The idea of retirement did not emerge from philosophy. It did not emerge from a theory of human flourishing or a considered view of how a life ought to be structured. It emerged from a labor problem that industrialization had created and that no existing social institution knew how to solve.</p>\n<p>A man who had grown old on a farm had a role. A man who had grown old in a factory had a problem.</p>\n<p>Retirement was invented to manage the problem.</p>\n<p>Everything that follows — every expansion, every promise, every political campaign, every financial product, every cultural mythology built around the golden years — descends from this original logic. Not flourishing. Not rest. Not the recognition of a life well worked.</p>\n<p><em>Management.</em></p>\n<p>It is important to remember this when we examine what the system became, and what it was eventually asked to deliver. The vacancy mechanism was never designed to honor a life. It was designed to clear a position. The distance between those two things is the story of the next one hundred and thirty years.</p>","outline":[{"id":"part-one-the-original-seed-bismarck-rsquo-s-pens","text":"Part One: The Original Seed — Bismarck&rsquo;s Pension and the Design Flaw Nobody Noticed"},{"id":"the-zero-sum-machine","text":"The Zero-Sum Machine"},{"id":"america-rsquo-s-different-road-the-civil-war-pen","text":"America&rsquo;s Different Road: The Civil War Pension"},{"id":"the-world-before-retirement","text":"The World Before Retirement"},{"id":"what-was-born-here","text":"What Was Born Here"}]},"downloads":{"pdf":"downloads/02-conception.pdf"},"unit":6,"role":"How we got here","chapterLabel":"Chapter 2 of the book","cultureEvents":[{"year":1899,"endYear":null,"title":"Electric motors drive about 5% of factory machinery","detail":"Electric motors supplied less than 5 percent of the power used to drive machinery in U.S. manufacturing in 1899, and more than half by 1919 (Devine, 1983).","significance":"Electrification raised factory productivity and the pace of work, part of what pushed older industrial workers out.","decline":null,"type":"tech","itemId":"m-elec-1899","master":true,"hand":"Electricity 5% industrial power"},{"year":1903,"endYear":null,"title":"The Wright brothers fly","detail":"Orville and Wilbur Wright made the first powered, controlled airplane flights at Kitty Hawk, North Carolina, on December 17, 1903.","significance":"","decline":null,"type":"tech","itemId":"m-wright-1903","master":true,"hand":"1903 Wright Bros"},{"year":1907,"endYear":null,"title":"About 8% of homes have electricity","detail":"About 8 percent of U.S. homes had electric service in 1907. By 1920 about 35 percent did.","significance":"","decline":null,"type":"tech","itemId":"m-elec-1907","master":true,"hand":"Electricity 8% of homes"},{"year":1908,"endYear":null,"title":"Ford’s Model T","detail":"Introduced October 1, 1908, the Model T put a car within reach of ordinary families. Ford’s moving assembly line followed in 1913.","significance":"His question on the timeline: what does this do to travel and to the move from farm to factory?","decline":null,"type":"tech","itemId":"m-modelt-1908","master":true,"hand":"1908 Model T. What does this do to travel + farm → factory dynamics?"},{"year":1913,"title":"Ford’s moving assembly line","detail":"The Model T, introduced October 1, 1908, went onto a moving assembly line on October 7, 1913, cutting assembly time from about 12.5 hours to 93 minutes by 1914. Mass production made the pace of the line, not the experience of the worker, the measure of value.","itemId":"conception-his-0","type":"tech"}]},{"id":"classical","number":1,"title":"Classical","years":"Pre-1890","definition":"clas·si·cal (noun) the history of something","tagline":"The world had no word for retirement, so it built community instead.","bigQuestion":"If no society before industrialization had ‘retirement,’ how did people grow old, and what did they know that we have forgotten?","overview":"For nearly all of recorded history there was no word for retirement. The book’s first chapter treats that absence as a data point, not a gap in the record. People aged, declined and died in every civilization, yet no society organized old age around ceasing to work and living off accumulated assets. Grimm refuses to romanticize this world. It was brutal: plague, serfdom, caste, coverture that made married women legally invisible, and colonial dispossession. And yet, the chapter argues, because individuals had so little protection, communities carried the weight. Pe’ah and zakat, church xenodochia, guild welfare funds, village reciprocity, and work that shifted with age instead of ending all did that work.\n\nThis module reads that world through the three principles of Natural Order Economics: Not Poverty, Community and Generativity. It then follows them to the United States before 1890, where the first modern pieces of retirement appear. These include Revolutionary and Civil War pensions, colonial poor laws and almshouses, Black mutual aid societies, and the first corporate pensions. Across the Atlantic, Bismarck was building social insurance. In 1880, about 78 percent of American men aged 65 and older were still in the labor force. Watch closely for who was protected, who was excluded, and who drew the lines.","learningObjectives":["Explain the three principles of Natural Order Economics (Not Poverty, Community, Generativity) and identify each in at least two pre-industrial institutions.","Analyze the ‘life expectancy paradox’ by distinguishing life expectancy at birth from the lifespan of people who survived childhood.","Trace American public pensions from the 1776 Continental Congress resolution through the 1862 General Law and the 1879 Arrears Act.","Evaluate how pre-1890 institutions drew boundaries around who deserved protection. Cases include almshouses, coverture, the Freedman’s Savings Bank and exclusion laws.","Compare a pre-industrial community care system with modern retirement, and assess the book’s claim that the classical world offers ‘a blueprint.’"],"policyEvents":[{"year":1601,"title":"Poor Relief Act (England)","type":"legislation","detail":"England’s Elizabethan poor law made the parish responsible for its own poor. Relief was funded by a compulsory local poor rate collected by overseers. The law sorted the poor into categories: the ‘impotent’ poor, including the aged, were to be cared for in almshouses, and the able-bodied were to be set to work. It also made poor parents and children responsible for each other.","significance":"Colonial legislatures adopted laws patterned on the Elizabethan poor laws, producing the local, residence-based American almshouse system. Its line between ‘deserving’ and ‘undeserving’ poor is an early form of Seed 1 (Segregation & Boundaries).","itemId":"classical-pol-0"},{"year":1776,"title":"Continental Congress disability pension resolution","type":"legislation","detail":"A resolution of August 26, 1776 promised soldiers disabled in service half their monthly pay for life. Because Congress could not raise money through taxation, by 1785 the states were paying these pensions.","significance":"America’s first public pension promise compensated sacrifice, not old age. Over the next 130 years that distinction would quietly erode (Seed 2: Government Involvement).","itemId":"classical-pol-1"},{"year":1818,"endYear":1832,"title":"Revolutionary War service pension acts","type":"legislation","detail":"The act of March 18, 1818 pensioned Revolutionary veterans who had served nine months and were in need of their country’s support. Officers received $20 a month and enlisted men $8. An act of June 7, 1832 extended full benefits to veterans with two years’ service, and proportional benefits to those who had served at least six months; later acts opened pensions to militia veterans and widows.","significance":"These were the first U.S. pensions based on service and need rather than injury. By the 1810s, poverty among aging veterans had become a public problem, a preview of the long slide from ‘wounded’ to ‘old.’","itemId":"classical-pol-2"},{"year":1862,"title":"Civil War pension ‘General Law’","type":"legislation","detail":"The act of July 14, 1862 pensioned Union officers and enlisted men disabled since March 4, 1861 by wounds or disease contracted in the line of duty. Rates were proportional to disability, from $8 a month for a totally disabled private up to $30 for senior officers. Widows received the husband’s pension for life or until remarriage, and minor children received it if no widow survived.","significance":"This act became the foundation of America’s largest income-support system before the New Deal. The pension rolls grew from 7,916 people in 1861 to 324,968 by 1885.","itemId":"classical-pol-3","master":true,"hand":"Civil War Pension → seed: Gov’t"},{"year":1865,"endYear":1874,"title":"Freedman’s Savings and Trust Company","type":"policy","detail":"Congress chartered the bank, and Lincoln signed the act on March 3, 1865. In less than a decade an estimated 70,000 depositors, most of them formerly enslaved people and their families, deposited more than $57 million in total. An 1870 charter change loosened its investment rules. Mismanagement, fraud and the Panic of 1873 followed, and the bank closed on June 29, 1874.","significance":"The bank paid out dividends totaling 62 percent of what depositors were owed, but roughly half of depositors never claimed them. A savings institution chartered by the federal government for freedpeople failed within a decade, an early case of Seeds 1 and 7.","itemId":"classical-pol-4"},{"year":1875,"title":"American Express creates the first formal U.S. private pension","type":"policy","detail":"The American Express Company created the first formal private pension plan in the United States in 1875. Early employer plans like it were typically noncontributory, unfunded and discretionary. The employer treated the pension as a gift it could reduce or end at will, not a legal right.","significance":"The corporate pension begins as a management tool. It is a precursor of Seed 8 (The Promise), which the book dates to the period after 1946.","itemId":"classical-pol-5"},{"year":1879,"title":"Arrears of Pensions Act","type":"legislation","detail":"The act let Union veterans with approved claims collect back payments dating to their discharge. It set off a flood of applications and a sharp rise in pension spending.","significance":"The act helped revive the Grand Army of the Republic as a pension lobby. It also shows a pattern the book identifies: benefits that start modest and expand under political pressure.","itemId":"classical-pol-6"},{"year":1880,"title":"Baltimore & Ohio Railroad Relief Department","type":"policy","detail":"The B&O created its Relief Department in 1880. The B&O Railroad Museum’s archive calls it the railroad industry’s first employer-run health insurance and pension plan.","significance":"Industrial pensions began where work was most dangerous and corporations most bureaucratic. This plants the urban-industrial side of Seed 7 (Two Americas).","itemId":"classical-pol-7"},{"year":1883,"endYear":1884,"title":"Bismarck’s sickness and accident insurance (Germany)","type":"legislation","detail":"The Anti-Socialist Law of October 1878 banned socialist organizations. Bismarck then turned to insurance. An 1881 imperial message declared that people ‘disabled from work by age and invalidity have a well-grounded claim to care from the state.’ Sickness insurance followed in 1883 and accident insurance in 1884.","significance":"Seed 2 (Government Involvement) is planted here. The book reads social insurance as political management, a line that leads to the 1889 old-age law examined in the Conception unit.","itemId":"classical-pol-8"},{"year":1887,"title":"Cleveland vetoes the Dependent Pension Bill","type":"policy","detail":"On February 11, 1887, President Grover Cleveland vetoed a bill to pension Union veterans who could not support themselves, however they had become disabled. He cited its cost, the difficulty of measuring dependence, and the likelihood of fraud. The House could not override the veto.","significance":"The fight was over whether a pension compensates service or supports need. It previewed the Dependent Pension Act that Congress passed three years later.","itemId":"classical-pol-9"}],"marketDrops":[{"year":1602,"endYear":null,"title":"The Dutch East India Company sells the first public shares","detail":"In 1602 the Dutch East India Company (VOC) raised its capital by selling shares to the public in Amsterdam, and those shares traded on what became the world’s first stock exchange.","significance":"Owning a slice of a company’s future profits begins here, the instrument the 401(k) era would later ask workers to retire on.","decline":null,"type":"money","itemId":"m-voc-1602","master":true,"hand":"Market (stock market) — East India Trade Co: first stock"},{"year":1636,"endYear":1637,"title":"Tulip mania","detail":"Prices for rare tulip bulbs in the Dutch Republic rose to extraordinary levels in 1636 and collapsed in February 1637. Historians still debate how widespread the losses were.","significance":"The archetype of a speculative bubble: the Get Rich Quick impulse centuries before anyone held a retirement account.","decline":"Collapsed in February 1637","type":"crisis","itemId":"m-tulips-1637","master":true,"hand":"Tulip bubble"},{"year":1792,"endYear":null,"title":"The Buttonwood Agreement founds the New York Stock Exchange","detail":"On May 17, 1792, 24 brokers signed the Buttonwood Agreement on Wall Street, the origin of the New York Stock Exchange.","significance":"The marketplace where American retirement savings would eventually be invested.","decline":null,"type":"money","itemId":"m-nyse-1792","master":true,"hand":"1792 NYSE"},{"year":1837,"endYear":1844,"name":"Panic of 1837","decline":"343 of about 850 U.S. banks closed entirely; 62 more failed in part","detail":"On May 10, 1837, New York City banks stopped paying out gold and silver. A land bubble had burst, the 1836 Specie Circular had drained coin westward, and cotton prices had fallen 25 percent in February and March 1837. A depression of nearly seven years followed, with most accounts placing full recovery in 1844.","retirementImpact":"No one had a pension to lose; older Americans’ security was land, family and bank deposits. When over 40 percent of banks failed, deposits were not safe either.","itemId":"classical-mar-0","type":"crisis"},{"year":1857,"endYear":1858,"name":"Panic of 1857","decline":"Nationwide suspension of gold and silver payments; NBER contraction June 1857 – December 1858 (18 months)","detail":"On August 24, 1857, the New York branch of the Ohio Life Insurance and Trust Company suspended payments, a failure tied to fraud by its managers. In September the SS Central America sank with gold that New York banks were waiting for. Railroad stocks had peaked that July, and several lines shut down or went bankrupt.","retirementImpact":"The largely agrarian South suffered little, while the industrial and railroad North was hit hard. Financial risk was already falling differently on the two Americas (Seed 7).","itemId":"classical-mar-1","type":"crisis"},{"year":1873,"endYear":1879,"name":"Panic of 1873 and the Long Depression","decline":"NYSE closed for 10 days; at least 100 banks failed; 65-month NBER contraction (Oct 1873 – Mar 1879)","detail":"Jay Cooke and Company, overextended in Northern Pacific Railway bonds, failed on September 18, 1873. Two days later the New York Stock Exchange closed for the first time in its history and stayed shut for ten days. The National Bureau of Economic Research (NBER) dates the downturn from October 1873 to March 1879, a 65-month contraction and the longest in its records.","retirementImpact":"The panic helped bring down the Freedman’s Savings Bank in 1874. It wiped out savings that formerly enslaved people had been building for their families’ futures.","itemId":"classical-mar-2","type":"crisis"}],"socialMovements":[{"year":1787,"name":"Free African Society and Black mutual aid","detail":"Richard Allen and Absalom Jones founded the Free African Society in Philadelphia in 1787. Members paid one shilling a month ‘to support one another in sickness, and for the benefit of their widows and fatherless children.’","significance":"It is a textbook case of the Community principle. People with little protection from the established order built their own risk pool, a pattern the book traces from medieval guilds to labor unions.","itemId":"classical-soc-0","type":"movement"},{"year":1848,"name":"Seneca Falls and women’s property rights","detail":"The Seneca Falls Convention met July 19–20, 1848. Its Declaration of Sentiments, drafted by Elizabeth Cady Stanton, charged that man ‘has taken from her all right in property, even to the wages she earns.’ That April, New York’s Married Women’s Property Act had let married women keep property they brought into marriage or received from others, and it became a model for other states.","significance":"Women’s old-age security ran through marriage. Property reform slowly began to give wives and widows assets of their own.","itemId":"classical-soc-1","type":"movement"},{"year":1866,"endYear":1890,"name":"Grand Army of the Republic","detail":"Union veterans founded the Grand Army of the Republic (GAR) in Decatur, Illinois, on April 6, 1866. It revived in the 1880s and peaked at about 410,000 members in 1890. Historian Stuart McConnell called it ‘the most powerful single-issue political lobby of the late nineteenth century.’","significance":"Organized beneficiaries pushed pensions from compensation for injury toward general support. The GAR was the first great American pension lobby.","itemId":"classical-soc-2","type":"movement"},{"year":1886,"name":"Eight-hour movement and the Haymarket affair","detail":"On May 1, 1886, an estimated 300,000 to 500,000 workers struck nationwide for an eight-hour day, including 30,000 to 40,000 in Chicago. At a Haymarket Square rally on May 4, a bomb and the gunfire that followed killed seven police officers and at least four civilians. Eight anarchists were convicted, though only two were present when the bomb exploded. Four were hanged in November 1887, and Governor John Peter Altgeld pardoned three survivors in 1893.","significance":"Industrial workers began fighting over the terms of the wage bargain itself. The book connects this struggle to the later fights for pensions and Social Security.","itemId":"classical-soc-3","type":"movement"}],"inequities":[{"title":"Coverture and the widow’s precarity","detail":"Under common law a married woman had almost no legal existence apart from her husband. She could not own property, make contracts or keep wages in her own name. A woman’s old age therefore depended on her husband living or her family being willing to support her. As the book puts it, widowhood was ‘financial ruin.’","vars":["gender"]},{"title":"Unequal pensions for Black Union veterans","detail":"About 179,000 Black soldiers served in the Union Army. Research by BYU political scientist Sven Wilson found the Pension Bureau approved 83 percent of white applications and 77 percent of Black applications from wounded veterans in 1865–1878. By the 1880s it approved claims from uninjured white veterans at more than twice the Black rate. Black veterans also often lacked the hospital records the bureau demanded, and white officials decided their claims.","vars":["race"]},{"title":"Chinese Exclusion Act (1882)","detail":"Signed by Chester A. Arthur on May 6, 1882, the act suspended immigration by Chinese laborers and barred Chinese residents from citizenship. It was extended in 1892, made permanent in 1902 and repealed only in 1943. Chinese workers had done much of the Central Pacific’s manual labor on the transcontinental railroad finished in 1869.","vars":["immigration","race"]},{"title":"The Dawes Act and Indigenous dispossession","detail":"The General Allotment Act of 1887 broke up communally held reservation land into individual parcels, 160 acres for a head of household. ‘Surplus’ land was opened to others. By the time allotment ended in 1934, land held by Native Americans had fallen from 138 million to 48 million acres. The book describes this kind of destruction of working community systems as violent dismantling.","vars":["race","place"]},{"title":"The poorhouse becomes an old-age home","detail":"Inherited from English poor law, the almshouse was the public answer to destitution. Historian Michael Katz found that, in Erie County, New York, ‘by the end of the century, the poorhouse clearly was becoming an old age home.’ As other groups were moved out, the elderly were the only ones left. For aging people without family or savings, the community’s last resort carried the stigma of pauperism.","vars":["income"]}],"historicalContext":[{"year":1346,"endYear":1353,"title":"The Black Death","detail":"Plague killed an estimated 25 to 60 percent of Europe’s population between 1346 and 1353. The book uses catastrophes like this to show why survival depended on community rather than individual planning.","itemId":"classical-his-0","type":"history"},{"year":1760,"endYear":1840,"title":"The Industrial Revolution","detail":"Beginning in Britain around 1760 and reaching the United States in the early 1800s, mechanized production moved work from farms and workshops into factories and wage labor.","significance":"Farm to factory: the change that turned growing old from a shift in role into a loss of income, the problem retirement was later invented to manage.","decline":null,"type":"history","itemId":"m-industrial-rev","master":true,"hand":"1760–1840 Industrial Revolution. Farm to factory. Climax of ideas + tech. Transformation of labor + economy."},{"year":1776,"endYear":null,"title":"Independence","detail":"The Declaration of Independence, July 4, 1776. That same year the Continental Congress promised half pay to soldiers disabled in the war, the first American public pension.","significance":"","decline":null,"type":"history","itemId":"m-1776","master":true,"hand":"1776"},{"year":1797,"title":"Thomas Paine’s Agrarian Justice","detail":"Written in the winter of 1795–96 and published in an English edition in 1797, Paine’s pamphlet proposed a national fund to support the aged and young people starting out. It was to be paid for by a 10 percent tax on inherited property, an early design for social insurance.","itemId":"classical-his-1","type":"history"},{"year":1861,"endYear":1865,"title":"The Civil War","detail":"More than 2.2 million people served in Union forces, and 140,414 died in battle, with 224,097 more deaths from other causes in the theater of war. The war left a generation of disabled and aging veterans, and the pension system that became America’s first mass old-age support.","itemId":"classical-his-2","type":"history","master":true,"hand":"Civil War 1861–1865 → seed: Segregation / Boundaries"},{"year":1880,"title":"Old men still work","detail":"In 1880 about 78 percent of American men aged 65 and older were in the labor force: 87 percent of those living on farms and 66 percent of those who did not (Costa). For most people, old age meant changing work, not ending it.","itemId":"classical-his-4","type":"history"}],"seeds":[{"seed":1,"stage":"planted","detail":"Segregation & Boundaries is older than retirement itself. Poor laws sorted the ‘deserving’ poor from the ‘undeserving.’ Coverture erased married women’s property, and caste and serfdom fixed deprivation at birth. Before 1890 the United States also wrote exclusion into law, from the Chinese Exclusion Act to the Dawes Act and unequal pension approvals for Black veterans."},{"seed":2,"stage":"planted","detail":"Two governments begin experimenting with support in old age. The United States does it through veterans’ pensions (1776, 1818, 1862, 1879), and Germany through Bismarck’s insurance laws (1883–1884), which lead to the 1889 old-age law. Both mix real protection with political management: pensions to reward loyalty, insurance to undercut socialists."},{"seed":3,"stage":"planted","detail":"This is only a precursor of 65 = Old and Done, because no fixed age of ‘old’ yet existed. Elders changed roles rather than leaving: the Roman paterfamilias, the Confucian counselor, Indigenous keepers of communal memory. Pre-1890 American pensions turned on service, disability and need, not birthdays. The number 65 appears nowhere yet, and that is the point."},{"seed":7,"stage":"planted","detail":"Before 1890 the divide runs North versus South and farm versus factory. Union pension money flowed to Northern veterans, while Confederate veterans and most Black Southerners were outside it. Farm men kept working in old age far more than other men (87 versus 66 percent in 1880)."},{"seed":8,"stage":"planted","detail":"This is a precursor only, since the book dates The Promise to the corporate pension era after 1946. Its first form appears at American Express (1875) and in the B&O Relief Department (1880). These early plans were discretionary gifts, not contracts, and the employer could withdraw them."}],"twoPersonLens":{"year":1890,"older":{"born":1830,"headline":"Retirement? Never heard of it","text":"Born in 1830, they were seven when the Panic of 1837 closed hundreds of banks and twenty-seven when the Panic of 1857 hit. In their early thirties came the Civil War. If they served in the Union army and came home wounded, the 1862 law paid a few dollars a month. Now, in 1890, they are sixty, and they have never once thought about retiring; the word means nothing to them. Most men their age are still working, and on the farm they simply shift to lighter tasks. Children, a congregation or a lodge will carry their old age. If all of those fail, the county poorhouse will. This summer, though, Congress passes the Dependent Pension Act. Old soldiers are about to learn that being worn out can be reason enough to be paid."},"younger":{"born":1870,"headline":"The generation that will be told to stop","text":"Born in 1870, five years after the Civil War ended, they turn twenty in 1890. They are walking toward the factory gate rather than the family field. They will be twenty-three when the Panic of 1893 pushes unemployment to an estimated 17 to 19 percent, thirty-seven in the Panic of 1907, and fifty-nine when the market crashes in 1929. They will be sixty-five in 1935, the year Social Security is signed. Yet its first monthly retirement check will not go out until January 1940, when they are about seventy. Nothing in their upbringing suggests that work ends. They are the generation that will eventually be told it must."},"irony":"The man who never imagined retiring will be among the first paid simply for growing old; the boy raised to work until he dropped will be among the first told he has to stop."},"keyTerms":[{"term":"Natural Order Economics","definition":"Grimm’s framework of three principles: Not Poverty (sufficiency as a floor), Community (risk shared and pooled) and Generativity (contributing across the whole lifespan). The book argues pre-industrial societies built these in and industrialization broke all three at once."},{"term":"Pe’ah","definition":"The biblical requirement (Leviticus 19:9; 23:22) to leave the corners of a field unharvested for the poor. The book reads it as an agricultural welfare system written into religious law."},{"term":"Zakat","definition":"Required almsgiving and one of the Five Pillars of Islam, customarily 2.5 percent of wealth above a minimum threshold. It goes to set categories of people, including the poor, the needy and those in debt."},{"term":"Xenodochium","definition":"A church-run hostel or hospital that first appeared in the Byzantine world, serving travelers and the needy. Related institutions specialized in the aged (gerocomium), the sick and orphans."},{"term":"Guild","definition":"A medieval association of craftsmen or merchants that regulated a trade. Guilds kept welfare funds for sick or elderly members and supported members’ widows and orphans, an early form of pooled risk."},{"term":"Almshouse (poorhouse)","definition":"A locally funded institution for the destitute, inherited from English poor law. By the late nineteenth century many American poorhouses were becoming old-age homes of last resort."},{"term":"Coverture","definition":"The common-law doctrine that folded a married woman’s legal identity into her husband’s. She could not own property, make contracts or keep wages in her own name."},{"term":"Mutual aid society","definition":"A member-run organization in which people paid regular dues to support members who fell sick and the families of members who died. It was community insurance built from below."},{"term":"Life expectancy at birth","definition":"The average lifespan of all babies born in a given period. In pre-industrial societies infant and child deaths pulled it down, so it badly understates how long people who survived childhood actually lived."}],"keyFigures":[{"name":"Otto von Bismarck","role":"German chancellor who paired the 1878 Anti-Socialist Law with social insurance: sickness (1883), accident (1884) and, in 1889, old age and disability. He told critics, ‘Call it socialism or whatever you like. It is the same to me.’"},{"name":"Thomas Paine","role":"In Agrarian Justice (written 1795–96), he proposed a national fund, paid for by a 10 percent tax on inherited property, to support the aged and young adults. It was one of the earliest designs for social insurance."},{"name":"Richard Allen and Absalom Jones","role":"Founders of Philadelphia’s Free African Society (1787), a dues-funded mutual aid society for sick members and for the widows and children of members who died."},{"name":"Frederick Douglass","role":"Elected president of the Freedman’s Savings and Trust Company in March 1874, he put in $10,000 of his own money. He then concluded he was ‘married to a corpse’ and recommended that Congress close the bank."},{"name":"Grover Cleveland","role":"As president he vetoed the 1887 Dependent Pension Bill as too costly and open to fraud. The veto framed the debate between pensions as compensation for service and pensions as general support."}],"primarySources":[{"title":"Preamble and Articles of the Free African Society","year":1787,"source":"PBS, Africans in America","url":"https://www.pbs.org/wgbh/aia/part3/3h465.html","why":"Look for how members defined mutual obligation, and for who was included and who was excluded."},{"title":"Imperial message on social insurance, with Bismarck’s Reichstag remarks","year":1881,"source":"SSA Historian’s Office","url":"https://www.ssa.gov/history/ottob.html","why":"Compare the humanitarian language (‘a well-grounded claim to care from the state’) with the political motives the book identifies."},{"title":"Veteran’s Pensions: The Law and Its Administration From the Revolutionary War to the Civil War","year":1893,"source":"VCU Social Welfare History Project","url":"https://socialwelfare.library.vcu.edu/social-security/veterans-pensions-early-history/","why":"Trace how eligibility moved from disability toward service and need, and note how an 1893 writer judged the system’s growth."},{"title":"Freedman’s Savings and Trust Company depositor records","year":1865,"source":"National Archives","url":"https://www.archives.gov/research/african-americans/freedmans-bank","why":"The signature cards record depositors’ ages, birthplaces and occupations. Ask what these savers were planning for, and what the bank’s failure took from them."}],"discussionQuestions":["The book insists the classical world was ‘not a golden age,’ yet calls its architecture of mutual obligation ‘a blueprint.’ Using evidence on coverture, serfdom, almshouses or the Dawes Act, argue whether that blueprint can be separated from the injustices that came with it.","Grimm treats the absence of a word for retirement as ‘a data point.’ Yet the 1818 service pension act and Paine’s Agrarian Justice show people thinking about support in old age well before 1890. Do these examples weaken the claim that retirement ‘did not exist,’ or confirm that what existed was something different?","Choose two institutions from this module, such as pe’ah, zakat, a guild, the Free African Society or an almshouse. Which Natural Order principles does each embody, and which does each violate?","In 1880, 87 percent of older farm men were in the labor force, compared with 66 percent of other older men. Is that evidence of the ‘evolving and embedded’ work the book describes, of economic necessity, or of both? What evidence would help you decide?","The book calls the treatment of the aging ‘a moral and philosophical question masquerading as a financial one.’ What would a retirement system designed from moral obligation, rather than from individual accounts, look like in practice?","The Freedman’s Savings Bank, the Chinese Exclusion Act and unequal pension approvals for Black veterans all came before 1890. How do they support the claim that Seed 1 (Segregation & Boundaries) is older than retirement itself?"],"assignment":{"title":"Then and Now: A Community Care System Through the Natural Order Lens","type":"Primary source analysis","prompt":"Choose one community care system from before 1890 and at least one primary text that describes it. Options include pe’ah (Leviticus 19:9–10), zakat, a medieval guild ordinance, the 1601 Poor Relief Act, the Free African Society’s articles (1787), Bismarck’s 1881 imperial message, or a Revolutionary or Civil War pension law. Analyze the system through all three Natural Order principles: Not Poverty, Community and Generativity. Then compare it with the main tools of modern American retirement, Social Security and the 401(k): who carries the risk, who is included, and what is expected of the aging person? Address the injustices of your system honestly. Close by evaluating the book’s claim that the classical world offers ‘a blueprint.’ Which part is worth recovering, and which part must stay behind?","deliverable":"1,200–1,500 word analytical essay citing at least one primary source and at least two scholarly or official secondary sources (Chicago or MLA).","points":100,"rubric":[{"criterion":"Primary source analysis & historical context","points":30,"exemplary":"Reads the primary text closely, with precise quotation, and places it accurately in its time, place and social order.","proficient":"Analyzes the source accurately with some context; the quotations support the points made.","developing":"Mostly summarizes the source; context is thin or has minor errors.","beginning":"Misreads the source, gives no context, or uses no primary source."},{"criterion":"Application of the three Natural Order principles","points":25,"exemplary":"Applies all three principles with nuance, showing where the system honors and where it violates each one.","proficient":"Applies all three principles accurately but unevenly.","developing":"Applies one or two principles, or uses them as labels without analysis.","beginning":"Principles are missing or misdefined."},{"criterion":"Comparison with modern retirement & evaluation of the book’s claim","points":25,"exemplary":"Builds a clear argument comparing risk, inclusion and expectations, weighs the ‘blueprint’ claim with evidence, and takes a defensible position.","proficient":"Makes a sound comparison and takes a position, with some evidence.","developing":"The comparison is superficial or the position is asserted without support.","beginning":"No real comparison or evaluation."},{"criterion":"Writing, organization & citation","points":20,"exemplary":"Clear thesis, logical structure, clean prose, and correct citations that meet the source requirements.","proficient":"Organized and readable, with minor citation or style errors.","developing":"Organization or prose gets in the way of the argument, or a source requirement is missed.","beginning":"Disorganized, with missing or improper citations."}]},"quiz":[{"q":"In 1880, about what share of American men aged 65 and older were in the labor force?","options":["About 25 percent","About 50 percent","About 78 percent","About 95 percent"],"answer":2,"explain":"Economic historian Dora Costa’s census-based estimate for 1880 is about 78 percent. Most older men kept working, especially on farms."},{"q":"What did the biblical law of pe’ah require?","options":["A tithe paid to priests","Leaving the corners of a field unharvested for the poor","A tax on inherited property","A guild fund for funerals"],"answer":1,"explain":"Pe’ah (Leviticus 19:9; 23:22) required farmers to leave the corners of their fields for the poor. The book calls it an agricultural welfare system written into religious law."},{"q":"Which company created the first formal private pension plan in the United States, in 1875?","options":["The Pennsylvania Railroad","American Express","Standard Oil","The Baltimore & Ohio Railroad"],"answer":1,"explain":"American Express created the first formal U.S. private pension in 1875. The B&O’s Relief Department followed in 1880, and the Pennsylvania Railroad’s plan in 1900."},{"q":"Who became president of the Freedman’s Savings and Trust Company in March 1874 and then recommended that Congress close it?","options":["Frederick Douglass","Booker T. Washington","Richard Allen","W. E. B. Du Bois"],"answer":0,"explain":"Frederick Douglass invested $10,000 of his own money, concluded he was ‘married to a corpse,’ and advised closing the bank, which shut on June 29, 1874."},{"q":"According to the book’s ‘life expectancy paradox,’ what mainly explains the low average life expectancy at birth in pre-industrial societies?","options":["Most adults died in their thirties","Very high infant and child mortality pulled the average down","People stopped working at 40","Census records were incomplete"],"answer":1,"explain":"Deaths among infants and children dragged the average down. People who survived childhood often lived into their fifties, sixties and beyond."}],"sources":[{"label":"SSA Historian’s Office — Otto von Bismarck","url":"https://www.ssa.gov/history/ottob.html"},{"label":"SSA Historian’s Office — Thomas Paine","url":"https://www.ssa.gov/history/tpaine3.html"},{"label":"SSA Historian’s Office — Social Security Act of 1935 (benefit start dates)","url":"https://www.ssa.gov/history/35act.html"},{"label":"SSA Historian’s Office — Ida May Fuller, first monthly check (1940)","url":"https://www.ssa.gov/history/imf.html"},{"label":"SSA Historian’s Office — Life Expectancy for Social Security","url":"https://www.ssa.gov/history/lifeexpect.html"},{"label":"VCU Social Welfare History Project — Veteran’s Pensions, Revolutionary War to Civil War","url":"https://socialwelfare.library.vcu.edu/social-security/veterans-pensions-early-history/"},{"label":"VCU Social Welfare History Project — Poor Relief in Early America","url":"https://socialwelfare.library.vcu.edu/programs/poor-relief-early-amer/"},{"label":"National Archives, Prologue — Civil War pension system","url":"https://www.archives.gov/publications/prologue/2010/spring/civilwarpension.html"},{"label":"National Archives, Prologue — Freedman’s Savings and Trust Company","url":"https://www.archives.gov/publications/prologue/1997/summer/freedmans-savings-and-trust.html"},{"label":"National Archives — Freedman’s Bank records","url":"https://www.archives.gov/research/african-americans/freedmans-bank"},{"label":"National Archives — Chinese Exclusion Act (1882)","url":"https://www.archives.gov/milestone-documents/chinese-exclusion-act"},{"label":"EH.Net — Economic History of Retirement in the United States","url":"https://eh.net/encyclopedia/economic-history-of-retirement-in-the-united-states/"},{"label":"Costa, The Evolution of Retirement, ch. 2 (NBER)","url":"https://www.nber.org/chapters/c6108.pdf"},{"label":"SSA Social Security Bulletin — early private pension plans","url":"https://ssa.gov/policy/docs/ssb/v16n3/v16n3p7.pdf"},{"label":"B&O Railroad Museum — Relief Department records finding aid","url":"https://www.borail.org/wp-content/uploads/2024/10/BO-Relief-Records-FindingAid.pdf"},{"label":"Federal Reserve History — Banking Panics of the Gilded Age","url":"https://www.federalreservehistory.org/essays/banking_panics_of_the_gilded_age"},{"label":"NBER — U.S. Business Cycle Expansions and Contractions","url":"https://www.nber.org/research/data/us-business-cycle-expansions-and-contractions"},{"label":"Panic of 1837 (overview citing Bancroft 1902, Temin 1969, Rousseau 2002)","url":"https://en.wikipedia.org/wiki/Panic_of_1837"},{"label":"Panic of 1857 (overview)","url":"https://en.wikipedia.org/wiki/Panic_of_1857"},{"label":"Dependent and Disability Pension Act — Cleveland veto & Arrears Act (citing McConnell, Glasson)","url":"https://en.wikipedia.org/wiki/Dependent_and_Disability_Pension_Act"},{"label":"Grand Army of the Republic (citing McConnell)","url":"https://en.wikipedia.org/wiki/Grand_Army_of_the_Republic"},{"label":"BYU News — Racial discrimination in Union Army pensions","url":"https://news.byu.edu/news/racial-discrimination-union-army-pensions-detailed-new-study"},{"label":"Essential Civil War Curriculum — Civil War Pensions","url":"https://www.essentialcivilwarcurriculum.com/civil-war-pensions.html"},{"label":"Free African Society","url":"https://en.wikipedia.org/wiki/Free_African_Society"},{"label":"Seneca Falls Convention","url":"https://en.wikipedia.org/wiki/Seneca_Falls_Convention"},{"label":"Married Women’s Property Acts in the United States","url":"https://en.wikipedia.org/wiki/Married_Women%27s_Property_Acts_in_the_United_States"},{"label":"Haymarket affair","url":"https://en.wikipedia.org/wiki/Haymarket_affair"},{"label":"EBSCO Research Starters — Anti-Socialist Law of 1878","url":"https://www.ebsco.com/research-starters/history/anti-socialist-law-1878"},{"label":"Encyclopedia of the Great Plains — Dawes General Allotment Act","url":"https://plainshumanities.unl.edu/encyclopedia/doc/egp.law.015.html"},{"label":"Katz, ‘Poorhouses and the Origins of the Public Old Age Home,’ Milbank Quarterly (1984)","url":"https://www.milbank.org/wp-content/uploads/mq/volume-62/issue-01/62-1-Poorhouses-and-the-Origins-of-the-Public-Old-Age-Home.pdf"},{"label":"Poor Relief Act 1601","url":"https://en.wikipedia.org/wiki/Poor_Relief_Act_1601"},{"label":"U.S. Department of Veterans Affairs — America’s Wars fact sheet","u

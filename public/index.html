ury rejected the application, citing an unreasonable 7.5% return assumption, an inequitable distribution of the cuts and notices that participants could not understand. The fund expected to become insolvent around 2026.","significance":"The rejection bought time without solving anything, and the plan’s fate passed to Congress. It shows the Government Involvement seed as protector and bystander at once.","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"correction-pol-1","lane":"policy","type":"policy","year":2017,"endYear":null,"title":"OregonSaves: The First State Auto-IRA","detail":"Launched in October 2017, OregonSaves was the first state program to enroll workers automatically in payroll-deduction IRAs when their employers offered no plan. As of August 31, 2026, 15 reporting state auto-IRA programs held more than $3.4 billion across more than 1.4 million funded accounts (Georgetown Center for Retirement Initiatives).","significance":"It redirects the Segregation & Boundaries seed by reaching workers the employer system leaves out, while keeping individual ownership and market risk.","decline":null,"module":"correction","projected":false,"master":false,"hand":null},{"id":"collapse-pol-4","lane":"policy","type":"legislation","year":2019,"endYear":null,"title":"SECURE Act","detail":"Signed December 20, 2019, as part of the Further Consolidated Appropriations Act, 2020 (P.L. 116-94). The law raised the required minimum distribution age from 70½ to 72 and ended the “stretch IRA” for most non-spouse heirs by imposing a 10-year payout rule. It also opened 401(k)s to long-term part-time workers, let unrelated small employers share pooled plans and created a safe harbor for offering annuities inside 401(k)s.","significance":"The first major retirement law of the Collapse era tuned the individual-account machine rather than questioning it: the Individualism seed with better plumbing.","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"correction-pol-2","lane":"policy","type":"policy","year":2019,"endYear":null,"title":"CalSavers Launches Statewide","detail":"California’s program launched July 1, 2019, with a default contribution of 5% of pay that workers can change or opt out of. Employers with five or more employees and no retirement plan had to offer a plan or facilitate CalSavers on deadlines from 2020 to 2022. At launch the state estimated that more than 7 million Californians lacked a workplace plan; by June 30, 2026, CalSavers held about $1.88 billion across 652,929 funded accounts.","significance":"It uses a collective tool, a state mandate plus a default, to build individual savings. Is that Community, or Individualism with better plumbing?","decline":null,"module":"correction","projected":false,"master":false,"hand":null},{"id":"m-covid-19","lane":"history","type":"history","year":2020,"endYear":null,"title":"The COVID-19 pandemic","detail":"The World Health Organization declared COVID-19 a pandemic on March 11, 2020. More than 1.1 million Americans died of it.","significance":"He pairs it with 1918, “the original COVID-19.” Both pandemics reshaped work and family; this one also pushed a wave of older workers into early retirement.","decline":null,"module":"collapse","projected":false,"master":true,"hand":"COVID-19"},{"id":"collapse-mar-0","lane":"markets","type":"crisis","year":2020,"endYear":2020,"title":"The COVID Crash","detail":"Pandemic shutdowns produced what was then the fastest bear market on record, a nearly 34% fall that lasted barely more than a month. The S&P 500 closed at a new record on August 18, 2020, about five months after the bottom.","significance":"Savers who had to sell near the bottom, including newly displaced older workers, locked in losses that the averages quickly erased.","decline":"−34% (S&P 500, Feb 19 – Mar 23, 2020)","module":"collapse","projected":false,"master":true,"hand":"COVID Crash"},{"id":"correction-his-1","lane":"history","type":"history","year":2021,"endYear":null,"title":"The Return of the Multigenerational Household","detail":"Pew Research found that 59.7 million Americans, 18% of the population, lived in multigenerational households in 2021, up from 7% in 1971. Some families choose it for care, others out of financial necessity: the old Community answer returning under modern pressures.","significance":"","decline":null,"module":"correction","projected":false,"master":false,"hand":null},{"id":"collapse-soc-2","lane":"movements","type":"movement","year":2021,"endYear":2022,"title":"The Great Resignation and the Pandemic Retirement Wave","detail":"Quits reached a then-series high of 4.5 million in November 2021 (BLS JOLTS). One estimate counted more than 2.4 million “excess” retirements by August 2021. The St. Louis Fed found that the excess peaked in late 2021 and had disappeared by late 2024.","significance":"The surge and its fade suggest that retirement timing tracks markets and circumstances rather than a fixed plan or age.","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"collapse-pol-5","lane":"policy","type":"legislation","year":2021,"endYear":null,"title":"American Rescue Plan: Special Financial Assistance for Multiemployer Pensions","detail":"The American Rescue Plan Act, signed March 11, 2021, incorporated the multiemployer rescue championed as the Butch Lewis Act. It created non-repayable Special Financial Assistance, paid from general taxpayer funds, for severely underfunded plans. Central States received about $35.8 billion in December 2022 for 357,056 participants; without it, the plan was projected to run out of money in 2025 and benefits would have dropped roughly 60% below plan terms. By May 2026, the PBGC had approved about $77.9 billion for 161 plans covering roughly 1.8 million people.","significance":"The Promise was kept, but by taxpayers rather than by the employers who made it. The Community principle reappeared as a federal backstop.","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"m-fair-access-2021","lane":"policy","type":"policy","year":2021,"endYear":null,"title":"The fight over fair access to banking","detail":"In January 2021 the Office of the Comptroller of the Currency issued a “fair access” rule requiring large banks to judge customers individually rather than refusing whole categories of lawful business; it was paused weeks later. Fair Access to Banking Act bills were reintroduced in Congress in 2025, and an August 7, 2025, executive order directed regulators to act against politicized “debanking.”","significance":"The newest chapter in a long argument over who gets access to financial services, and on what terms.","decline":null,"module":"collapse","projected":false,"master":true,"hand":"Fair Access to Fin. Serv. Act"},{"id":"collapse-mar-1","lane":"markets","type":"crisis","year":2022,"endYear":2022,"title":"The 2022 Bear Market","detail":"Rising inflation and interest rates pushed U.S. stocks down about a quarter from their January peak. Bonds offered no shelter: the Morningstar US Core Bond Index fell 12.9% in 2022, its worst year on record.","significance":"Stocks and bonds fell together, so the “balanced” portfolios sold to near-retirees as the safe option lost value on both sides.","decline":"≈ −25% (U.S. stocks, Jan 3 – mid-Oct 2022; Morningstar US Market Index −25.4% from peak)","module":"collapse","projected":false,"master":false,"hand":null},{"id":"collapse-pol-6","lane":"policy","type":"legislation","year":2022,"endYear":null,"title":"SECURE 2.0 Act","detail":"Signed December 29, 2022. From 2025, most new 401(k) and 403(b) plans must automatically enroll workers at 3–10% of pay with annual increases. The law also raised the RMD age to 73, rising to 75 in 2033, and allowed employers to match student-loan payments. Its federal Saver’s Match pays 50% of up to $2,000 in contributions for lower- and moderate-income savers, starting with 2027 contributions.","significance":"Automatic enrollment uses a collective tool, the default, to rescue an individual system. Students should ask whether nudges answer the structural question or only make it quieter.","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"collapse-his-2","lane":"history","type":"history","year":2024,"endYear":2027,"title":"Peak 65","detail":"From 2024 through 2027, more than 4.1 million Americans a year, about 11,200 a day, turn 65, according to the Alliance for Lifetime Income’s Retirement Income Institute. The institute notes that most of these households lack a pension.","significance":"","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"collapse-his-3","lane":"history","type":"history","year":2025,"endYear":null,"title":"Student Debt Goes Gray","detail":"Borrowers aged 50 and older held about 26% of outstanding federal student debt in early 2025. The Fed’s 2025 survey found that 20% of families carry student debt, with a median balance of $25,600.","significance":"","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"lens-2025-8","lane":"lens","type":"lens","year":2025,"endYear":null,"title":"Two-Person Lens, 2025","detail":"","significance":"The 60-year-old is racing to leave a system as its exit narrows, while the 20-year-old is told to save for a system that never let him in.","decline":null,"module":"collapse","projected":false,"lens":"lens-2025-8"},{"id":"collapse-mar-2","lane":"markets","type":"crisis","year":2025,"endYear":2025,"title":"The Tariff Shock","detail":"After sweeping tariff announcements, the S&P 500 closed almost 19% below its February 19 record on April 8, 2025, just short of a bear market. It recovered to a record close by June 27, 2025.","significance":"Peak 65 retirees saw a fifth of their equity value threatened within weeks of leaving work: sequence-of-returns risk in real time.","decline":"≈ −19% (S&P 500, Feb 19 – Apr 8, 2025)","module":"collapse","projected":false,"master":false,"hand":null},{"id":"collapse-pol-7","lane":"policy","type":"legislation","year":2025,"endYear":null,"title":"Social Security Fairness Act","detail":"Signed January 5, 2025 (P.L. 118-273), after votes of 327–75 in the House and 76–20 in the Senate, the Act repealed the Windfall Elimination Provision and the Government Pension Offset. Those rules had reduced or eliminated Social Security benefits for more than 3.2 million people with pensions from jobs not covered by Social Security. By late April 2025, the SSA had paid more than $14.8 billion in retroactive benefits to over 2.2 million people.","significance":"The law redrew a boundary (Seed 1) in favor of public workers. The 2025 Trustees named it the primary contributor to the change in the combined trust fund depletion date, so generosity and solvency pulled in opposite directions.","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"collapse-pol-8","lane":"policy","type":"legislation","year":2025,"endYear":null,"title":"One Big Beautiful Bill Act: Senior Deduction","detail":"Signed July 4, 2025 (P.L. 119-21), the law added a temporary $6,000 deduction for each taxpayer aged 65 or older for tax years 2025–2028, phasing out above $75,000 in modified adjusted gross income ($150,000 for joint filers). The Committee for a Responsible Federal Budget’s analysis of the 2026 Trustees Report finds that the law cut Social Security’s 75-year balance by 0.16% of taxable payroll, about a quarter of that year’s deterioration, by lowering revenue from income taxes on benefits.","significance":"Tax relief for today’s seniors came partly at the cost of the trust fund’s future. Students can test whether this fits the book’s pattern of “accountability without proximity.”","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"correction-pol-3","lane":"policy","type":"legislation","year":2025,"endYear":null,"title":"Children’s Seed Accounts (“Trump Accounts”)","detail":"Administered through the IRS, these are a new type of individual retirement account designed for minors. A federal pilot deposits $1,000 for U.S.-citizen children born from January 1, 2025, through December 31, 2028, and general contributions opened July 4, 2026. The IRS reported more than 4 million children enrolled, with over a million families electing the pilot deposit.","significance":"Supporters see wealth-building that starts at birth and compounds across a lifetime. Critics ask whether it extends Individualism into infancy. Evaluate it against Generativity and Not Poverty.","decline":null,"module":"correction","projected":false,"master":false,"hand":null},{"id":"lens-2026-9","lane":"lens","type":"lens","year":2026,"endYear":null,"title":"Two-Person Lens, 2026","detail":"","significance":"For the first time in this history, the 60-year-old and the 20-year-old can ask the same question, “who gave us this dream?”, at the same table, before either has been fully consumed by the answer.","decline":null,"module":"correction","projected":false,"lens":"lens-2026-9"},{"id":"conclusion-pol-5","lane":"policy","type":"policy","year":2026,"endYear":null,"title":"2026 Trustees Report (projected depletion dates)","detail":"The 2026 Social Security Trustees Report projects that the retirement (OASI) trust fund reserves will run out in the fourth quarter of 2032. At that point incoming revenue would pay about 78 percent of scheduled benefits. Combined OASDI reserves are projected to run out in 2034, after which about 83 percent would be payable. These are projections, under the Trustees’ intermediate assumptions.","significance":"The book points to this kind of projection when it calls the catastrophe ‘a projection of what is already underway.’ Notice that the projection is of reduced benefits, not zero benefits.","decline":null,"module":"conclusion","projected":false,"master":false,"hand":null},{"id":"correction-pol-4","lane":"policy","type":"policy","year":2026,"endYear":null,"title":"The Social Security Solvency Menu (2026 Trustees Report)","detail":"The 2026 Trustees calculate that the 75-year deficit could be eliminated by raising the combined payroll tax immediately from 12.4% to 16.83%, by cutting all scheduled benefits immediately by 25.9%, or by a combination of the two. Lawmakers have also proposed changes to the retirement age, the benefit formula and the taxable-earnings cap. CRS estimates show the cost of delay: acting only at depletion would require roughly a 4.9-point tax increase or a 28.5% benefit cut.","significance":"The options are structural answers to a structural question, and each assigns the cost to a different group. That makes the choice a moral one as well as an actuarial one.","decline":null,"module":"correction","projected":false,"master":false,"hand":null},{"id":"correction-pol-5","lane":"policy","type":"legislation","year":2027,"endYear":null,"title":"The Saver’s Match Begins","detail":"Under SECURE 2.0, the federal government will deposit a match of 50% on up to $2,000 of a lower- or moderate-income saver’s retirement contributions, up to $1,000 a year. The match starts with 2027 contributions and is paid in 2028. In August 2026 the Treasury and IRS announced their intent to issue implementing regulations.","significance":"Public money flows to the savers the system has served least, redirecting the Two Americas seed. Whether a match is enough without a guaranteed floor is open to debate.","decline":null,"module":"correction","projected":true,"master":false,"hand":null},{"id":"collapse-his-4","lane":"history","type":"history","year":2029,"endYear":null,"title":"Projected: Older Americans Outnumber Children","detail":"Projected. In the Census Bureau’s 2023 middle-series projections, Americans aged 65 and older outnumber children under 18 for the first time in 2029.","significance":"","decline":null,"module":"collapse","projected":true,"master":false,"hand":null},{"id":"collapse-pol-9","lane":"policy","type":"policy","year":2032,"endYear":null,"title":"Projected: Social Security Retirement Trust Fund (OASI) Depleted","detail":"Projected. The 2026 Trustees Report (released June 9, 2026) projects that OASI reserves will be depleted in the fourth quarter of 2032. Payroll taxes would then cover about 78% of scheduled benefits, falling to 62% by 2100. CBO’s September 2026 projections are more pessimistic, with exhaustion in fiscal 2032 and a 26% cut. Medicare’s Hospital Insurance fund is projected to be depleted in 2033, when 89% of costs would be payable.","significance":"The book wrote “mid-2030s” and “75–80%,” and the newest official projections move the date earlier. This is the hinge between Collapse and Catastrophe. It is a projection under current law, not a certainty, because Congress can act.","decline":null,"module":"collapse","projected":true,"master":false,"hand":null},{"id":"catastrophe-pol-0","lane":"policy","type":"policy","year":2034,"endYear":null,"title":"Projected: Combined Social Security Trust Funds Depleted","detail":"Projected. The 2026 Trustees Report projects that the combined OASI and DI reserves will be depleted in the third quarter of 2034, after which 83% of scheduled benefits would be payable, falling to 65% by 2100. CBO’s September 2026 projections are earlier and deeper: combined exhaustion in 2033, a 23% cut rising to 37% by 2100.","significance":"Under current law the program does not end; it shrinks automatically to fit its revenue. The Promise seed becomes a percentage.","decline":null,"module":"catastrophe","projected":true,"master":false,"hand":null},{"id":"catastrophe-his-0","lane":"history","type":"history","year":2040,"endYear":null,"title":"Projected: 78 Million Americans Aged 65+","detail":"Projected. The Administration for Community Living’s 2023 Profile of Older Americans, using Census projections, puts the 65+ population at 78.3 million in 2040 (57.8 million in 2022) and the 85+ population at 13.7 million (6.5 million in 2022).","significance":"","decline":null,"module":"catastrophe","projected":true,"master":false,"hand":null},{"id":"catastrophe-pol-3","lane":"policy","type":"policy","year":2040,"endYear":null,"title":"Projected: Medicare Hospital Insurance Cut Deepens","detail":"Projected. The 2026 Medicare Trustees project that the Hospital Insurance (Part A) trust fund will be depleted in 2033, when payroll taxes and other income would cover about 89% of costs. CRFB calculates that the resulting automatic cut would grow from 11% to 16% by 2040.","significance":"Healthcare, the book’s “hidden enemy” of old age, returns just as the 85+ population surges.","decline":null,"module":"catastrophe","projected":true,"master":false,"hand":null},{"id":"catastrophe-his-1","lane":"history","type":"history","year":2044,"endYear":null,"title":"All Surviving Boomers Are 80 or Older","detail":"By definition, the Baby Boom cohort born from 1946 through 1964 is entirely 80 or older by 2044, the decade when care needs rise most steeply.","significance":"","decline":null,"module":"catastrophe","projected":true,"master":false,"hand":null},{"id":"catastrophe-his-2","lane":"history","type":"history","year":2045,"endYear":null,"title":"Projected: 2.2 Workers per Beneficiary","detail":"Projected. The 2026 Trustees Report projects 2.2 covered workers per Social Security beneficiary in 2045 and 2050, falling to 2.1 in 2060 and 1.9 by 2075. In 1960 the figure was 5.1.","significance":"","decline":null,"module":"catastrophe","projected":true,"master":false,"hand":null},{"id":"lens-2045-10","lane":"lens","type":"lens","year":2045,"endYear":null,"title":"Two-Person Lens, 2045","detail":"","significance":"She paid into every promise and may collect only part of it; he was handed an account at birth and told the future is his to fund.","decline":null,"module":"catastrophe","projected":true,"lens":"lens-2045-10"},{"id":"catastrophe-pol-4","lane":"policy","type":"policy","year":2050,"endYear":null,"title":"Projected: Hospital Insurance Covers About 85% of Costs","detail":"Projected. Under the 2026 Medicare Trustees’ intermediate assumptions, Hospital Insurance income would cover about 85% of scheduled Part A benefits by 2050, recovering to about 93% by 2100. The fund’s 75-year deficit widened to 0.56% of taxable payroll in 2026, from 0.42% a year earlier.","significance":"The projected gap peaks just as the last Boomers enter their late 80s.","decline":null,"module":"catastrophe","projected":true,"master":false,"hand":null},{"id":"catastrophe-pol-5","lane":"policy","type":"policy","year":2056,"endYear":null,"title":"Projected: Federal Debt Reaches 175% of GDP","detail":"Projected. CBO’s extended February 2026 baseline projects debt held by the public at 175% of GDP by 2056, with interest costs rising from 3.2% of GDP in 2025 to 6.9%. Social Security spending grows by 0.8% of GDP and major health programs by 2.1% of GDP over the same period.","significance":"Any rescue of the trust funds through general revenue would compete with interest costs. The fiscal room for Government Involvement narrows.","decline":null,"module":"catastrophe","projected":true,"master":false,"hand":null},{"id":"catastrophe-his-3","lane":"history","type":"history","year":2060,"endYear":null,"title":"Projected: The Old-Age Dependency Ratio Climbs","detail":"Projected. Census projections show the old-age dependency ratio (people 65+ per 100 working-age adults) rising from 28 in 2020 to 41 in 2060. The 2017-series projections put the 85+ population at about 19 million in 2060.","significance":"","decline":null,"module":"catastrophe","projected":true,"master":false,"hand":null},{"id":"catastrophe-pol-6","lane":"policy","type":"policy","year":2084,"endYear":null,"title":"Projected: Social Security Cost Peaks","detail":"Projected. The 2026 Trustees project that Social Security costs rise from about 5.3% of GDP in 2026 to a peak of about 6.9% in 2084. Non-interest income stays between about 4.4% and 4.8% of GDP.","significance":"The gap is structural, built into the age profile of the population rather than caused by a single downturn. This fits the book’s claim that the problem is arithmetic rather than bad luck.","decline":null,"module":"catastrophe","projected":true,"master":false,"hand":null},{"id":"catastrophe-his-4","lane":"history","type":"history","year":2100,"endYear":null,"title":"Projected: Nearly 3 in 10 Americans Aged 65+","detail":"Projected. In the Census Bureau’s 2023 middle series, 29.1% of the U.S. population is 65 or older in 2100, and as much as 35.6% in a zero-immigration scenario.","significance":"","decline":null,"module":"catastrophe","projected":true,"master":false,"hand":null},{"id":"catastrophe-pol-7","lane":"policy","type":"policy","year":2100,"endYear":null,"title":"Projected: Retirement Benefits Payable Fall to 62%","detail":"Projected. If no law changes, the 2026 Trustees project that the retirement (OASI) program could pay 62% of scheduled benefits by 2100, and the combined program 65%. The 75-year actuarial deficit stood at 4.42% of taxable payroll in 2026, up from 3.82% in 2025.","significance":"This is the long tail of inaction, the projection the book’s title names. Today’s college students would be in their nineties.","decline":null,"module":"catastrophe","projected":true,"master":false,"hand":null}],"sp":[[1871,4.44],[1872,4.86],[1873,5.11],[1874,4.66],[1875,4.54],[1876,4.46],[1877,3.55],[1878,3.25],[1879,3.58],[1880,5.11],[1881,6.19],[1882,5.92],[1883,5.81],[1884,5.18],[1885,4.24],[1886,5.2],[1887,5.58],[1888,5.31],[1889,5.24],[1890,5.38],[1891,4.84],[1892,5.51],[1893,5.61],[1894,4.32],[1895,4.25],[1896,4.27],[1897,4.22],[1898,4.88],[1899,6.08],[1900,6.1],[1901,7.07],[1902,8.12],[1903,8.46],[1904,6.68],[1905,8.43],[1906,9.87],[1907,9.56],[1908,6.85],[1909,9.06],[1910,10.08],[1911,9.27],[1912,9.12],[1913,9.3],[1914,8.37],[1915,7.48],[1916,9.33],[1917,9.57],[1918,7.21],[1919,7.85],[1920,8.83],[1921,7.11],[1922,7.3],[1923,8.9],[1924,8.83],[1925,10.58],[1926,12.65],[1927,13.4],[1928,17.53],[1929,24.86],[1930,21.71],[1931,15.98],[1932,8.3],[1933,7.09],[1934,10.54],[1935,9.26],[1936,13.76],[1937,17.59],[1938,11.31],[1939,12.5],[1940,12.3],[1941,10.55],[1942,8.93],[1943,10.09],[1944,11.85],[1945,13.49],[1946,18.02],[1947,15.21],[1948,14.83],[1949,15.36],[1950,16.88],[1951,21.21],[1952,24.19],[1953,26.18],[1954,25.46],[1955,35.6],[1956,44.15],[1957,45.43],[1958,41.12],[1959,55.62],[1960,58.03],[1961,59.72],[1962,69.07],[1963,65.06],[1964,76.45],[1965,86.12],[1966,93.32],[1967,84.45],[1968,95.04],[1969,102.0],[1970,90.31],[1971,93.49],[1972,103.3],[1973,118.4],[1974,96.11],[1975,72.56],[1976,96.86],[1977,103.8],[1978,90.25],[1979,99.71],[1980,110.9],[1981,133.0],[1982,117.3],[1983,144.3],[1984,166.4],[1985,171.6],[1986,208.2],[1987,264.5],[1988,250.5],[1989,285.4],[1990,339.97],[1991,325.49],[1992,416.08],[1993,435.23],[1994,472.99],[1995,465.25],[1996,614.42],[1997,766.22],[1998,963.36],[1999,1248.77],[2000,1425.59],[2001,1335.63],[2002,1140.21],[2003,895.84],[2004,1132.52],[2005,1181.41],[2006,1278.73],[2007,1424.16],[2008,1378.76],[2009,865.58],[2010,1123.58],[2011,1282.62],[2012,1300.58],[2013,1480.4],[2014,1822.36],[2015,2028.18],[2016,1918.6],[2017,2275.12],[2018,2789.8],[2019,2607.39],[2020,3278.2],[2021,3793.75],[2022,4573.82],[2023,3960.66],[2024,4804.49],[2025,5979.52],[2026,6929.12]],"course":{"title":"The Story of Retirement","subtitle":"A history of an idea that hasn't been around that long","description":"Retirement as most Americans picture it (stop working around 65 and live off your money) is about 130 years old, and it is coming apart. This course starts where we are: the collapse of the retirement system most Americans were promised, 2010 to 2040. Then it works backward to see how we got here, through the 401(k) era, the postwar golden age, the Depression and Social Security, Bismarck's pension, and the world that had no word for retirement. Only then does it turn forward again, to where the current path leads and what a correction could look like. Students read Jonathan Grimm's history, work with an interactive timeline of policy, markets, movements and inequities, and follow nine 'seeds' from today's harvest back to their roots. The course ends with the question the book asks every reader: who gave you that dream, and what would a better answer to the human question of aging look like?","outcomes":["Trace today's retirement system back to its origins, from the 401(k) era through Social Security and Bismarck to pre-industrial community care, using dated evidence.","Explain how policy, markets, social movements and exclusions interacted in each era, and identify who each system served and who it left out.","Apply the nine-seeds framework to analyze how an idea becomes an institution, and evaluate where the framework is strong or weak.","Distinguish the humanitarian question (how do we care for people as they age?) from the structural question (what systems do we build to do it?), and analyze how the two were conflated.","Use primary sources and quantitative data (Trustees Reports, the Survey of Consumer Finances, market history) to test claims about retirement security.","Design and defend a corrective proposal grounded in evidence and in the principles of Not Poverty, Community and Generativity."],"schedule":[{"weeks":"Weeks 1–2","module":"collapse","focus":"Where we are: living inside the collapse"},{"weeks":"Week 3","module":"conclusion","focus":"How to read this story: a history that begins at the end"},{"weeks":"Weeks 4–5","module":"codify","focus":"How we got here: the 401(k) and the great risk transfer"},{"weeks":"Weeks 6–7","module":"climax","focus":"How we got here: the golden age and its boundaries"},{"weeks":"Week 8","module":"crucible","focus":"How we got here: Depression, Social Security and war"},{"weeks":"Week 9","module":null,"focus":"Timeline Annotation Project due; mid-course review"},{"weeks":"Week 10","module":"conception","focus":"How we got here: Bismarck, the Civil War pension, the factory gate"},{"weeks":"Week 11","module":"classical","focus":"The root: a world with no word for retirement"},{"weeks":"Week 12","module":"catastrophe","focus":"Where it's heading: projections, scenarios and choices"},{"weeks":"Weeks 13–14","module":"correction","focus":"What we do now: untying the knot"},{"weeks":"Week 15","module":null,"focus":"Capstone presentations"}],"grading":[{"component":"Unit assignments","weight":40,"detail":"Eight assignments (Units 1–8), 100 points each, graded with the rubric on each unit page."},{"component":"Seed Journal","weight":15,"detail":"Twelve weekly entries tracing one or more of the nine seeds through the week's reading and a current news item."},{"component":"Timeline Annotation Project","weight":15,"detail":"Mid-course project: add five well-sourced events to the timeline and argue which seed each one waters."},{"component":"Self-checks and discussion","weight":10,"detail":"Unit self-check quizzes completed before class, plus contributions to discussion."},{"component":"Capstone: Design a Correction","weight":20,"detail":"The Unit 9 (Correction) assignment, submitted in writing and presented in Week 15."}],"scale":[{"grade":"A","range":"93–100"},{"grade":"A−","range":"90–92"},{"grade":"B+","range":"87–89"},{"grade":"B","range":"83–86"},{"grade":"B−","range":"80–82"},{"grade":"C+","range":"77–79"},{"grade":"C","range":"73–76"},{"grade":"C−","range":"70–72"},{"grade":"D","range":"60–69"},{"grade":"F","range":"below 60"}],"projects":[{"id":"seed-journal","title":"Seed Journal","weight":15,"prompt":"Each week, write one entry (300–400 words) that follows at least one of the nine seeds, starting from where it shows up today and tracing it back toward its root. Name the seed, quote or cite the passage from that week's chapter where you see it, then connect it to one current news story, policy debate, advertisement or conversation from your own life. End each entry with one question you can't yet answer. By Week 14 your journal should show how at least five different seeds grow across time.","deliverable":"12 entries, 300–400 words each, submitted weekly. Each entry cites the chapter and one outside source.","rubric":[{"criterion":"Seed identification","points":30,"exemplary":"Names the seed precisely and shows exactly where it appears in the reading, distinguishing it from neighboring seeds.","proficient":"Names the seed and points to a relevant passage.","developing":"Names a seed but the connection to the reading is loose.","beginning":"Seed is missing or misidentified."},{"criterion":"Present-day connection","points":30,"exemplary":"Links the seed to a specific, sourced present-day example and explains the mechanism connecting past and present.","proficient":"Links to a relevant present-day example with a source.","developing":"Present-day example is general or unsourced.","beginning":"No present-day connection."},{"criterion":"Growth over time","points":25,"exemplary":"Entries build on one another; the journal shows how seeds change stage across eras.","proficient":"Most entries refer back to earlier ones.","developing":"Entries stand alone with little development.","beginning":"Entries are missing or repetitive."},{"criterion":"Questions and clarity","points":15,"exemplary":"Clear prose; closing questions are specific and push the inquiry forward.","proficient":"Clear prose; questions are relevant.","developing":"Some unclear writing; questions are generic.","beginning":"Hard to follow; no questions."}]},{"id":"timeline-project","title":"Timeline Annotation Project","weight":15,"prompt":"The timeline on this site is an argument, and every argument leaves things out. Find five events (a law, court case, market event, movement, corporate decision or cultural moment) that are not on the timeline but belong in the story of retirement. For each event, write an entry in the timeline's format: year, title, a factual description and a significance statement. Then argue which seed the event waters and whether it strengthens or complicates the book's thesis. At least two of your five events must concern people the system excluded or under-served, and for those entries name more than one variable at work (income, race, sex, education, job, place, immigration, longevity, generation) rather than assigning the result to a single cause.","deliverable":"Five entries (150–250 words each) plus a 500-word reflection on what the missing events reveal. Minimum one primary source per entry.","rubric":[{"criterion":"Accuracy and sourcing","points":30,"exemplary":"Every date and fact is correct and supported by a primary or authoritative source.","proficient":"Facts are correct with minor sourcing gaps.","developing":"One or two factual errors or weak sources.","beginning":"Multiple errors or unsourced claims."},{"criterion":"Selection and significance","points":25,"exemplary":"Events are genuinely consequential and their significance is argued, not asserted.","proficient":"Events are relevant and significance is explained.","developing":"Some events are marginal or significance is thin.","beginning":"Events are trivial or significance is missing."},{"criterion":"Seed analysis","points":25,"exemplary":"Each event is mapped to a seed with a persuasive mechanism; the student notes where the framework fits poorly.","proficient":"Each event is mapped to a plausible seed.","developing":"Seed mapping is vague or forced.","beginning":"No seed analysis."},{"criterion":"Reflection and inclusion","points":20,"exemplary":"The reflection draws a real insight about what the timeline leaves out; excluded groups are treated with specificity; names several variables at work in the excluded cases.","proficient":"Thoughtful reflection; excluded groups are addressed.","developing":"Reflection is general; inclusion requirement only partly met.","beginning":"Reflection missing or inclusion requirement unmet."}]},{"id":"participation","title":"Self-checks and discussion","weight":10,"prompt":"Complete each unit's self-check before the first class session on that unit, and come ready to use the discussion questions. Good discussion builds on classmates' points, brings evidence from the reading and the timeline, and is willing to disagree with the book.","deliverable":"Self-checks completed on time; regular, evidence-based contributions to discussion.","rubric":[{"criterion":"Preparation","points":40,"exemplary":"All self-checks completed before class; contributions show close reading.","proficient":"Nearly all self-checks completed; contributions show reading.","developing":"Several self-checks missed; preparation uneven.","beginning":"Rarely prepared."},{"criterion":"Use of evidence","points":35,"exemplary":"Regularly cites the chapter, timeline data or primary sources.","proficient":"Often refers to evidence.","developing":"Mostly opinion with occasional evidence.","beginning":"No evidence."},{"criterion":"Engagement with others","points":25,"exemplary":"Builds on and respectfully challenges classmates, including challenging the book.","proficient":"Responds to classmates.","developing":"Speaks without engaging others.","beginning":"Rarely participates."}]},{"id":"capstone-presentation","title":"Capstone presentation","weight":0,"prompt":"In Week 15, present your Correction proposal (the Unit 9 assignment) in 8 minutes, followed by 4 minutes of questions. Open with the community or family you designed for, show the evidence that defines their problem, walk through your proposal through the three principles, and name the hardest objection to it.","deliverable":"8-minute presentation with no more than 6 slides; graded as part of the capstone (one-quarter of the capstone grade).","rubric":[{"criterion":"Clarity of problem","points":25,"exemplary":"The audience understands exactly who the proposal serves and why, with data.","proficient":"Problem is clear.","developing":"Problem is general.","beginning":"Problem unclear."},{"criterion":"Proposal and principles","points":35,"exemplary":"Proposal is concrete and visibly organized around Not Poverty, Community and Generativity.","proficient":"Proposal is concrete and references the principles.","developing":"Proposal is vague or principles are named but not applied.","beginning":"No coherent proposal."},{"criterion":"Objections and evidence","points":25,"exemplary":"States the strongest objection fairly and answers it with evidence.","proficient":"Addresses an objection.","developing":"Objection is a straw man.","beginning":"No objections addressed."},{"criterion":"Delivery","points":15,"exemplary":"On time, well paced, handles questions with evidence.","proficient":"On time and clear.","developing":"Over time or hard to follow.","beginning":"Unprepared."}]}],"howToUse":["Start where we are. Each unit opens on the timeline: find its era, switch on the Seeds and Two-Person Lens layers, and click through the events before you read.","Read the chapter, which runs sideways in the unit view, or download it. The text is the author's working draft, so you are reading a book in progress.","Use the unit's study guide, events, inequities and primary sources panels.","Listen to the podcast and watch the lecture for the era when they are posted.","Take the self-check, then complete the assignment using its rubric as your checklist."],"integrity":"Cite every source you use, including AI tools, with the prompt you gave and how you used the output. Quoting the book or the course site requires a citation like any other source. The author's chapters are a draft shared for this course: please don't redistribute them outside the class.","inequity":{"title":"Engaging inequity","authorWords":"Male, white, highly educated, high income earning is the primary demographic of economic success. This is not the rule but a serious data point. In every case those not in this category have a different reality, but there are many examples of those that transcend. For me and this project it is a point to illustrate in order to work towards more equality of opportunity and not equality of outcome.","framing":["Inequity runs through every unit of this course, and it is not simple. The data are clear about the pattern: in the United States, being male, white, highly educated and high-earning is the primary demographic of economic success, and of a secure retirement. In the author’s words, this is not the rule but a serious data point. People outside that category have, on average, a different reality, and there are many examples of people who transcend it.","Some groups carry disadvantages that others do not, and the disadvantages do not add up on a single scale. A wealthy member of a minority group and a poor white worker do not face the same retirement; neither do a college-educated woman and a man who left school at sixteen. So this course never assigns progress, or its absence, to one variable. It asks you to hold several at once: income, race, sex, education, job, place, immigration, longevity and generation.","The purpose, for the author and for this project, is to illustrate the pattern in order to work toward equality of opportunity, not equality of outcome. You are not asked to agree with that aim. You are asked to argue with the evidence, in both directions."],"principles":[{"title":"More than one variable","text":"Every inequity on this site is tagged with the variables at work. When you analyze one, name at least two. The 1935 occupational exclusions were about race, and also about place (the rural South) and job (farm and household work)."},{"title":"Hold two true facts at once","text":"In 1935, about 65 percent of Black workers and 27 percent of white workers held jobs excluded from Social Security. Because white workers were the large majority, roughly three-quarters of the excluded workers were white. Both facts are true. An honest analysis needs both."},{"title":"Find the mechanism","text":"A gap is a measurement, not an explanation. Ask what rule, market or habit produced it: an occupational exclusion, an appraisal manual, a vesting cliff, a tax deduction worth more to a high earner than a low one."},{"title":"Averages describe groups, not people","text":"A median is a statement about a distribution. It predicts nothing about the person in front of you, and it does not erase the many who have done far better than their group’s average, or far worse."},{"title":"Rules change; effects linger","text":"Redlining was banned in 1968. The home equity it denied for a generation did not come back. Expect lags of decades between a rule and its full consequences, in both directions."},{"title":"Name the debate","text":"Scholars disagree about causes. The 1935 exclusions have been read as a racial bargain with Southern Democrats and as an administrative choice about collecting payroll taxes from farms and households. Present both readings and the evidence for each, then say which you find stronger."},{"title":"Evidence, not stereotype","text":"Cite the dataset, the year and the measure. “Women have less saved” is a stereotype; “the average retired-worker benefit for women was $1,780 a month in December 2024, against $2,181 for men (SSA)” is evidence a classmate can check."}],"variables":[{"id":"income","label":"Wealth & income","fact":"Among private-industry workers in the top tenth of wages, 94 percent had access to a retirement plan in March 2026 and 84 percent took part. Among part-time workers, 44 percent had access and 20 percent took part.","source":"Bureau of Labor Statistics, National Compensation Survey, March 2026.","where":"Collapse, Codify, Conclusion, Correction."},{"id":"race","label":"Race & ethnicity","fact":"Median family wealth in 2022: white families $285,000; Hispanic families $61,600; Black families $44,900. At the same time, conditional on their parents’ income, Black and white women earn about the same; the gap is driven by men’s employment and wages, and Hispanic Americans show relatively high upward mobility.","source":"Federal Reserve, Survey of Consumer Finances 2022; Chetty, Hendren, Jones & Porter, “Race and Economic Opportunity in the United States” (2018).","where":"Classical, Crucible, Climax, Codify, Collapse, Conclusion."},{"id":"gender","label":"Sex & gender","fact":"The average retired-worker benefit in December 2024 was $2,181 a month for men and $1,780 for women. Among people 65 and older, poverty is higher for women (10.5 percent) than men (7.4 percent), and highest for women over 80 (13.4 percent).","source":"Social Security Administration, Fast Facts & Figures 2025; KFF analysis of Census data, 2015–2017 averages.","where":"Classical, Conception, Crucible, Climax, Codify, Catastrophe."},{"id":"education","label":"Education","fact":"Median family net worth in 2022 by the education of the household head: no high-school diploma $38,100; high-school diploma $106,800; some college $136,500; college degree $464,600.","source":"Federal Reserve, Survey of Consumer Finances 2022.","where":"Climax (the GI Bill), Codify, Collapse."},{"id":"job","label":"Job","fact":"Private pension coverage peaked at about 38 percent of private-sector workers in 1979. Today a union worker is far more likely to have a plan than a nonunion one (91 versus 70 percent access), and a full-time worker than a part-time one (81 versus 44 percent).","source":"Employee Benefit Research Institute; Bureau of Labor Statistics, March 2026.","where":"Conception, Crucible, Climax, Codify, Collapse, Correction."},{"id":"place","label":"Place","fact":"In 1930 about two-thirds of American homes had electricity and about a quarter of rural homes did. Where you grow up still matters: Black boys who move earlier in childhood to low-poverty neighborhoods with little racial bias and many Black fathers present earn more as adults, but fewer than 5 percent of Black children grow up in such places.","source":"U.S. Census and the Rural Electrification Administration; Chetty et al. (2018).","where":"Classical, Conception, Crucible (redlining, the GI Bill)."},{"id":"immigration","label":"Immigration","fact":"Children of immigrants have climbed the income ladder faster than children of U.S.-born parents at the same income, for families from nearly every sending country, in the 1880–1910 cohorts and in modern data alike. Transcending the average is, for this group, the historical norm.","source":"Abramitzky, Boustan, Jácome & Pérez, “Intergenerational Mobility of Immigrants in the United States over Two Centuries,” American Economic Review (2021).","where":"Classical (Chinese Exclusion), Conception (immigrant workers)."},{"id":"longevity","label":"Longevity","fact":"At age 40, men in the top 1 percent of income could expect to live 14.6 years longer than men in the bottom 1 percent; for women the gap was 10.1 years. From 2001 to 2014 life expectancy rose 2.3 years for the richest 5 percent of men and 0.3 years for the poorest 5 percent.","source":"Chetty et al., “The Association Between Income and Life Expectancy in the United States, 2001–2014,” JAMA (2016).","where":"Collapse, Codify, Catastrophe, Correction."},{"id":"generation","label":"Generation","fact":"Median family net worth in 2022: under 35, $39,000; 65 to 74, $409,900; 75 and over, $335,600. Among people 65 and older, poverty rises with age, from 8.2 percent at 65–69 to 11.4 percent at 80 and over.","source":"Federal Reserve, Survey of Consumer Finances 2022; KFF, 2015–2017 averages.","where":"Collapse, Codify, Catastrophe."}],"questions":["The author’s aim is equality of opportunity, not equality of outcome. Define each in one sentence. Then take one inequity from any unit and say which kind it is. Could a reasonable classmate classify it the other way? What evidence would settle it?","Test the inequity funnel. Find one “Who was left out” entry where the author’s order (wealth, then gender, then ethnicity, then education) explains the outcome, and one where it does not. What would you add to the funnel, or reorder, and on what evidence?","Pick any “Who was left out” entry and list every variable at work. Which one does the entry lead with? Rewrite its first sentence leading with a different variable, and say what the new version reveals and what it hides.","In 1935 most Black workers were excluded from Social Security, and most excluded workers were white. Write the paragraph a historian of race would write about this and the paragraph a historian of labor would write. Where do they agree, and which paragraph would a farm worker’s daughter recognize?","Children of immigrants have climbed the income ladder faster than the children of the U.S.-born for more than a century, while the Black-white wealth gap has barely moved in decades. What does this pair of facts suggest about which mechanisms (law, housing, credit, schooling, family, place) matter most?","Describe someone, from history, the news or your own family, who transcended the average of their group. Name the specific opportunities that made it possible. Which of those were available to everyone in that group, and which were luck?","Redlining was banned in 1968, yet the wealth gap it helped create is measurable in 2022. Does a rule change count as a correction if its effects persist? Design one policy that would widen opportunity without dictating outcomes, and name who would object."],"funnel":{"title":"The inequity funnel","intro":"The author’s working theory of how the variables rank. He offers it as a hypothesis, not a finding: four levels, in order, with poverty waiting at the mouth of the funnel for anyone who falls through. Test it against the evidence in every unit.","levels":[{"n":1,"id":"income","name":"Wealth","his":"Wealth seems to transcend the others. It doesn’t completely eliminate bias, stereotype and the rest, but it is the one variable with a bit of transcendence.","evidence":"Conditional on their parents’ income, Black and white women earn about the same as adults: at the same starting point, that gap closes. Black men do not; raised at the same family income, they earn less than white men in 99 percent of U.S. neighborhoods (Chetty, Hendren, Jones & Porter, 2018). Wealth transcends, and does not erase."},{"n":2,"id":"gender","name":"Gender","his":"There is much debate in our times around this, but there is a legacy male/female bias that seems bigger than any culture or any social construct.","evidence":"Among people 65 and older, women are poorer than men inside every racial group: white women 8.0 percent against white men 5.6; Black women 20.4 against Black men 16.2; Hispanic women 19.7 against Hispanic men 14.1 (KFF, 2015–2017 averages). The average retired-worker benefit is $1,780 a month for women and $2,181 for men (SSA, December 2024)."},{"n":3,"id":"race","name":"Ethnicity","his":"Caucasian and Asian have a preference position compared to others, given the data I have surveyed.","evidence":"Median household income in 2023: Asian $112,800; white non-Hispanic $89,050; Hispanic $65,540; Black $56,490 (Census). Median family wealth in 2022: white $285,000; Hispanic $61,600; Black $44,900 (Survey of Consumer Finances). The exceptions are real: Hispanic Americans show relatively high upward mobility across generations, and the children of immigrants from nearly every country outclimb the children of the U.S.-born (Chetty et al.; Abramitzky, Boustan, Jácome & Pérez)."},{"n":4,"id":"education","name":"Education","his":"A highly educated minority is different than a low-educated Caucasian. It is a multi-variable calculus that cannot be reduced to one of these variables.","evidence":"Median family net worth in 2022 runs from $38,100 for households headed by someone without a high-school diploma to $464,600 with a college degree (SCF). Education does not cancel the levels above it: from 1992 to 2013 the median wealth of college-educated white families rose about 86 percent and of college-educated Asian families about 90 percent, while it fell about 56 percent for college-educated Black families and 27 percent for college-educated Hispanic families (Federal Reserve Bank of St. Louis, Emmons & Noeth, 2015)."}],"mouth":"Poverty is the most equal opportunity player in the world. It does not care about any of this, but there are contributing factors.","contributing":["job","place","immigration","longevity","generation"],"caveat":"A funnel ranks average effects; it is not a formula. The levels interact (a wealthy woman, a poor white man, a college-educated immigrant, a Black college graduate whose home lost half its value in 2008), which is why every “Who was left out” entry carries more than one tag. Students are asked to find one entry where the order holds and one where it breaks."}}},"links":[{"from":"classical-his-2","to":"seed-1","kind":"seed"},{"from":"classical-pol-3","to":"seed-2","kind":"seed"},{"from":"note-transition","to":"seed-3","kind":"seed"},{"from":"note-roaring","to":"seed-4","kind":"seed"},{"from":"note-roaring","to":"seed-5","kind":"seed"},{"from":"seed-4","to":"seed-6","kind":"seed"},{"from":"crucible-mar-0","to":"seed-7","kind":"seed"},{"from":"m-great-depression","to":"seed-7","kind":"seed"},{"from":"crucible-mar-0","to":"m-great-depression","kind":"arrow"},{"from":"seed-1","to":"crucible-pol-2","kind":"seed"},{"from":"seed-3","to":"crucible-pol-2","kind":"seed"},{"from":"seed-2","to":"crucible-pol-2","kind":"seed"},{"from":"note-stool","to":"seed-8","kind":"seed"},{"from":"climax-pol-8","to":"seed-9","kind":"seed"},{"from":"conception-his-3","to":"m-covid-19","kind":"echo"},{"from":"m-industrial-rev","to":"note-modernity","kind":"arrow"}],"threads":[{"id":"redlining","title":"Redlining: drawn, banned, still felt","color":"var(--t-crisis)","items":["m-fha-1934","m-fair-housing-1968","m-cra-1977"],"summary":"He underlined redlining in red three times: federal policy drew the lines in the 1930s, Congress banned them in 1968, and in 1977 required banks to lend inside them. The rules changed; the wealth gap they created kept compounding."},{"id":"access","title":"Money in your own name","color":"var(--t-money)","items":["m-equal-pay-1963","m-ecoa-1974","m-wboa-1988","m-fair-access-2021"],"summary":"Equal pay (1963), credit without a husband’s signature (1974), business loans without a male co-signer (1988), and the current fight over fair access to banking: each step widened who could build wealth in their own name."}],"master":{"legend":[{"key":"dates","label":"Dates","color":"var(--ink)"},{"key":"seeds","label":"Seeds","color":"var(--t-seed)"},{"key":"crashes","label":"Crashes","color":"var(--t-crisis)"},{"key":"money","label":"Money","color":"var(--t-money)"},{"key":"history","label":"History","color":"var(--t-history)"},{"key":"culture","label":"Culture","color":"var(--t-culture)"},{"key":"tech","label":"Technology","color":"var(--t-tech)"}],"quotes":["Retirement has been an idea that is years in the making.","Inception. An idea… the most resilient parasite.","You need the simplest version of the idea.","Perhaps… you will not want to see…","Elephants… You know the genesis… Get an idea deep enough."],"source":"Jonathan Grimm's hand-drawn master timeline (kraft paper, photographed October 2026)","photo":"master-timeline.jpg","thumb":"master-timeline-thumb.jpg","count":100}};</script>

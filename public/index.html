brary/publications/2020/demo/p25-1144.pdf"},{"label":"Detroit bankruptcy — overview","url":"https://en.wikipedia.org/wiki/Detroit_bankruptcy"},{"label":"CBS News — Detroit retirees approve pension cuts","url":"https://www.cbsnews.com/news/detroit-retirees-workers-overwhelmingly-ok-pension-cuts"},{"label":"CRS — Treasury denial of Central States MPRA application (2016)","url":"https://www.everycrsreport.com/files/20160518_IN10491_c198d9e75b09385c3f23fa7e55fc81ed9def8f17.html"},{"label":"PBGC — Central States SFA approval (2022)","url":"https://www.pbgc.gov/news/press/pr22-45"},{"label":"PBGC — American Rescue Plan Act SFA program","url":"https://www.pbgc.gov/arpa"},{"label":"CRS — PBGC: A Primer (Sept. 2026)","url":"https://www.everycrsreport.com/files/2026-09-02_95-118_13cb409298842e6b6c9452cb940520aff8ee9329.html"},{"label":"SECURE Act — overview","url":"https://en.wikipedia.org/wiki/SECURE_Act"},{"label":"JD Supra — SECURE 2.0 as enacted","url":"https://www.jdsupra.com/legalnews/secure-2-0-act-of-2022-as-enacted-5325428/"},{"label":"Social Security Fairness Act — overview","url":"https://en.wikipedia.org/wiki/Social_Security_Fairness_Act"},{"label":"SSA — 2025 press releases (WEP/GPO implementation)","url":"https://www.ssa.gov/news/press/releases/2025/"},{"label":"IRS — One, Big, Beautiful Bill provisions for individuals","url":"https://irs.gov/newsroom/one-big-beautiful-bill-provisions-individuals-and-workers"},{"label":"IRS — Publication on the enhanced senior deduction","url":"https://www.irs.gov/pub/irs-pdf/p6142.pdf"},{"label":"News On 6 — Trump signs ‘big beautiful bill’ into law","url":"https://newson6.com/story/6868292acb11631e7db31499/president-trump-signs-big-beautiful-bill-white-house"},{"label":"HealthCare.gov — Affordable Care Act","url":"https://www.healthcare.gov/glossary/affordable-care-act/"},{"label":"PBS NewsHour — S&P 500 erases pandemic losses","url":"https://www.pbs.org/newshour/economy/sp-500-closes-at-a-record-erasing-last-of-pandemic-losses"},{"label":"Morningstar — 15 Charts Explaining an Extreme Year (2022)","url":"https://www.morningstar.com/markets/15-charts-explaining-an-extreme-year-investors"},{"label":"Investing.com — S&P 500 close, April 8, 2025","url":"https://www.investing.com/news/economy-news/futures-rise-after-heavy-losses-on-hopes-of-talks-over-tariffs-3972893"},{"label":"ColoradoBiz — U.S. stocks hit record after tariff plunge","url":"https://coloradobiz.com/us-stocks-record-high-tariff-recovery/"},{"label":"Occupy Wall Street — overview","url":"https://en.wikipedia.org/wiki/Occupy_Wall_Street"},{"label":"Financial Samurai — Who started the FIRE movement?","url":"https://www.financialsamurai.com/?p=86249"},{"label":"The Tilt — Pete Adeney / Mr. Money Mustache","url":"https://www.thetilt.com/content-entrepreneur/peter-adeny-mr-money-mustache-blog"},{"label":"EBSCO — Uber (company)","url":"https://ebsco.com/research-starters/business-and-management/uber-company"},{"label":"Harvard — Chetty et al., Income and Life Expectancy (2016)","url":"https://hcp.hms.harvard.edu/publication/association-between-income-and-life-expectancy-united-states-2001-2014"},{"label":"AARP Foundation — Response to 2025 Census poverty data","url":"https://www.aarp.org/press/releases/2026-09-15-aarp-foundation-responds-to-new-census-data-on-rising-poverty-among-older-adults/"},{"label":"St. Louis Public Radio/NPR — Rising poverty among older adults","url":"https://stlpr.org/npr/2026-09-24/the-economic-squeeze-is-pushing-up-poverty-rates-for-older-adults"},{"label":"Census Bureau — Poverty in the United States: 2025","url":"https://www.census.gov/library/publications/2026/demo/p60-290.html"},{"label":"ACL — 2023 Profile of Older Americans","url":"https://acl.gov/sites/default/files/Profile%20of%20OA/ACL_ProfileOlderAmericans2023_508.pdf"},{"label":"GAO — More Older Adults Are Homeless (2025)","url":"https://www.gao.gov/blog/more-older-adults-are-homeless-what-can-be-done-help-vulnerable-population-unique-needs"},{"label":"Penn Today — Aging homeless population to nearly triple by 2030","url":"https://penntoday.upenn.edu/news/report-predicts-aging-homeless-population-will-nearly-triple-2030"},{"label":"PLANSPONSOR — Student debt not just a young person’s problem","url":"https://www.plansponsor.com/student-debt-not-just-a-young-persons-problem/"}],"chapter":{"title":"Collapse","years":"2010–2040","subtitle":null,"definition":"col·lapse (noun) the fall of something","epigraph":null,"status":"draft","words":2167,"minutes":9,"html":"<h2 id=\"ch-the-dream-that-isn-rsquo-t-yours\">The Dream That Isn&rsquo;t Yours</h2>\n<p>There is a moment that happens when I meet with clients that I have come to think of as the most important moment in financial planning.</p>\n<p>It doesn&rsquo;t happen when we review the numbers. It doesn&rsquo;t happen when we build the projection or stress-test the portfolio or calculate what Social Security will actually pay. It happens earlier than that. It happens when I ask a client what they want out of our time together and what financial goals they have.</p>\n<p>The goals are remarkably consistent. Almost scripted. Buy a home. Save for college. Retire.</p>\n<p>After all, these are the goals everyone from mainstream finance personalities to the professional class of advisor orients strategy, calculations and financial products around.</p>\n<p>These aren&rsquo;t bad goals. But they are, almost universally, unexamined ones. And so I started asking a second question that is quite different from my colleagues. Their follow up question might be how much in those accounts do you want or what is your risk tolerance? Mine is “who gave you that dream?”</p>\n<p>The meeting changes when you ask that.</p>\n<p>Most people pause in a way that&rsquo;s different from thinking. It&rsquo;s more like something shifting — a floor that seemed solid revealing it was floating. Some people laugh. Some get quiet. Almost no one has an immediate answer. And then, slowly, it comes: You&rsquo;re just supposed to. That&rsquo;s what you do. That&rsquo;s what everyone does.</p>\n<p>That&rsquo;s the moment. Right there. That’s the tiny “kick.”</p>\n<p>Because &ldquo;you&rsquo;re supposed to&rdquo; is not a financial plan. It is not a life philosophy. It is not even a preference. It is an inherited instruction from a social and economic system that was built for conditions that no longer exist, handed down through parents and employers and advertisements and well-meaning teachers until it arrived in your mind feeling indistinguishable from your own desire.</p>\n<p>This is what the film got right about the architecture of inception. The most powerful ideas are the ones that don&rsquo;t feel like ideas at all. They feel like facts. They feel like the shape of the world. The dreamer doesn&rsquo;t ask where the dream came from because the dreamer believes they are awake.</p>\n<p>Retirement is a dream of this kind.</p>\n<p>When you go that deep, something interesting happens. The dream often doesn&rsquo;t disappear. But it changes shape. The person who said &ldquo;I want to retire&rdquo; often turns out to want something more specific: I want to stop doing work that is hurting my body. Or: I want to spend more time with my grandchildren. Or: I want to stop answering to someone who doesn&rsquo;t respect me. Or: I want to do something that matters before I die.</p>\n<p>These are real wants. They are workable wants. And almost none of them actually require the financial architecture of &ldquo;retirement&rdquo; in the traditional sense because these point us in a more true direction. A more human aim. Something more connected to the natural order than the escape from it.</p>\n<h2 id=\"ch-every-generation-rsquo-s-sacred\">Every Generation&rsquo;s Sacred</h2>\n<p>Every generation inherits a version of what you&rsquo;re supposed to do. And every generation, eventually, has to decide whether the inheritance actually fits.</p>\n<p>Watch what this generation has done to the industries that previous generations treated as sacred. Chain restaurants built on the premise that reliability was the same as quality are emptying out. The casual dining industry — Applebee&rsquo;s, TGI Friday&rsquo;s, Ruby Tuesday — is in structural decline, not because people stopped eating but because a generation looked at the proposition and found it unconvincing. This wasn&rsquo;t theirs. It was their parents&rsquo; Friday night, their grandparents&rsquo; treat, a ritual that carried meaning for the people who built it and arrived as obligation to the people who inherited it.</p>\n<p>Each of these industries is a &ldquo;you&rsquo;re supposed to&rdquo; that one generation built with genuine meaning and handed to the next as obligation. And each of them is being quietly, undramatically refused.</p>\n<p>Retirement is the biggest sacred industry of all. The whole architecture — the 401(k), the magic number, the financial planning industry built around it, the cultural consensus that a good life ends in a particular kind of exit — was constructed by and for a generation that experienced it as liberation. They had worked. They had earned it. The dream was theirs.</p>\n<p>But they handed it to their children and grandchildren as the template for what a life should look like. And the children and grandchildren are looking at it the way they looked at the Applebee&rsquo;s — with the quiet, devastating recognition that this was never actually about them.</p>\n<p>When I ask who gave you that dream, they feel the question differently than their parents did. Their parents paused. These clients sometimes exhale — as if they&rsquo;ve been waiting for someone to ask.</p>\n<p>They already knew. They just hadn&rsquo;t been given permission to say it out loud.</p>\n<h2 id=\"ch-the-warning-that-didn-rsquo-t-warn-us\">The Warning That Didn&rsquo;t Warn Us</h2>\n<p>There&rsquo;s a particular kind of cruelty in watching a building fall slowly.</p>\n<p>Not the sudden violence of demolition — the kind where a charge fires and the whole structure drops cleanly into its own footprint in seconds. This is different. This is the kind of collapse where the cracks appear years before anyone says anything out loud. Where people keep walking in and out of the lobby. Where someone puts a fresh coat of paint on the entrance. Where the engineers write reports that get filed in drawers.</p>\n<p>That&rsquo;s where we are with retirement in America.</p>\n<p>We are not approaching the collapse. We are in it. The only question left is whether enough people will understand what&rsquo;s happening in time to get out — or whether we&rsquo;ll stand in the rubble in 2040, genuinely surprised.</p>\n<p>On September 15, 2008, Lehman Brothers filed for bankruptcy. It was the largest bankruptcy filing in American history. Within weeks, the global financial system had seized. The stock market lost 57% of its value from peak to trough. And somewhere in the confusion, $2.4 trillion in retirement savings simply disappeared.</p>\n<p>If there was ever a moment to stop and ask the fundamental question — does this system actually work? — that was it.</p>\n<p>We did not ask that question.</p>\n<p>What we did instead was heroic, in a narrow sense. The Federal Reserve dropped interest rates to near zero. The banking sector was stabilized. And over the next decade, the stock market not only recovered but reached all-time highs. By most measures, the recovery was remarkable.</p>\n<p>But here&rsquo;s what the recovery was not: a reckoning.</p>\n<p>The building got a fresh coat of paint. And the people walked back in.</p>\n<h2 id=\"ch-the-mathematics-that-predate-the-metaphor\">The Mathematics That Predate the Metaphor</h2>\n<p>Before we go further, we need to sit with the numbers. Not to be cruel. But because the collapse isn&rsquo;t a feeling or a premonition — it is a mathematical inevitability, and it has been one for some time.</p>\n<p>To retire at a poverty-level income of $20,000 per year — not a middle-class retirement, not a comfortable one, the federal poverty line — using the standard 4% withdrawal rule, a person needs $500,000 saved at retirement.</p>\n<p>The median retirement savings for Americans near retirement age is approximately $65,000.</p>\n<p>The gap between those two numbers — $500,000 and $65,000 — is not a gap you close with better budgeting or a seminar on compound interest. It is a canyon. And 95% of Americans earning under $150,000 annually are standing on the wrong side of it.</p>\n<p>This is not a recent discovery. The actuaries knew. The policy researchers knew. The Congressional Budget Office has published versions of this finding for decades. What changed after 2008 is not the data — it&rsquo;s that the data became impossible to avoid for ordinary families who had previously trusted the system to handle it.</p>\n<h2 id=\"ch-the-two-clocks\">The Two Clocks</h2>\n<p>In 2008, there were two Americans that I think about often.</p>\n<p>The first was 60 years old. She had done everything right. Thirty-five years of work, a 401(k) that had grown through the bull markets of the nineties and the recovery of the early 2000s. She had a number — not exactly the number she needed, but close enough that retirement at 65 felt real. Not a fantasy. A plan. Five years away, visible on the horizon. Then the market dropped 57%. Her number didn&rsquo;t just shrink. It collapsed. And with it, the plan. The horizon. The five years.</p>\n<p>She didn&rsquo;t lose her savings because she was reckless. She lost them because she was exactly where the system told her to be — fully invested, trusting the model, five years out — at the exact moment the model failed.</p>\n<p>She&rsquo;s still working. Not because she wants to. Because the math doesn&rsquo;t close.</p>\n<p>The second was 20 years old. He graduated into the worst job market since the Great Depression. Student debt was already reshaping what first jobs could reasonably offer. The wealth-building decade that prior generations used to establish the foundation of their financial lives? He lost it at the start. Not to bad choices. To timing.</p>\n<p>He is in his late 30s now. Still catching up. Still carrying debt. Still watching the retirement projections in his financial planning app tell him he needs to save more — more than his income allows, more than the system that failed him at launch can now deliver.</p>\n<p>These two people represent the full scope of 2008&rsquo;s damage. And here is what connects them across forty years of distance: neither of them was given the second question. Neither of them was ever asked who gave them the dream.</p>\n<h2 id=\"ch-why-2040-is-not-a-metaphor\">Why 2040 Is Not a Metaphor</h2>\n<p>The Social Security trust fund is currently projected to be depleted in the mid-2030s, at which point benefits would be reduced to approximately 75–80% of their scheduled amount absent congressional action. Ten thousand Boomers per day are still entering a system that was never adequately funded for this volume. The Millennial generation — the largest in American history — is entering its peak earning years already encumbered by student debt that delayed wealth accumulation by a decade or more. And Generation Z is being asked to fund their own retirement, their parents&rsquo; shortfalls, and a Social Security system under pressure, simultaneously.</p>\n<p>The word &ldquo;catastrophe&rdquo; is in the subtitle of this book. I use it deliberately. Not for drama. Because when you project the current trajectories forward — savings rates, Social Security solvency, healthcare inflation, housing costs, the dismantling of institutional pension systems, wage stagnation adjusted for real purchasing power — the outcome isn&rsquo;t a crisis waiting to happen. It is a crisis in progress, with consequences fully arriving around 2040.</p>\n<p>What does that look like? Tens of millions of Americans in their 70s and 80s with no savings, reduced Social Security, no family wealth to inherit, and healthcare costs that outpace any income source available to them. A caregiver crisis as that population requires support that families cannot provide and a healthcare system that cannot absorb. Political pressure of a magnitude we have not yet experienced, as the largest voting bloc in American history confronts poverty in their final decades and looks for someone to blame.</p>\n<p>This is not a prediction. This is a projection of what is already underway.</p>\n<h2 id=\"ch-the-kick\">The Kick</h2>\n<p>There is a moment in the film when the dreamer realizes that the architecture around them is impossible. The physics are wrong. The geometry doesn&rsquo;t hold. A building folds into itself. Water rises where it shouldn&rsquo;t. Something that was supposed to be solid turns out to be air.</p>\n<p>This is that moment.</p>\n<p>This book was designed to be a kick. Not a comfort. Not a reassurance. A sharp, disorienting jolt back to the surface — because the surface is where choices get made, and you cannot make real choices inside someone else&rsquo;s dream.</p>\n<p>If you are still reading, something has already shifted. The floor that seemed solid has revealed itself. The question — who gave you that dream? — has been asked, and it cannot be unasked. The numbers have been named. The history has been named. The collapse unfolding around us has been named.</p>\n<p>The 130-year retirement experiment is failing on schedule. Not because of bad luck, or insufficient effort, or a generation that didn&rsquo;t save hard enough. Because the experiment was built on a model that violated the natural order of how human beings actually work, contribute, age, and belong to each other. And models that violate natural order do not hold indefinitely. They hold until they don&rsquo;t.</p>\n<p>You are awake now.</p>\n<p>What happens next is not another chapter in the history of retirement. It is the beginning of something that was true long before 1890, long before Bismarck, long before anyone decided that human beings should work for forty years, accumulate assets, and then simply stop.</p>\n<p>Correction is not an innovation. It is a return. And it starts with the question that should have been asked at every kitchen table, in every financial planning office, in every policy hearing for the last seventy years.</p>\n<p>Not how do we make the model work?</p>\n<p>But what do we actually want our lives to look like?</p>","outline":[{"id":"the-dream-that-isn-rsquo-t-yours","text":"The Dream That Isn&rsquo;t Yours"},{"id":"every-generation-rsquo-s-sacred","text":"Every Generation&rsquo;s Sacred"},{"id":"the-warning-that-didn-rsquo-t-warn-us","text":"The Warning That Didn&rsquo;t Warn Us"},{"id":"the-mathematics-that-predate-the-metaphor","text":"The Mathematics That Predate the Metaphor"},{"id":"the-two-clocks","text":"The Two Clocks"},{"id":"why-2040-is-not-a-metaphor","text":"Why 2040 Is Not a Metaphor"},{"id":"the-kick","text":"The Kick"}]},"downloads":{"pdf":"downloads/06-collapse.pdf"},"unit":1,"role":"Where we are","chapterLabel":"Chapter 6 of the book","cultureEvents":[{"year":2010,"title":"Uber and the Gig Economy","detail":"Founded in 2009 as UberCab, Uber began service in San Francisco on July 5, 2010. By July 2023, the BLS counted 11.9 million independent contractors, 7.4% of total employment, workers who generally fall outside employer-sponsored retirement plans.","itemId":"collapse-his-0","type":"tech"}]},{"id":"conclusion","number":0,"title":"Conclusion","years":"Orientation","definition":"con·clu·sion (noun) the ending of something","tagline":"A history that begins at the end. Are you watching closely?","bigQuestion":"Who gave you the dream of retirement, and what would change if you knew where it came from?","overview":"Most history books start at the beginning. This one starts with its ending, the way Christopher Nolan’s Memento runs backward so the audience can understand how it ends. Grimm states his destination on the cover: catastrophe. His earlier book, The Future Poor, argued that about 9 in 10 Americans under 50 who earn less than $150,000 a year are on track to live at or below the poverty level in old age. This course asks how we got here. Retirement, which Grimm defines as leaving work at 65 and living off your money, is only about 130 years old.\n\nThe orientation hands you the tools for reading the book. The C’s mark its chapters, from Classical to Correction. The nine seeds are ideas planted at different moments that grew together into what we now call retirement. The conflation is the merging of a humanitarian question (how do we care for people as they age?) with a structural one (what systems do we build to do it?). Today the structural answer, in a nod to an early-2000s rock lyric, is: you.\n\nTwo Nolan films frame the book. In Inception, an idea planted in a dreamer’s mind feels like their own, and ‘the kick’ wakes them up; this book means to be the kick. From The Prestige comes the question that recurs through every chapter: Are you watching closely?","learningObjectives":["Explain the book’s reverse structure and how its framing devices work: the C’s, the seeds, Nolan’s films and the question ‘Are you watching closely?’","Distinguish the humanitarian question from the structural question, and explain what the book means by their ‘conflation.’","Identify the nine seeds by number and name, and give the era in which the book says each first appears.","State the Future Poor thesis precisely and identify the data that would be needed to test it.","Apply the Two-Person Lens to your own family by comparing how a 60-year-old and a 20-year-old face retirement in the same year."],"policyEvents":[{"year":1889,"title":"Germany’s old-age and disability insurance","type":"legislation","detail":"Under Otto von Bismarck, Germany adopted the world’s first national old-age social insurance program, with benefits starting at age 70. The age was lowered to 65 in 1916, after Bismarck’s death.","significance":"The book treats this as the start of the 130-year experiment and of Seed 2 (Government Involvement). the Conception unit examines it in depth.","itemId":null},{"year":1935,"title":"Social Security Act","type":"legislation","detail":"Approved August 14, 1935. It created federal grants for state old-age assistance and a federal old-age benefit program starting at 65. The old-age insurance program left out agricultural and domestic workers; coverage was extended to them in 1950 and 1954.","significance":"It fixed 65 as the national definition of old age (Seed 3). Its exclusions also became a case study for Seeds 1 and 7.","itemId":null},{"year":1974,"title":"Employee Retirement Income Security Act (ERISA)","type":"legislation","detail":"President Gerald Ford signed ERISA on September 2, 1974. It set minimum standards for private-sector pension plans and created the Pension Benefit Guaranty Corporation to insure the benefits of workers in failed, underfunded plans.","significance":"Federal law took on the job of backing The Promise (Seed 8) at about the moment the book’s 1950–1980 ‘anomaly’ was ending.","itemId":null},{"year":1978,"title":"Revenue Act adds Section 401(k)","type":"legislation","detail":"Enacted November 6, 1978, the Revenue Act added Section 401(k) to the Internal Revenue Code. The change let employees defer part of their pay into tax-advantaged accounts.","significance":"This was the legal basis for the Great Risk Transfer. The book dates Seed 9 (Individualism) to 1981 and the first 401(k) plans.","itemId":null},{"year":1983,"title":"Social Security Amendments of 1983","type":"legislation","detail":"President Reagan signed the amendments on April 20, 1983. Among other changes, they gradually raised the age for full benefits from 65 to 67. For anyone born in 1960 or later, full retirement age is 67, and claiming at 62 cuts benefits by 30 percent.","significance":"The age was raised, but the cultural expectation of 65 stayed where it was, which is the book’s ‘65 = Old and Done’ (Seed 3).","itemId":null},{"year":2026,"title":"2026 Trustees Report (projected depletion dates)","type":"policy","detail":"The 2026 Social Security Trustees Report projects that the retirement (OASI) trust fund reserves will run out in the fourth quarter of 2032. At that point incoming revenue would pay about 78 percent of scheduled benefits. Combined OASDI reserves are projected to run out in 2034, after which about 83 percent would be payable. These are projections, under the Trustees’ intermediate assumptions.","significance":"The book points to this kind of projection when it calls the catastrophe ‘a projection of what is already underway.’ Notice that the projection is of reduced benefits, not zero benefits.","itemId":"conclusion-pol-5"}],"marketDrops":[],"socialMovements":[],"inequities":[{"title":"Retirement plan access tracks pay","detail":"In March 2025, 48 percent of civilian workers in the lowest-paid quarter had access to a defined-contribution plan, and 22 percent participated. In the highest-paid quarter, 77 percent had access and 64 percent participated (BLS). Access to a defined-benefit pension ran from 8 percent to 43 percent across the same groups.","vars":["income","job"]},{"title":"The racial gap in retirement accounts","detail":"In the Federal Reserve’s 2022 Survey of Consumer Finances, 62 percent of White families had a retirement account, compared with 35 percent of Black families and 28 percent of Hispanic families. Median balances among account holders were $100,000, $39,000 and $55,600, respectively.","vars":["race"]},{"title":"The 1935 exclusions","detail":"Social Security’s original old-age insurance left out agricultural and domestic workers. An SSA analysis estimates that 65 percent of employed African Americans worked in those sectors, though 74 percent of the excluded workers were white. Its author attributes the exclusion to tax-collection feasibility rather than racial intent. Historians still debate that conclusion.","vars":["job","race","place"]}],"historicalContext":[],"seeds":[{"seed":1,"stage":"planted","detail":"Segregation & Boundaries: who deserves protection and who does not. The book says this seed is older than retirement itself, and it runs from poor laws and coverture to the 1935 exclusion of agricultural and domestic workers."},{"seed":2,"stage":"planted","detail":"Government Involvement: retirement as political management, beginning with Bismarck’s pension in 1889. The state wavers between protecting older people and abandoning them."},{"seed":3,"stage":"planted","detail":"65 = Old and Done: a number that became a cultural endpoint for identity. It has never been updated in people’s minds, even though longevity grew and the law moved full benefits to 67."},{"seed":4,"stage":"planted","detail":"Market Growth: the belief that stock markets reliably rise and can do the work of saving. The book places its first appearance in the Roaring Twenties, at 1924."},{"seed":5,"stage":"planted","detail":"Search for Leisure: retirement as an earned vacation. It first appears in the consumer economy of the 1920s and blooms after the war with Sun City (1960) and the ‘golden years.’"},{"seed":6,"stage":"planted","detail":"Get Rich Quick: speculation, speed and the hope of a big score. It runs from 1920s margin buying to the bull markets of the 1980s and 1990s, day trading and crypto."},{"seed":7,"stage":"planted","detail":"Two Americas: industrial, urban and unionized America on one side; agricultural, rural and domestic-work America on the other. The system was built for the first and leaves out the second."},{"seed":8,"stage":"planted","detail":"The Promise: the corporate pension bargain after 1946, ‘work here 30 years and we’ll take care of you.’ When it fails, people experience it as betrayal, a moral wound and not only a financial one."},{"seed":9,"stage":"planted","detail":"Individualism: from 1981, with the first 401(k) plans and the Reagan and Thatcher era, collective security gives way to personal responsibility. Systemic failure gets recast as personal failure: ‘The plan didn’t fail you. You failed the plan.’"}],"twoPersonLens":{"year":2026,"older":{"born":1966,"headline":"Trying to exit a system that keeps moving","text":"Born in 1966, they were twelve when Congress added Section 401(k) to the tax code and a teenager when the 1983 amendments quietly moved their full retirement age to 67. They grew up hearing about the 30-years-and-a-pension bargain many of their parents’ employers offered, and spent their career with a 401(k) instead. They were forty-two in the 2008 crash. Now, in 2026, they are sixty and can see the finish line. Full benefits arrive at 67, in 2033. That is about a year after the date the Trustees project the retirement trust fund to run out, when about 78 percent of scheduled benefits would be payable. They are still trying to exit a system that keeps moving the exit."},"younger":{"born":2006,"headline":"Never entered the system at all","text":"Born in 2006, they have no memory of a world before smartphones and none of the 2008 crash, which happened when they were two. They were barely a teenager when the pandemic shut down their schools. In 2026 they are twenty: maybe in a classroom, maybe in this course, maybe working jobs that do not offer a retirement plan. Among the lowest-paid quarter of workers, fewer than half have access to a defined-contribution plan and only about one in five participates. The traditional pension their grandparents knew is something they have only heard about. Their full retirement age is 67, in 2073. Nobody has asked them where their picture of the future came from."},"irony":"The sixty-year-old is trying to finish a dream that was handed to them; the twenty-year-old may be the first generation free to ask who handed it out."},"keyTerms":[{"term":"Retirement (as the book defines it)","definition":"Leaving work at 65 and living the remaining years off one’s money. Grimm argues this idea is only about 130 years old."},{"term":"The Conflation","definition":"The merging of two different questions. One is humanitarian: how do we care for people as they age? The other is structural: what systems do we build to do it? Today’s structural answer is ‘you.’"},{"term":"Seeds","definition":"Nine ideas, each planted in a particular era, that grew together into the modern idea of retirement. The book groups them as foundation, culture and mechanism seeds."},{"term":"The C’s","definition":"The alliterative device that names every chapter, from Conclusion and Classical through Correction. The book uses it to train readers to notice patterns once they have been pointed out."},{"term":"Inception","definition":"From Nolan’s 2010 film: planting an idea in someone’s mind so that it feels like their own. The book argues retirement is an idea of this kind."},{"term":"The Kick","definition":"In Inception, the jolt (like the feeling of falling) that wakes a dreamer. The book calls itself ‘the kick,’ and calls the client question ‘Who gave you that dream?’ a small one."},{"term":"Are you watching closely?","definition":"The book’s epigraph and recurring refrain, taken from The Prestige (2006). It asks readers to watch for the trick inside a familiar story."},{"term":"The Future Poor thesis","definition":"The claim from Grimm’s first book that about 9 in 10 people under 50 earning less than $150,000 a year (‘sub-50, sub-150’) are on track to live at or below poverty level in old age."},{"term":"Two-Person Lens","definition":"The course’s comparison device. At each turning-point year it pairs a 60-year-old leaving work with a 20-year-old entering it: the same moment, two realities."}],"keyFigures":[{"name":"Jonathan Grimm","role":"Financial ethicist, founder of Fernbridge Advisors and author of The Future Poor: How families and communities can survive the looming retirement crisis. This course is built on his book."},{"name":"Christopher Nolan","role":"Director of Memento (2000), The Prestige (2006) and Inception (2010). His nonlinear storytelling is the model for the book’s ending-first structure."},{"name":"Christopher Priest","role":"Author of the 1995 novel The Prestige, which Nolan adapted. He is another of the book’s C’s."},{"name":"Otto von Bismarck","role":"German chancellor whose 1889 old-age pension the book treats as the moment retirement was conceived. the Conception unit examines him closely."}],"primarySources":[{"title":"2026 OASDI Trustees Report: Conclusion","year":2026,"source":"Social Security Administration, Office of the Chief Actuary","url":"https://www.ssa.gov/oact/tr/2026/II_E_conclu.html","why":"Read the projected depletion dates and payable percentages yourself. Does ‘catastrophe’ describe what the Trustees project?"},{"title":"Retirement benefits: access, participation and take-up by wage, March 2025","year":2025,"source":"U.S. Bureau of Labor Statistics","url":"https://www.bls.gov/charts/employee-benefits/percent-access-participation-takeup-retirement-benefits-by-wage.htm","why":"Look for Seed 7 (Two Americas) in the gap between the lowest-paid and highest-paid quarters of workers."},{"title":"Age 65 Retirement","year":1935,"source":"SSA Historian’s Office","url":"https://www.ssa.gov/history/age65.html","why":"Find out how the United States actually chose 65, and test the common Bismarck story against it."},{"title":"Normal Retirement Age by year of birth","year":1983,"source":"SSA Office of the Chief Actuary","url":"https://www.ssa.gov/oact/progdata/nra.html","why":"Look up your own full retirement age and a parent’s or grandparent’s, then compare both with the age of 65 that people still assume."}],"discussionQuestions":["Before reading further, write your own definition of retirement. Where did each part of it come from: family, employers, media, school, finance apps?","The book opens by giving away its ending. In this course, what do you gain and what do you lose by knowing the destination (‘catastrophe’) before you see the evidence?","Restate the conflation in your own words. Can the humanitarian question (how do we care for people as they age?) be answered without also answering the structural one? Give an example.","Test the book’s framing. Social Security has sharply reduced poverty among older Americans, and the 2026 Trustees Report projects that about 83 percent of scheduled benefits would still be payable after 2034, not zero. Does ‘catastrophe’ fit the evidence, or does it overstate it? What would you need to know to decide?","The Future Poor thesis makes a specific prediction (about 9 in 10 ‘sub-50, sub-150’ Americans at or below poverty in old age). What data, definitions and assumptions would you need to verify or refute it?","Which of the nine seeds do you expect to matter most to your own generation? Write down your prediction now; you will revisit it at the end of the course."],"assignment":{"title":"Who Gave You That Dream?","type":"Two-Person Lens interview + seed hypothesis","prompt":"Interview someone at least 25 years older than you, ideally a parent, grandparent or mentor near 60, and then interview yourself with the same questions. Ask: What does retirement mean to you? When did you first picture it? Who or what gave you that picture? What would you want instead, if money were not the issue? Record and transcribe the key answers. Then write a reflective essay comparing the two ‘dreams’ through the Two-Person Lens. Close with a seed hypothesis: name the two or three seeds (by number and name) that you predict shaped each person’s dream most, and say what evidence from later modules would confirm or overturn your prediction. Keep the essay; you will revise the hypothesis in the final module.","deliverable":"900–1,200 word reflective essay, plus an appendix of interview notes or transcript excerpts (1–2 pages) and a one-paragraph seed hypothesis. Get the interviewee’s consent; use first names or pseudonyms only.","points":100,"rubric":[{"criterion":"Interview quality & evidence","points":25,"exemplary":"Asks all the core questions plus good follow-ups. Quotes and paraphrases are specific and revealing, and consent and privacy are handled properly.","proficient":"Covers the core questions with useful quotations.","developing":"Covers some questions; the answers are thin or mostly summarized.","beginning":"The interview is missing, superficial or undocumented."},{"criterion":"Two-Person Lens comparison","points":25,"exemplary":"Shows clearly how one moment looks different to two generations, with concrete details from each person’s life and era.","proficient":"Makes a clear comparison with some generational context.","developing":"Describes the two interviews side by side without much comparison.","beginning":"No meaningful comparison."},{"criterion":"Use of course frameworks","points":30,"exemplary":"Uses the conflation, the ‘Who gave you that dream?’ question and the nine seeds accurately and insightfully. The seed hypothesis is specific and can be tested.","proficient":"Uses the frameworks accurately; the hypothesis is reasonable but general.","developing":"Mentions the frameworks loosely or with minor errors; the hypothesis is vague.","beginning":"Frameworks are missing or misused, or there is no hypothesis."},{"criterion":"Reflection & writing","points":20,"exemplary":"Honest, thoughtful reflection on the student’s own assumptions, in clear and well-organized prose.","proficient":"Some genuine reflection; clear writing with minor issues.","developing":"Little reflection, or the writing gets in the way of the meaning.","beginning":"No reflection; disorganized."}]},"quiz":[{"q":"What two questions does the book say have been ‘conflated’?","options":["How to save and how to invest","How we care for people as they age, and what systems we build to do it","When to retire and where to live","Whether to claim Social Security early or late"],"answer":1,"explain":"The humanitarian question (caring for people as they age) has been merged with the structural question (the systems that do it). Today the structural answer is ‘you.’"},{"q":"According to the Future Poor thesis, about how many people under 50 earning under $150,000 are on track to live at or below poverty in old age?","options":["1 in 10","3 in 10","5 in 10","9 in 10"],"answer":3,"explain":"Grimm’s thesis in The Future Poor is that about 9 out of 10 ‘sub-50, sub-150’ Americans are on that track."},{"q":"In Inception, and in the book’s use of it, what is ‘the kick’?","options":["The idea planted in the dreamer’s mind","The jolt that wakes a dreamer from the dream","The architect who designs the dream","A financial penalty for early withdrawal"],"answer":1,"explain":"The kick, like the feeling of falling, wakes the dreamer. The book calls itself ‘the kick’ that wakes readers from the retirement dream."},{"q":"Which seed does the book say begins with Bismarck’s pension in 1889?","options":["Seed 2: Government Involvement","Seed 4: Market Growth","Seed 8: The Promise","Seed 9: Individualism"],"answer":0,"explain":"Government Involvement begins with Bismarck in 1889: retirement as political management, wavering between protection and abandonment."},{"q":"According to the 2026 Social Security Trustees Report, when are combined OASDI trust fund reserves projected to be depleted?","options":["2028","2034","2041","Never"],"answer":1,"explain":"The Trustees project combined reserves will run out in 2034, after which about 83 percent of scheduled benefits would be payable. The retirement (OASI) fund alone is projected to run out in late 2032."}],"sources":[{"label":"SSA — 2026 OASDI Trustees Report, Conclusion","url":"https://www.ssa.gov/oact/tr/2026/II_E_conclu.html"},{"label":"SSA press release — 2026 Trustees Report (June 9, 2026)","url":"https://www.ssa.gov/news/en/press/releases/2026-06-09.html"},{"label":"SSA Historian’s Office — Otto von Bismarck","url":"https://www.ssa.gov/history/ottob.html"},{"label":"SSA Historian’s Office — Age 65 Retirement","url":"https://www.ssa.gov/history/age65.html"},{"label":"SSA Historian’s Office — Social Security Act of 1935","url":"https://www.ssa.gov/history/35act.html"},{"label":"SSA — Normal Retirement Age by year of birth","url":"https://www.ssa.gov/oact/progdata/nra.html"},{"label":"SSA — Benefit reduction for early retirement","url":"https://www.ssa.gov/benefits/retirement/planner/agereduction.html"},{"label":"SSA Social Security Bulletin — 1983 Amendments: Legislative History and Summary","url":"https://www.ssa.gov/policy/docs/ssb/v46n7/v46n7p3.pdf"},{"label":"SSA Historian’s Office — 1980s timeline","url":"https://www.ssa.gov/history/1980.html"},{"label":"SSA Social Security Bulletin — DeWitt, The Decision to Exclude Agricultural and Domestic Workers","url":"https://www.ssa.gov/policy/docs/ssb/v70n4/v70n4p49.html"},{"label":"BLS — Retirement benefits by wage category, March 2025","url":"https://www.bls.gov/charts/employee-benefits/percent-access-participation-takeup-retirement-benefits-by-wage.htm"},{"label":"Pew Research Center — Stock and retirement account ownership by race (SCF 2022)","url":"https://www.pewresearch.org/short-reads/2024/03/06/a-booming-us-stock-market-doesnt-benefit-all-racial-and-ethnic-groups-equally/"},{"label":"Employee Retirement Income Security Act of 1974","url":"https://en.wikipedia.org/wiki/Employee_Retirement_Income_Security_Act_of_1974"},{"label":"401(k) — Revenue Act of 1978","url":"https://en.wikipedia.org/wiki/401(k)"},{"label":"Inception (2010 film)","url":"https://en.wikipedia.org/wiki/Inception"},{"label":"The Prestige (2006 film)","url":"https://en.wikipedia.org/wiki/The_Prestige_(film)"},{"label":"Wikiquote — The Prestige","url":"https://en.wikiquote.org/wiki/The_Prestige_(film)"}],"chapter":{"title":"Conclusion","years":"Orientation","subtitle":null,"definition":"con·clu·sion (noun) the ending of something","epigraph":{"quote":"Are you watching closely?","attribution":"Alfred Borden, The Prestige"},"status":"draft","words":2575,"minutes":11,"html":"<p>Most books don&rsquo;t begin with the ending - especially history ones. Most movies don&rsquo;t either. Yet, the great ones begin where you least expect only to untangle everything as the story unfolds.</p>\n<p>Are you intrigued?</p>\n<p>Are you watching closely?</p>\n<p>You cracked open a book with the title The Concise History of Retirement and are probably expecting a book that reads chronologically. After all, that is how we normally read history. Past to present. Then to now. What happened at a certain date and time.</p>\n<p>That makes perfect sense! I took a lot of history classes too! We know what to expect when we see a history text book. Events, people and places in a sequential order. 1492 to 1776 to 1941.</p>\n<p>There is so much that makes up &ldquo;history.&rdquo; There are major figures and regular people. There are key events and the ordinary. There are often two sides, winners and losers and &ldquo;History is written by the victors&rdquo; — often attributed to Winston Churchill and something we can probably intuit makes sense and leaves the history we have been told wanting.</p>\n<p>We grow up learning history as a series of facts. We learn about different empires over time. We learn about ancient civilizations. We learn about the technological advancements that sprang up. Cave paintings, the pyramids, the printing press, the steam engine, the light bulb. The tests we have to pass in school asks, &ldquo;what happened on what date.&rdquo; We fill in the bubble indicating the correct answer on our scantron paper&hellip; Oh no! I just aged myself and may have outed you. I am so sorry despite fond memories of a personal history that includes a beloved scantron and maybe an overhead projector.</p>\n<p>Yet, history is so much more than facts. It is consequential in that all that has happened before has influenced where we are today and where we are headed. And that brings us back to Churchill when he said in 1948, &ldquo;Those that fail to learn from history are doomed to repeat it.&rdquo;</p>\n<h2 id=\"ch-why-a-concise-history-of-retirement\">Why a Concise History of Retirement?</h2>\n<p>I am glad you asked and to answer that I will give you three concise answers. One is personal. One is practical. The final one is problematic.</p>\n<p>First the personal. No one asked me to write this book but I know you were demanding this type of work be done! This is the conclusion after all and you end this book by being so glad you picked it up. &ldquo;Life changing!&rdquo; you exclaim. For me, this began as part of my first book The Future Poor: How families and communities can survive the looming retirement crisis. I had a short chapter in there that was the seed of what you now hold. I felt I was at the start of seeing something important with the history of retirement. I had the scaffolding but that was about all. It was enough to make the points I needed for that book but I knew there was much more to do. The more I worked with clients and discussed the trajectory of retirement the more the history became illuminated. Echoes of the past were showing up everywhere from hundred year old rules, to tax laws of previous generations, to ideological shifts and financial products created half a century ago. Each of these threads was woven together into this thing we now call retirement. I wanted to understand it deeply and here at the end you do too!</p>\n<p>I mentioned the second reason for a concise history of retirement being my practical side. I like short books rather than massive treatments of things. History is a massive thing to unpack which is why each of the characters in our story about retirement have multiple biographies and each of the events mentioned here fill volumes of encyclopedias. I wanted to shrink that down and hit the high points and illustrate the arc of history that ends here with you and your moment in the story. It is important for you to see where you are now and step forward into what is next.</p>\n<p>This book is also concise because retirement as a thing, as an idea, as something people do is relatively new. The history of retirement is concise and so the book should be too! Most are surprised to realize we are only about 130 years in on this idea. That may seem like a long time for you and me but in the scope of human history, that is a blip. As something new in the course of human history, it needs to be understood.</p>\n<p>And now the problematic reason for this book and a call back to my first book. It&rsquo;s in the title and you&rsquo;ve already seen the end. Retirement, which I broadly define as exiting work at 65 and living your remaining years off your money, is a catastrophe. My original thesis of The Future Poor is that 9 out of 10 people under age 50 (sub-50) and making less than $150,000/year (sub-150) are going to be living at or below poverty level in their senior years. That has not changed. That is not good. That is a catastrophe. The rest of this book is why.</p>\n<p>Are you watching closely?</p>\n<p>When we understand the history and see the different seeds of ideas that gave us this catastrophic ending we can join with those that already see, undo the tangled knot and build something better. You get it and why you are passing this book along to everyone you know.</p>\n<h2 id=\"ch-your-advice-for-new-readers\">Your Advice for New Readers</h2>\n<p>Here at the end you have a better sense of how this book is to be read. Like we do when we tell a friend about a TV show, a movie or our favorite restaurant - we want to set them up for an enjoyable experience. Perhaps we offer some tips or insider information about things we have come to learn from experience. But we also know the truth of what C.S. Lewis said about expectations being everything. We can’t oversell the movie and create disappointment. We’ve all been told something is the best only to encounter it and walk away feeling “meh” about it. That is why we do the balancing act of informing and not giving away the plot.</p>\n<p>&ldquo;The parking is terrible so park around the corner. And get there early before it gets packed.&rdquo;</p>\n<p>&ldquo;Do you mind the sight of blood on screen? You do? Ok. Then you probably shouldn&rsquo;t watch The Pitt.&rdquo;</p>\n<p>&ldquo;You know it starts off slow but if you make it to episode 3 or past the first 10 minutes it really picks up pace.&rdquo;</p>\n<p>&ldquo;Make sure to ask what they are serving that is not on the menu.&rdquo;</p>\n<p>These are the things we naturally do and so here is what I imagine you are telling others about how to read this particular book and what to pay attention to. You love this book and cannot wait to share it with friends, family and co-workers but you want them to walk away with the same experience. I cannot blame you for that! So here is what you tell people as you pass this along.</p>\n<p>I ran into M. Night Shyamalan story. If you tell your friend Bruce Willis is dead the whole time in the Sixth Sense the movie doesn’t have the magic it is supposed to carry. In a way I have told you this fact but you aren’t familiar enough with the details for it to set in. Retirement is Dead and has been the whole time might be revealed but you haven’t seen the detail of it being cold and seeing your breath when Willis is around. But watching it over again you will see all the details you missed along the way.</p>\n<h2 id=\"ch-ldquo-c-rsquo-s-ldquo\">&ldquo;C&rsquo;s&ldquo;</h2>\n<p>As you read this book you will encounter a couple themes that run throughout. One is that there are a lot of &ldquo;C&rsquo;s.&rdquo; Just look at the table of contents! Each chapter starts with a &ldquo;C.&rdquo; They show up in various places. Because I told you this you will see them everywhere as you read. Alliteration is a powerful device and they show up throughout.</p>\n<p>The purpose of this book is to invite you in to paying attention. You will now see more “c’s” than I ever intended. It is subconscious - the way you notice the car you drive.</p>\n<h2 id=\"ch-ldquo-seeds-yes-seeeeds-emphasis-on-the-d-not-c-\">&ldquo;Seeds. Yes seeeeds. (emphasis on the D) Not C&rsquo;s&ldquo;</h2>\n<p>What you&rsquo;ll come to find out is retirement as we know it is a collection of ideas that began as seeds that grew together and grew into bigger ideas. It is not one single seed that gave rise to what we now think of as retirement — &ldquo;exit work at age 65 and live off your money.&rdquo; There is a lot of range in that simplistic definition but that is what most of us think that term means. Eventually, several seeds all grew into developed ideas that form the foundation for our current concept of retirement. Seeing them over time is really interesting.</p>\n<h2 id=\"ch-ldquo-conflation-rdquo\">&ldquo;Conflation&rdquo;</h2>\n<p>There you go — a &ldquo;C&rdquo; right off the bat. I told you. Throughout this book there is a lot of work done to untangle two ideas that have become conflated. Conflation is the merging of two ideas into one. Right here, I am going to give you some of the secrets to the remainder of what you are about to read.</p>\n<p>The first idea is the humanitarian one that asks how do we care for people as they age.</p>\n<p>The second is the structural one that asks what systems and structures do we put in place to make the first idea a reality.</p>\n<p>What we have today is a conflation of these two that requires us to turn to 2003 and the band Hoobastank … “and the reason is You.&rdquo;</p>\n<p>I truly am sorry for the reference and that this song will now be stuck in your head for a couple weeks.</p>\n<p>“I’m not a perfect person…”</p>\n<p>Alright, Stop!</p>\n<p>If you said in your mind “collaborate and listen” this book is for you. But unfortunately this is a problem Vanilla Ice can’t solve. If your mind is now playing late 90’s early 2000’s hits just let it. Enjoy the moment.</p>\n<p>Play “Closing Time” or “Higher” or go all in on our universal love of Nickelback and play “How you remind me” none of us want to admit it but when that song comes on….</p>\n<p>No matter what early 2000’s hit you gravitate to, and I respect them all, the reality remains - a lot has happened since then.</p>\n<h2 id=\"ch-ldquo-the-ending-rdquo\">&ldquo;The Ending&rdquo;</h2>\n<p>The ending is already revealed. And Linkin Park might have been wrong when they said “in the end it doesn’t even matter.”</p>\n<p>You tried so hard and you got so far.</p>\n<p>Maybe they were right.</p>\n<p>You do not even need to buy the previous book The Future Poor to know the ending. But you really should, that one is great too! The ending is Catastrophe. That is on the cover of this book!</p>\n<p>Are you watching closely?</p>\n<p>Keep that question in your mind at all times and it will help you see the reveal, to see the ending. I will reveal everything as we go.</p>\n<p>I just said it is in the title of this book where this leads to&hellip; Catastrophe.</p>\n<h2 id=\"ch-ldquo-christopher-rdquo\">&ldquo;Christopher&rdquo;</h2>\n<p>Yup — another &ldquo;C.&rdquo;</p>\n<p>One of the great things about this book are movie references as they are able to illustrate realities we encounter in our daily life in ways words fail. Narrative has always been the language to capture the deeper things of life. It used to be books and evolved into cinematic story telling. They also connect to popular culture and stories we all can resonate with. This is often more powerful than anything I could do with charts, graphs or logic. Story and narrative connect much deeper than basic prose cannot.</p>\n<p>So who is the greatest of these story tellers?</p>\n<p>George Lucas, of course. He gave us Star Wars — the original trilogy. The best mythological story and movies ever made.</p>\n<p>But that isn&rsquo;t Christopher.</p>\n<p>You are correct (another c) — I am talking about Christopher Nolan and the intrigue with his work since Memento. Memento was the first of Nolan&rsquo;s movies that didn&rsquo;t follow a traditional chronological approach. This movie runs backwards in order to understand the ending. Or the beginning. Or the ending. I don&rsquo;t know but I know it works.</p>\n<p>Then there is his movie Inception. Dreams within dreams that made people question reality in ways not felt since The Matrix. More about this later.</p>\n<p>But that was only the start. Does anyone understand Tenet? A movie that I think is running forward and backward at the same time?! Who knows?!</p>\n<p>This book pays homage to Nolan in my own way and began with the question, &ldquo;Are you watching closely?&rdquo;</p>\n<p>Some of us know that from Nolan&rsquo;s movie The Prestige which is actually an adaptation of a book by the same name written by another &ldquo;C&rdquo; — Christopher Priest. If you haven&rsquo;t seen it yet you need to check it out. But that question becomes a guiding question as you journey through this history and continues to sit in your mind as you see how the story unfolds.</p>\n<h2 id=\"ch-so-what-else-do-i-need-to-know-about-this-book\">So, What Else Do I Need to Know About This Book?</h2>\n<p>This is the question your friend has just asked you as you hand this copy over to them while discussing it over coffee. They asked as they took it, opened it up and casually flipped through the pages as if to get a glance at what wisdom might be contained within these pages the way we all do when handed a book.</p>\n<p>You start to respond in the normal way by saying, &ldquo;It starts in the time before&hellip;&rdquo; BUT you catch yourself mid-sentence. That type of retelling might not do this particular book justice. You pause for a second to think.</p>\n<p>&ldquo;Have you ever seen the movie Inception?&rdquo; you ask.</p>\n<p>&ldquo;Yeah, that&rsquo;s the weird one about dreams within dreams. Was that one by Christopher Nolan?&rdquo; They are able to jump right to Nolan and the references this book makes and because of what you just talked about — a little inception of your own and you know their mind is set up well for what you are about to share.</p>\n<p>&ldquo;That&rsquo;s the one!&rdquo;</p>\n<p>&ldquo;That was a crazy movie. Great cast.&rdquo;</p>\n<p>&ldquo;Oh man, yeah. Leo. Michael Caine.&rdquo;</p>\n<p>&ldquo;Wasn&rsquo;t Tom Hardy in that?&rdquo;</p>\n<p>&ldquo;He was. So was Cillian Murphy.&rdquo; You don&rsquo;t want to digress too much further into that great cast so you ask, &ldquo;You know that feeling of falling you get while dreaming?&rdquo;</p>\n<p>Your friend immediately responds, &ldquo;That is the worst! Your body flinches and you wake up like what in the world was that?!&rdquo;</p>\n<p>&ldquo;Why does it always feel so real?&rdquo; you reply in agreement. &ldquo;So, in the movie one of the things I remember most is that they use that feeling of falling to wake the dreamer from the dream.&rdquo;</p>\n<p>&ldquo;I remember that. Doesn&rsquo;t Leo fall into a bath tub? Am I remembering that right?&rdquo;</p>\n<p>&ldquo;Ha! At the beginning. The first dream we see. What they call it throughout the movie is &lsquo;The Kick&rsquo; — the feeling of falling that the body naturally and involuntarily responds to. Like when the body responds to the dream of falling. &lsquo;The Kick&rsquo; is the thing that wakes people from a dream&hellip;&rdquo;</p>\n<p>This book is &lsquo;The Kick.&rsquo;</p>","outline":[{"id":"why-a-concise-history-of-retirement","text":"Why a Concise History of Retirement?"},{"id":"your-advice-for-new-readers","text":"Your Advice for New Readers"},{"id":"ldquo-c-rsquo-s-ldquo","text":"&ldquo;C&rsquo;s&ldquo;"},{"id":"ldquo-seeds-yes-seeeeds-emphasis-on-the-d-not-c-","text":"&ldquo;Seeds. Yes seeeeds. (emphasis on the D) Not C&rsquo;s&ldquo;"},{"id":"ldquo-conflation-rdquo","text":"&ldquo;Conflation&rdquo;"},{"id":"ldquo-the-ending-rdquo","text":"&ldquo;The Ending&rdquo;"},{"id":"ldquo-christopher-rdquo","text":"&ldquo;Christopher&rdquo;"},{"id":"so-what-else-do-i-need-to-know-about-this-book","text":"So, What Else Do I Need to Know About This Book?"}]},"downloads":{"pdf":"downloads/00-conclusion.pdf"},"unit":2,"role":"How to read this story","chapterLabel":"The book's opening","cultureEvents":[]},{"id":"codify","number":5,"title":"Codify","years":"1980–2010","definition":"cod·i·fy (verb) the standardization of something","tagline":"The word stayed. The thing it described was quietly replaced.","bigQuestion":"When the anomaly ended, what did America standardize in its place—and who was handed the risk?","overview":"By 1980, the book argues, retirement had looked like it worked for thirty years, so America codified it. But what was standardized was not the pooled, guaranteed arrangement of the golden age. In 1981 the IRS issued rules that let workers save part of their pay before tax through Section 401(k), Congress opened IRAs to every worker, and a new political language—Ronald Reagan’s “government is the problem”—recast collective arrangements as dependence. In 1980 active participants in private defined-benefit plans outnumbered those in defined-contribution plans 30.1 million to 18.9 million; by 2010 the figures were 17.2 million and 73.4 million.\n\nGrimm calls this the Great Risk Transfer: investment, longevity, and inflation risk moved from institutions to individuals and was sold as freedom—control, portability, choice. An industry grew to manage the transfer; mutual-fund assets rose from about $135 billion in 1980 to $11.8 trillion in 2010. Meanwhile Social Security was repaired in 1983 by taxing some benefits and raising the full retirement age to 67.\n\nThree crashes—1987, 2000–02, and 2007–09—tested the new system on the people now carrying its risk. This is the era, the book says, when all nine seeds are in full bloom. Your job is to weigh the case against the 401(k) model alongside the evidence its defenders would offer.","learningObjectives":["Trace the legal and political steps—from Section 401(k) and ERTA through the 1983 Social Security amendments, the Roth IRA, and the Pension Protection Act—by which the defined-contribution model became the standard.","Analyze the Great Risk Transfer by identifying which risks (investment, longevity, inflation, behavioral) moved from employers to workers.","Evaluate distributional evidence on access to plans, account balances, and the tax benefits of retirement saving across income and racial groups.","Assess how the 1987, 2000–02, and 2007–09 market declines affected workers at different ages under a defined-contribution system.","Construct and critique arguments for and against the book’s claim that the 401(k) era replaced retirement with a counterfeit."],"policyEvents":[{"year":1980,"endYear":null,"title":"Bank deregulation (DIDMCA)","detail":"Signed March 31, 1980, the Depository Institutions Deregulation and Monetary Control Act began phasing out federal ceilings on the interest banks could pay depositors (Regulation Q).","significance":"Opened the competition for savers’ money that market-based retirement products would win.","decline":null,"type":"legislation","itemId":"m-didmca-1980","master":true,"hand":"1980 Bank deregulation DIDMCA"},{"year":1981,"title":"Economic Recovery Tax Act (ERTA)","type":"legislation","detail":"Signed by President Reagan on August 13, 1981, at his California ranch, ERTA cut marginal income-tax rates and opened IRAs to every worker, raising the annual limit to the lesser of $2,000 or 100 percent of earnings ($2,250 for a worker with a nonworking spouse). IRA participation rose quickly afterward.","significance":"Tax policy began treating every worker as an individual saver—Individualism (seed 9) written into the code in its arrival year.","itemId":"codify-pol-0"},{"year":1981,"title":"IRS issues 401(k) regulations","type":"policy","detail":"Section 401(k) had taken effect January 1, 1980, but employers hesitated until the IRS issued regulations on November 10, 1981, clarifying that employees could defer part of their salary before tax. Benefits consultant Ted Benna’s firm, the Johnson Companies, adopted an early plan in 1981, and many large employers’ plans began operating in January 1982.","significance":"The administrative date many call the 401(k)’s birthday; historians of the provision note it was not designed to replace pensions—which is exactly what the book says it came to do.","itemId":"codify-pol-1"},{"year":1983,"title":"Social Security Amendments of 1983","type":"legislation","detail":"Signed April 20, 1983, after the Greenspan Commission reported in January 1983 that the retirement trust fund could run out of money as early as August 1983, the law made up to half of benefits taxable above $25,000 (single) or $32,000 (joint) of income, delayed a COLA, covered new federal employees, and accelerated payroll-tax increases. It also raised the full retirement age in two stages from 65 to 67, beginning with people born in 1938 and fully phased in for those born in 1960 or later.","significance":"The first time Washington moved the retirement age—quietly loosening 65 = Old and Done (seed 3) by statute while the culture kept the number.","itemId":"codify-pol-2"},{"year":1984,"title":"Retirement Equity Act","type":"legislation","detail":"The law lowered the minimum age for pension-plan participation from 25 to 21, required a spouse’s written consent before a worker could waive survivor benefits, and stopped counting a one-year maternity or paternity leave as a break in service. The Older Women’s League advocated for it.","significance":"A rare repair to the one-earner “design specification,” acknowledging that women’s security had depended on husbands’ choices.","itemId":"codify-pol-3"},{"year":1986,"title":"Tax Reform Act of 1986","type":"legislation","detail":"TRA ’86 imposed a $7,000 annual cap on pre-tax 401(k) deferrals beginning in 1987, tightened nondiscrimination testing, required faster vesting, and limited deductible IRA contributions for workers covered by employer plans above income thresholds. The share of tax filers with wage income making deductible IRA contributions fell from 18.6 percent in 1985 to 4.2 percent by 1995.","significance":"Shows how sensitive individual saving is to tax design—and how quickly voluntary participation falls when incentives change.","itemId":"codify-pol-4"},{"year":1988,"endYear":null,"title":"Women’s Business Ownership Act","detail":"Signed October 25, 1988, the act ended the need for a husband or male relative to co-sign a woman’s business loan, and created the Women’s Business Center program and the National Women’s Business Council.","significance":"Business ownership is a path to wealth outside the paycheck-and-pension track.","decline":null,"type":"legislation","itemId":"m-wboa-1988","master":true,"hand":"Women can get business loan w/o male co-signer. Business Ownership Act."},{"year":1997,"title":"Taxpayer Relief Act: the Roth IRA","type":"legislation","detail":"Signed by President Clinton on August 5, 1997, the law created the Roth IRA, effective January 1, 1998: contributions are made after tax and qualified withdrawals are tax-free. It also raised income limits for deductible traditional IRAs and allowed penalty-free withdrawals for higher education and first-home purchases.","significance":"Another individual account, another tax choice for the saver to optimize—the system grew more complex as it grew more personal.","itemId":"codify-pol-5","master":true,"hand":"Roth IRA"},{"year":2001,"title":"Economic Growth and Tax Relief Reconciliation Act (EGTRRA)","type":"legislation","detail":"Signed June 7, 2001, EGTRRA raised the 401(k) deferral limit from $11,000 in 2002 to $15,000 in 2006, raised the IRA limit in steps to $5,000 by 2008, added “catch-up” contributions for savers 50 and older, authorized Roth 401(k) contributions beginning in 2006, and created a nonrefundable “saver’s credit” of up to $1,000 for lower-income contributors.","significance":"Higher limits mostly help those who can already save the maximum; the saver’s credit was a modest attempt to reach those who could not.","itemId":"codify-pol-6"},{"year":2003,"title":"Medicare Modernization Act: Part D","type":"legislation","detail":"Signed December 8, 2003, the law created a voluntary outpatient prescription-drug benefit, Medicare Part D, beginning January 1, 2006. Under the 2006 standard design, beneficiaries paid the full cost of drugs between $2,250 in total spending and $3,600 in out-of-pocket costs—the coverage gap known as the “doughnut hole.”","significance":"The health leg of the stool expanded, but through a market of private plans that retirees had to compare and choose among themselves.","itemId":"codify-pol-7"},{"year":2005,"title":"Bush’s personal-accounts proposal","type":"policy","detail":"After his 2004 reelection, President George W. Bush made voluntary personal retirement accounts within Social Security his top domestic priority, pressing the case in his 2005 State of the Union and on national tours. Public disapproval of his handling of Social Security rose from 48 to 64 percent by June, and by October Bush acknowledged the effort had failed.","significance":"The high-water mark of Individualism (seed 9): Social Security was the one leg of the stool the public refused to convert into an individual account.","itemId":"codify-pol-8"},{"year":2006,"title":"Pension Protection Act","type":"legislation","detail":"Signed August 17, 2006, the PPA made it easier for employers to enroll workers in 401(k) plans automatically and protected fiduciaries who invest non-directing participants in “qualified default investment alternatives,” such as target-date or balanced funds.","significance":"A tacit admission that the do-it-yourself model needed defaults to work: the system began quietly making choices for savers it had said were in control.","itemId":"codify-pol-9"}],"marketDrops":[{"year":1980,"endYear":1982,"name":"The Volcker-era bear market","decline":"−27.1% (S&P 500, Nov. 28, 1980 – Aug. 12, 1982)","detail":"As inflation peaked at 13.5 percent in 1980 and the Federal Reserve tightened to break it, stocks fell for nearly two years. The S&P 500 regained its prior high by November 1982, launching a long bull market.","retirementImpact":"The first 401(k) plans opened near a market bottom, so early participants experienced the model at its most flattering.","itemId":"codify-mar-0","type":"crisis"},{"year":1980,"endYear":2010,"title":"The mutual-fund boom","detail":"Mutual-fund assets grew from $134.8 billion across 564 funds in 1980 to $11.8 trillion across more than 7,500 funds in 2010. Defined-contribution plan assets grew from $162 billion to $3.8 trillion over the same span.","itemId":"codify-his-1","type":"money"},{"year":1987,"name":"Black Monday","decline":"−22.6% in one day (Dow, Oct. 19, 1987); −33.5% (S&P 500, Aug. 25 – Dec. 4, 1987)","detail":"The Dow fell 508 points, or 22.6 percent, on October 19, 1987—still its largest one-day percentage loss. The Fed promised liquidity the next morning, and stocks surpassed their pre-crash highs in less than two years.","retirementImpact":"A fast recovery reinforced the Market Growth seed (4): crashes looked like buying opportunities to anyone with decades left to wait.","itemId":"codify-mar-1","type":"crisis","master":true,"hand":"S+P500 ’82 $102 → ’87 $336: 3x ↑, then ↓ 30% drop. Black Monday."},{"year":1997,"endYear":null,"title":"The Asian financial crisis reaches Wall Street","detail":"Currency collapses that began in Thailand in July 1997 spread across East Asia. On October 27 the Dow fell 554 points, and market-wide circuit breakers halted U.S. trading for the first time.","significance":"A “mini panic” the long bull market quickly absorbed, teaching a generation of 401(k) savers that dips are buying opportunities.","decline":"−7.18% in one day (Dow, Oct. 27, 1997)","type":"crisis","itemId":"m-asia-1997","master":true,"hand":"’97 Asian $ crisis — mini panic"},{"year":1998,"endYear":null,"title":"Russia defaults; Long-Term Capital Management fails","detail":"In August 1998 Russia devalued the ruble and defaulted on its domestic debt. The losses helped topple the hedge fund Long-Term Capital Management, and the New York Fed organized a private rescue in September.","significance":"Another sharp scare that recovered within months, reinforcing faith in buying and holding.","decline":"about −19% (S&P 500, July 17 – Oct. 8, 1998)","type":"crisis","itemId":"m-russia-1998","master":true,"hand":"’98 Russian $ crisis"},{"year":1999,"endYear":null,"title":"The Dow closes above 10,000","detail":"On March 29, 1999, the Dow Jones Industrial Average closed above 10,000 for the first time.","significance":"A headline number that made the market feel like a reliable escalator.","decline":null,"type":"money","itemId":"m-dow10k-1999","master":true,"hand":"Dow over $10K"},{"year":2000,"endYear":2002,"name":"The dot-com crash","decline":"−49.1% (S&P 500, Mar. 24, 2000 – Oct. 9, 2002); Nasdaq −78%","detail":"The Nasdaq Composite peaked at 5,048.62 on March 10, 2000, and fell 78 percent by October 2002; the S&P 500 lost nearly half its value. The S&P did not fully recover until May 2007—months before the next crash began.","retirementImpact":"Workers in their 50s lost years of accumulation just as they entered their final saving decade, and Enron employees learned what concentration in employer stock could do.","itemId":"codify-mar-2","type":"crisis","master":true,"hand":"Dotcom Bubble. $5T ↓. S+P500 1400 ↓ 815."},{"year":2007,"endYear":2009,"name":"The Global Financial Crisis","decline":"−56.8% (S&P 500, Oct. 9, 2007 – Mar. 9, 2009)","detail":"The S&P 500 lost more than half its value in 17 months, and in October 2008 CBO Director Peter Orszag told Congress that American workers had lost more than $2 trillion in retirement savings over the previous 15 months. The index did not regain its 2007 closing high until March 2013.","retirementImpact":"The defining test of the Great Risk Transfer: the book’s “Two Clocks” portraits show a 60-year-old who did everything right losing her plan at exactly the wrong moment.","itemId":"codify-mar-3","type":"crisis","master":true,"hand":"Housing Bubble. S+P500 1500 ↓ 38.5% · 735."}],"socialMovements":[{"year":1980,"name":"Older Women’s League (OWL)","detail":"Founded by Tish Sommers and Laurie Shields after an October 1980 White House mini-conference on older women in Des Moines, OWL organized around the economic and retirement security of midlife and older women. It successfully advocated for the Retirement Equity Act of 1984.","significance":"Named the gap the one-earner design left for divorced, widowed, and caregiving women, and won a statutory repair.","itemId":"codify-soc-0","type":"movement"},{"year":1983,"endYear":1994,"name":"The “Notch Baby” campaign","detail":"From the early 1980s, people born in 1917–1921 organized against benefits that, after the 1977 amendments, were lower than those of people born just before them; more than 100 bills were introduced, but none became law. In December 1994 a congressionally created commission concluded that the benefits were equitable and that no remedy was warranted.","significance":"A grievance about formula design became a durable movement—proof of how personally Americans now experienced Social Security as a promise.","itemId":"codify-soc-1","type":"movement"},{"year":2005,"name":"The fight over personal accounts","detail":"Opposition to President Bush’s 2005 personal-accounts plan united congressional Democrats, divided Republicans, and grew as the president campaigned: Gallup found disapproval of his handling of Social Security rising from 48 to 64 percent between the State of the Union and June. The effort was abandoned by the fall.","significance":"Public resistance drew a line around Social Security as a pooled, guaranteed program even as private retirement became almost entirely individual.","itemId":"codify-soc-2","type":"movement"}],"inequities":[{"title":"Upside-down tax benefits","detail":"Because deductions are worth more at higher tax rates and higher earners contribute more, the top fifth of earners received about 70 percent of the tax benefits from new defined-contribution contributions and almost 60 percent of IRA tax benefits, according to a 2004 Urban–Brookings Tax Policy Center analysis. CBO estimates for 2019 found roughly 60 percent of the benefit went to the top fifth of households and about 1.5 percent to the bottom fifth.","vars":["income"]},{"title":"Access depends on your job","detail":"In 2007, 61.5 percent of workers in the top earnings quartile were offered a defined-contribution plan and 53.9 percent participated; in the bottom quartile, 29.7 percent were offered one and 17.0 percent participated. A system built on employer sponsorship replicates the Two Americas (seed 7).","vars":["job","income"]},{"title":"The median is not the model","detail":"In 2007, before the crash, 62.4 percent of households headed by someone aged 55–64 had any retirement account, and the median balance among those that did was $100,000—far short of what industry rules of thumb said a household needed. Nearly four in ten near-retirement households had no account at all.","vars":["income","generation"]},{"title":"The racial wealth gap after the crash","detail":"Pew Research found that median household net worth fell 16 percent for white households, 53 percent for Black households, and 66 percent for Hispanic households from 2005 to 2009. By 2009 the median white household held 20 times the wealth of the median Black household ($113,149 vs. $5,677) and 18 times that of the median Hispanic household.","vars":["race"]},{"title":"Longer lives, smaller balances","detail":"Individual accounts must be stretched over an individual lifespan, and in 1990 a woman reaching 65 could expect about 19.6 more years versus 15.3 for a man. Women who interrupted paid work for caregiving entered the DC era with fewer years of contributions, while needing their savings to last longer.","vars":["gender","longevity"]}],"historicalContext":[{"year":1981,"title":"Reagan, Thatcher, and the new individualism","detail":"Reagan’s first inaugural declared that “in this present crisis, government is not the solution to our problem; government is the problem.” In a 1987 interview with Woman’s Own, Margaret Thatcher said “there is no such thing as society”—a line she later complained was quoted without her point that people also owe duties to their neighbors.","itemId":"codify-his-0","type":"history","master":true,"hand":"Reagan + Thatcher"},{"year":1990,"endYear":1991,"title":"The Gulf War","detail":"Iraq invaded Kuwait on August 2, 1990. A U.S.-led coalition drove Iraqi forces out by the end of February 1991.","significance":"","decline":null,"type":"history","itemId":"m-gulf-war","master":true,"hand":"Gulf War"},{"year":1991,"endYear":null,"title":"The end of the Soviet Union","detail":"The Soviet Union dissolved on December 26, 1991, ending the Cold War.","significance":"Market capitalism without a rival, the backdrop for the 1990s’ faith in markets.","decline":null,"type":"history","itemId":"m-ussr-1991","master":true,"hand":"’91 End of Soviet Union"},{"year":1992,"endYear":null,"title":"The Los Angeles riots","detail":"The March 1991 police beating of Rodney King was caught on video. The acquittal of the officers in April 1992 set off days of unrest in Los Angeles.","significance":"","decline":null,"type":"history","itemId":"m-la-1992","master":true,"hand":"LA Riots · Rodney King"},{"year":1993,"endYear":null,"title":"The World Trade Center truck bombing","detail":"A truck bomb exploded beneath the North Tower of the World Trade Center on February 26, 1993, killing six people.","significance":"","decline":null,"type":"history","itemId":"m-wtc-1993","master":true,"hand":"Truck · World Trade"},{"year":1993,"endYear":null,"title":"The Waco siege","detail":"A 51-day standoff between federal agents and the Branch Davidians near Waco, Texas, ended in a fire on April 19, 1993.","significance":"","decline":null,"type":"history","itemId":"m-waco-1993","master":true,"hand":"Waco TX"},{"year":1993,"endYear":null,"title":"“Don’t Ask, Don’t Tell”","detail":"The 1993 policy barred openly gay, lesbian and bisexual people from military service while ending questioning about orientation. It was repealed in 2011.","significance":"","decline":null,"type":"history","itemId":"m-dadt-1993","master":true,"hand":"’93 Don’t Ask Don’t Tell"},{"year":1994,"title":"Contract with America","detail":"Released September 27, 1994, the House Republican platform included a “Senior Citizens Fairness Act” to raise the Social Security earnings limit, repeal the 1993 increase in the taxation of benefits, and create tax incentives for private long-term-care insurance.","itemId":"codify-his-2","type":"history"},{"year":1995,"endYear":null,"title":"The Oklahoma City bombing","detail":"A truck bomb destroyed the Alfred P. Murrah Federal Building in Oklahoma City on April 19, 1995, killing 168 people.","significance":"","decline":null,"type":"history","itemId":"m-okc-1995","master":true,"hand":"OKC bomb"},{"year":1998,"endYear":null,"title":"The Lewinsky scandal","detail":"The scandal broke in January 1998. The House impeached President Clinton that December, and the Senate acquitted him in February 1999.","significance":"","decline":null,"type":"history","itemId":"m-lewinsky-1998","master":true,"hand":"’98 Lewinsky"},{"year":1999,"endYear":null,"title":"Columbine","detail":"On April 20, 1999, two students killed 13 people at Columbine High School in Colorado.","significance":"","decline":null,"type":"history","itemId":"m-columbine-1999","master":true,"hand":"’99 Columbine"},{"year":2001,"title":"Enron’s collapse","detail":"At the end of 2000, 62 perc

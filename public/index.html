<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Story of Retirement</title>
<meta name="description" content="An interactive course on the history of retirement by Jonathan Grimm: timeline, chapters, nine seeds, podcasts, lectures and graded assignments.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Courier+Prime:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400..650;1,6..72,400..500&family=Permanent+Marker&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #F6F6F3;
  --surface: #FFFFFF;
  --surface-2: #F3F3F0;
  --ink: #14161B;
  --ink-2: #363B46;
  --muted: #5E6573;
  --line: #DEDFDB;
  --line-strong: #B3B6B1;
  --accent: #24468F;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE4F4;
  --kraft: #FCFCFA;
  --kraft-2: #F6F6F3;
  --kraft-ink: #1B1D22;
  --kraft-muted: rgba(27, 29, 34, .58);
  --kraft-line: rgba(27, 29, 34, .13);
  --band-alpha: .11;
  /* the legend on the author's hand-drawn master timeline: crashes red, money green, history blue, culture pink, technology orange, seeds brown */
  --t-legislation: #13805A;
  --t-policy: #6E7A1C;
  --t-crisis: #C3302F;
  --t-money: #2F9A4F;
  --t-movement: #9E5B08;
  --t-history: #2766B3;
  --t-context: #2766B3;
  --t-culture: #C83E86;
  --t-tech: #E07A1F;
  --t-seed: #7A4E2D;
  --t-sprout: #3F9A4E;
  --t-note: #4A3B2C;
  --t-lens: #0B6E78;
  --paper: #F1E6D2;
  --paper-ink: #3A2E21;
  --f-hand: "Permanent Marker", "Segoe Print", "Bradley Hand", cursive;
  --ok: #13805A;
  --bad: #C3302F;
  --era-classical: #9FE1CB;
  --era-conception: #B5D4F4;
  --era-crucible: #FAC775;
  --era-climax: #C0DD97;
  --era-codify: #CECBF6;
  --era-collapse: #F4C0D1;
  --era-catastrophe: #F7C1C1;
  --era-correction: #E7DFCB;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-read: "Newsreader", Georgia, "Times New Roman", serif;
  --f-type: "Courier Prime", "Courier New", ui-monospace, monospace;
  --f-ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 1px 2px rgba(20, 22, 27, .06), 0 8px 24px rgba(20, 22, 27, .06);
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; margin: 0; overflow: hidden; -webkit-font-smoothing: antialiased; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4, h5 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.type { font-family: var(--f-type); }
.eyebrow { font-family: var(--f-type); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg, .icon-btn svg { width: 16px; height: 16px; flex: none; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; }
.icon-btn:hover { border-color: var(--ink-2); }
.icon-btn[disabled] { opacity: .4; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-family: var(--f-ui); font-size: 12px; font-weight: 600; color: var(--surface); }

/* ---------- app frame */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px max(16px, 2vw); border-bottom: 1px solid var(--line); background: var(--bg); position: relative; z-index: 30; }
.brand { all: unset; cursor: pointer; font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.top-links { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.top-links::-webkit-scrollbar { display: none; }
.top-links button { border: 0; background: transparent; color: var(--ink-2); font-size: 14px; padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.top-links button:hover, .top-links button[aria-expanded="true"] { background: var(--surface-2); color: var(--ink); }
.top-links svg { width: 15px; height: 15px; }
@media (max-width: 640px) { .brand { font-size: 11px; letter-spacing: .02em; } .top-links button { padding: 6px 7px; font-size: 13px; } .hide-sm { display: none; } }
.layers-pop { position: absolute; right: max(16px, 2vw); top: calc(100% + 6px); z-index: 60; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; width: min(340px, calc(100vw - 32px)); display: grid; gap: 8px; }
.layers-pop label { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; padding: 4px 2px; }
.layers-pop .sw { width: 12px; height: 12px; border-radius: 50%; flex: none; }

/* ---------- the stage (horizontal) */
.stage { position: relative; min-height: 0; background: var(--kraft); color: var(--kraft-ink); }

.viewport { position: absolute; inset: 0; overflow-x: auto; overflow-y: auto; scrollbar-width: thin; cursor: grab; z-index: 1; overscroll-behavior-x: contain; }
.viewport.dragging { cursor: grabbing; user-select: none; }
.track { position: relative; display: flex; align-items: stretch; height: 100%; min-height: var(--canvas-h); }
.opening, .closing { flex: none; position: relative; padding: clamp(18px, 4vh, 44px) clamp(20px, 3vw, 48px); display: flex; flex-direction: column; justify-content: center; gap: 18px; cursor: auto; container-type: inline-size; min-width: 0; }
.opening > *, .closing > * { min-width: 0; max-width: 100%; }
.opening .title-card { font-size: clamp(24px, min(5vh, 12cqw), 54px) !important; }
.closing .title-card { font-size: clamp(28px, min(6.4vh, 10cqw), 80px) !important; }
.opening .eyebrow, .closing .eyebrow { color: var(--kraft-muted); }
.title-card { font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: clamp(40px, 7.2vh, 92px); line-height: .9; text-transform: uppercase; color: var(--kraft-ink); }
.title-card .thin { font-weight: 300; display: block; font-size: .42em; letter-spacing: .14em; margin-bottom: .25em; opacity: .7; }
.opening .sub { font-family: var(--f-read); font-style: italic; font-size: clamp(18px, 2.4vh, 24px); max-width: 30ch; }
.opening .lede { font-family: var(--f-read); font-size: 17px; line-height: 1.55; max-width: 46ch; }
.watching { font-family: var(--f-type); font-size: 14px; }
.watching::before { content: "▌"; color: var(--t-crisis); margin-right: 6px; animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.kcard { background: var(--surface); border: 1px solid var(--kraft-line); border-radius: 12px; padding: 16px 18px; color: var(--kraft-ink); }
.kcard.click { cursor: pointer; text-align: left; display: block; width: 100%; font: inherit; transition: transform .15s, border-color .15s; }
.kcard.click:hover { transform: translateY(-2px); border-color: var(--kraft-ink); }
.kcard .k-eyebrow { font-family: var(--f-type); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--kraft-muted); }
.kcard h3 { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 20px; text-transform: uppercase; margin: 4px 0 6px; }
.kcard p { font-family: var(--f-read); font-size: 16px; line-height: 1.45; }
.kcard .go { display: inline-flex; gap: 6px; align-items: center; margin-top: 10px; font-weight: 700; font-size: 14px; }
.kcard .go svg { width: 15px; height: 15px; }
.facts { display: flex; gap: 22px; flex-wrap: wrap; }
.facts div { display: grid; }
.facts b { font-family: var(--f-display); font-stretch: 125%; font-size: 28px; font-weight: 800; line-height: 1; }
.facts span { font-size: 12.5px; color: var(--kraft-muted); max-width: 16ch; }
.howto { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--kraft-muted); }
.howto span { display: inline-flex; gap: 6px; align-items: center; }
.howto kbd { font-family: var(--f-type); font-size: 12px; border: 1px solid var(--kraft-line); border-radius: 4px; padding: 0 5px; color: var(--kraft-ink); }
.closing-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.canvas { flex: none; position: relative; height: 100%; min-height: var(--canvas-h); }
.canvas > svg { position: absolute; left: 0; top: 0; display: block; overflow: visible; }
.axis-strip { position: sticky; bottom: 0; z-index: 3; background: linear-gradient(180deg, transparent, var(--kraft) 30%); }
.axis-strip svg { display: block; overflow: visible; }
.canvas text { font-family: var(--f-ui); }
.mk { cursor: pointer; }
.mk:focus { outline: none; }
.mk:focus-visible .halo, .mk.sel .halo { stroke: var(--kraft-ink); stroke-width: 2; }
.mk:hover .lab { text-decoration: underline; }
.era-box { position: absolute; top: 0; }
.era-sticky { position: sticky; left: var(--sticky-left, 14px); transition: left .25s; display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 16px 6px 2px; max-width: min(520px, 82vw); }
.era-meta { font-family: var(--f-type); font-size: 12px; color: var(--kraft-muted); display: flex; gap: 8px; align-items: center; }
.era-meta .chipdot { width: 10px; height: 10px; border-radius: 3px; }
.era-name { all: unset; cursor: pointer; font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: clamp(24px, 3.9vh, 40px); line-height: .95; text-transform: uppercase; color: var(--kraft-ink); }
.era-name:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.era-name:focus-visible { outline: 2px solid var(--kraft-ink); outline-offset: 3px; }
.era-tag { font-family: var(--f-read); font-style: italic; font-size: 15px; line-height: 1.25; max-width: 44ch; }
.era-open { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; margin-top: 4px; border-bottom: 1.5px solid currentColor; }
.era-open svg { width: 14px; height: 14px; }
.era-open:focus-visible { outline: 2px solid var(--kraft-ink); outline-offset: 3px; }
.today-tag { position: absolute; top: 10px; transform: translateX(8px); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; font-family: var(--f-type); font-size: 11.5px; font-weight: 700; }
.today-tag button { all: unset; cursor: pointer; font-family: var(--f-ui); font-size: 12.5px; font-weight: 700; border-bottom: 1.5px solid currentColor; }
.rail { position: absolute; left: 0; top: 0; bottom: 0; width: 92px; pointer-events: none; z-index: 2; transition: opacity .2s; }
.rail div { position: absolute; left: 0; width: 92px; padding: 4px 8px; font-family: var(--f-type); font-size: 10.5px; line-height: 1.15; letter-spacing: .05em; text-transform: uppercase; color: var(--kraft-muted); background: linear-gradient(90deg, var(--kraft) 70%, transparent); }
.scroll-hint { position: absolute; right: 18px; bottom: 14px; z-index: 3; font-family: var(--f-type); font-size: 12px; color: var(--kraft-muted); display: flex; align-items: center; gap: 6px; pointer-events: none; animation: nudge 1.8s ease-in-out infinite; }
.scroll-hint svg { width: 16px; height: 16px; }
@keyframes nudge { 50% { transform: translateX(6px); } }

/* ---------- minimap */
.minimap { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px max(16px, 2vw); border-top: 1px solid var(--line); background: var(--bg); }
.where { display: flex; align-items: center; gap: 8px; min-width: 0; width: 210px; }
.where .chipdot { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.where b { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 13px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.where span { font-family: var(--f-type); font-size: 12px; color: var(--muted); white-space: nowrap; }
.mapbar { position: relative; height: 30px; border-radius: 6px; overflow: hidden; display: flex; cursor: pointer; border: 1px solid var(--line); touch-action: none; }
.mapbar .seg { height: 100%; position: relative; border-right: 1px solid color-mix(in srgb, var(--bg) 70%, transparent); display: grid; place-items: center; overflow: hidden; }
.mapbar .seg span { font-family: var(--f-display); font-stretch: 100%; font-weight: 800; font-size: 10px; text-transform: uppercase; color: #2a2a2a; white-space: nowrap; letter-spacing: .01em; }
.mapbar .win { position: absolute; top: 0; bottom: 0; border: 2px solid var(--ink); border-radius: 5px; background: color-mix(in srgb, var(--ink) 10%, transparent); pointer-events: none; }
.mapnav { display: flex; gap: 6px; }
@media (max-width: 760px) { .where { width: auto; } .where span, .mapbar .seg span { display: none; } .minimap { grid-template-columns: minmax(0, auto) minmax(0, 1fr) auto; } }

/* ---------- event drawer */
.drawer { position: absolute; top: 12px; right: 12px; bottom: 12px; width: min(440px, calc(100% - 24px)); z-index: 20; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; animation: slidein .2s ease-out; }
@keyframes slidein { from { transform: translateX(24px); opacity: 0; } }
.drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.drawer-head .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: var(--f-type); font-size: 12px; color: var(--muted); }
.drawer-body { overflow-y: auto; padding: 16px 18px; display: grid; gap: 12px; align-content: start; }
.drawer-body h3 { font-family: var(--f-display); font-stretch: 110%; font-weight: 800; font-size: 23px; line-height: 1.1; }
.drawer-body .txt { font-family: var(--f-read); font-size: 17.5px; line-height: 1.55; }
.drawer-body .why { border-left: 3px solid var(--line-strong); padding-left: 12px; font-size: 15px; color: var(--ink-2); }
.drawer-body .why b { display: block; font-family: var(--f-type); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.decline { font-family: var(--f-display); font-stretch: 110%; font-weight: 800; color: var(--t-crisis); font-size: 19px; }
.drawer-foot { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.drawer .lens-mini { display: grid; gap: 14px; }
.drawer .lens-mini .who { font-family: var(--f-type); font-size: 12px; color: var(--muted); }
.drawer .lens-mini h4 { font-size: 16px; margin: 2px 0 4px; }
.drawer .lens-mini p { font-family: var(--f-read); font-size: 16px; line-height: 1.5; }
.irony { font-family: var(--f-read); font-style: italic; font-size: 17px; border-left: 3px solid var(--t-lens); padding-left: 12px; }
@media (max-width: 640px) { .drawer { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: min(72%, 560px); animation-name: slideup; } }
@keyframes slideup { from { transform: translateY(24px); opacity: 0; } }

/* ---------- sheets (click-in views, also horizontal) */
.sheet { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; grid-template-rows: auto auto minmax(0, 1fr); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.sheet-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px max(16px, 2vw) 8px; border-top: 6px solid var(--band, var(--ink)); }
.sheet-head .t { min-width: 0; }
.sheet-head .t .eyebrow { font-size: 11.5px; }
.sheet-head h2 { font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: clamp(22px, 3.4vh, 34px); line-height: 1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-head .nav2 { display: flex; gap: 6px; align-items: center; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 0 max(16px, 2vw); border-bottom: 1px solid var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: transparent; padding: 9px 12px 10px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs button:hover { color: var(--ink); }
.strip { display: flex; gap: 18px; overflow-x: auto; overflow-y: hidden; height: 100%; padding: 18px max(16px, 2vw) 20px; scroll-padding-inline: max(16px, 2vw); scroll-snap-type: x proximity; scrollbar-width: thin; overscroll-behavior-x: contain; }
.strip::after { content: ""; flex: none; width: 1px; }
.panel { flex: none; width: min(var(--w, 560px), calc(100vw - 40px)); height: 100%; overflow-y: auto; scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.panel > * { flex-shrink: 0; }
.panel.bare { background: transparent; border: 0; padding: 4px 4px; }
.panel h3 { font-family: var(--f-type); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.panel h3 .sq { width: 10px; height: 10px; border-radius: 3px; }
.panel .big { font-family: var(--f-read); font-size: 18px; line-height: 1.6; }
.panel .big p + p { margin-top: .8em; }
.panel .lead { font-family: var(--f-read); font-style: italic; font-size: clamp(20px, 2.6vh, 26px); line-height: 1.3; color: var(--ink-2); }
.bigq { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 0; }
.bigq .q { font-family: var(--f-read); font-size: 21px; line-height: 1.35; }
.def { font-family: var(--f-type); font-size: 13px; color: var(--muted); }
.objs { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.objs li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; }
.objs li::before { content: "□"; font-family: var(--f-type); color: var(--muted); }
dl.terms { margin: 0; display: grid; gap: 12px; }
dl.terms dt { font-weight: 700; }
dl.terms dd { margin: 2px 0 0; color: var(--ink-2); font-size: 14.5px; }
ol.qs { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; font-family: var(--f-read); font-size: 17px; line-height: 1.45; }
.sources-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.sources-list .why { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.sources-list .yr { font-family: var(--f-type); font-size: 12px; color: var(--muted); }
.evlist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.evlist li { padding: 12px 0; border-top: 1px solid var(--line); }
.evlist li:first-child { border-top: 0; padding-top: 0; }
.evlist button.t { all: unset; cursor: pointer; font-weight: 700; display: block; }
.evlist button.t:hover { text-decoration: underline; }
.evlist button.t:focus-visible { outline: 2px solid var(--accent); }
.evlist .yr { font-family: var(--f-type); font-size: 13px; color: var(--muted); }
.evlist .d { color: var(--ink-2); margin-top: 3px; font-size: 14.5px; }
.evlist .s { margin-top: 6px; font-size: 14px; color: var(--muted); }
.evlist .s b { color: var(--ink-2); }
.stage-lbl { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-type); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.seedrow { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.seedrow:first-child { border-top: 0; padding-top: 0; }
.seednum { font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: 26px; color: var(--t-seed); line-height: 1; }
.lens-card { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.lens-card > div { padding: 16px 18px; }
.lens-card > div + div { border-top: 1px solid var(--line); }
.lens-card .age { font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: 36px; line-height: 1; }
.lens-card .born { font-family: var(--f-type); font-size: 12px; color: var(--muted); margin-top: 3px; }
.lens-card h5 { font-size: 16px; margin: 10px 0 5px; }
.lens-card p { font-family: var(--f-read); font-size: 16.5px; line-height: 1.55; }
.lens-card .foot { background: var(--surface-2); font-family: var(--f-read); font-style: italic; font-size: 17.5px; }
.lens-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.lens-pair > div + div { border-left: 1px solid var(--line); }
@media (max-width: 760px) { .lens-pair { grid-template-columns: 1fr; } .lens-pair > div + div { border-left: 0; border-top: 1px solid var(--line); } }

/* chapter reading: text flows into columns that run sideways */
.panel.chapter { width: auto; max-width: none; overflow: hidden; padding: 22px 26px; }
.chapter-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-family: var(--f-type); font-size: 12.5px; color: var(--muted); }
.cols { column-width: var(--colw, 31em); column-gap: 52px; column-fill: auto; column-rule: 1px solid var(--line); font-family: var(--f-read); font-size: 18.5px; line-height: 1.6; color: var(--ink); }
.cols p { margin: 0 0 .9em; orphans: 3; widows: 3; }
.cols h2 { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 19px; text-transform: uppercase; letter-spacing: .02em; margin: 1.4em 0 .6em; line-height: 1.15; break-after: avoid; }
.cols blockquote { margin: 1em 0; padding-left: 16px; border-left: 3px solid var(--line-strong); color: var(--ink-2); font-style: italic; }
.cols .epigraph { font-style: italic; font-size: 20px; line-height: 1.45; color: var(--ink-2); margin: 0 0 1.4em; break-inside: avoid; }
.cols .epigraph cite { display: block; font-style: normal; font-family: var(--f-type); font-size: 13px; color: var(--muted); margin-top: 8px; }
.cols .forthcoming { font-family: var(--f-ui); font-size: 15px; border-left: 4px solid var(--era-catastrophe); padding: 4px 0 4px 12px; margin-bottom: 1.2em; break-inside: avoid; }
.cols .end { font-family: var(--f-type); font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 1.2em; break-inside: avoid; }

/* rubric */
.rubric-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.rubric { width: 100%; border-collapse: collapse; min-width: 760px; font-size: 14px; }
table.rubric th, table.rubric td { text-align: left; vertical-align: top; padding: 11px 13px; border-top: 1px solid var(--line); }
table.rubric thead th { border-top: 0; font-family: var(--f-type); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
table.rubric tbody th { width: 18%; font-weight: 700; }
table.rubric .p { font-family: var(--f-type); white-space: nowrap; color: var(--ink-2); }
table.rubric tfoot td { font-weight: 700; background: var(--surface-2); }
.pts { font-family: var(--f-type); font-size: 13.5px; color: var(--muted); }

/* quiz */
.qcard { border-top: 1px solid var(--line); padding-top: 14px; }
.qcard:first-of-type { border-top: 0; padding-top: 0; }
.qcard .q { font-family: var(--f-read); font-size: 18px; margin-bottom: 10px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 9px 12px; cursor: pointer; font-size: 15px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; }
.opt:hover:not([disabled]) { border-color: var(--line-strong); }
.opt .k { font-family: var(--f-type); color: var(--muted); }
.opt.right { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
.opt.wrong { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.opt[disabled] { cursor: default; }
.explain { margin-top: 10px; font-size: 14.5px; color: var(--ink-2); }
.explain b.ok { color: var(--ok); }
.explain b.bad { color: var(--bad); }

/* seeds */
.garden-wrap { overflow: auto; }
table.garden { border-collapse: collapse; width: 100%; min-width: 900px; }
table.garden th, table.garden td { padding: 0; border-top: 1px solid var(--line); }
table.garden thead th { border-top: 0; padding: 8px 3px; font-family: var(--f-display); font-stretch: 92%; font-size: 11px; letter-spacing: 0; text-transform: uppercase; font-weight: 800; text-align: center; }
table.garden thead th .y { display: block; font-family: var(--f-type); font-weight: 400; font-size: 10.5px; color: var(--muted); text-transform: none; }
table.garden tbody th { text-align: left; padding: 8px 12px 8px 0; font-weight: 700; font-size: 14px; white-space: nowrap; }
table.garden tbody th .g { display: block; font-family: var(--f-type); font-weight: 400; font-size: 11px; color: var(--muted); }
.gcell { width: 100%; min-height: 46px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; padding: 6px 4px; }
.gcell:hover { background: var(--surface-2); }
.gcell.sel { background: var(--accent-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.seed-panel .short { font-weight: 700; font-size: 16px; }
.seed-panel p.root { font-family: var(--f-read); font-size: 17px; line-height: 1.55; color: var(--ink-2); }
.seed-trail { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.seed-trail li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; color: var(--ink-2); }
.seed-trail b { color: var(--ink); }

/* course */
.weights { display: flex; height: 16px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.weights span { display: block; height: 100%; }
.wlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.wlist li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
.wlist .sw { width: 12px; height: 12px; border-radius: 3px; transform: translateY(1px); }
.wlist .w { font-family: var(--f-type); font-weight: 700; }
.wlist .dd { grid-column: 2 / 3; font-size: 14px; color: var(--muted); }
table.sched { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.sched td, table.sched th { padding: 8px 8px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
table.sched th { font-family: var(--f-type); font-size: 12px; font-weight: 400; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-top: 0; }
table.sched td:first-child { font-family: var(--f-type); white-space: nowrap; }
table.sched button { all: unset; cursor: pointer; font-weight: 700; color: var(--accent); }
table.sched button:focus-visible { outline: 2px solid var(--accent); }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scale div { background: var(--surface-2); border-radius: 6px; padding: 5px 7px; font-family: var(--f-type); font-size: 12.5px; display: flex; justify-content: space-between; gap: 4px; }
.scale b { font-family: var(--f-ui); }

/* media */
.media-item { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.media-item:first-of-type { border-top: 0; padding-top: 0; }
.media-item .kind { font-family: var(--f-type); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.media-item h5 { font-size: 17px; }
.media-item audio, .media-item video { width: 100%; border-radius: 8px; }
.media-item .embed { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
.media-item .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.slot { border: 1.5px dashed var(--line-strong); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
.slot b { color: var(--ink); font-size: 16px; }
.form { display: grid; gap: 12px; }
.form label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.form input, .form select, .form textarea { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 9px 11px; font-size: 15px; width: 100%; }
.form textarea { min-height: 64px; resize: vertical; }
.radios { display: flex; gap: 14px; flex-wrap: wrap; }
.radios label { display: inline-flex; flex-direction: row; gap: 6px; align-items: center; font-weight: 500; }
.radios input { width: auto; }
.notice { font-size: 14px; padding: 9px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.notice.err { border-color: var(--bad); color: var(--bad); }
.notice.ok { border-color: var(--ok); color: var(--ok); }
.modal-back { position: fixed; inset: 0; background: rgba(10, 12, 16, .5); z-index: 80; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); width: min(460px, 100%); max-height: calc(100% - 32px); overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.modal h3 { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 22px; }

/* ---------- welcome: the story starts today */
.welcome { position: absolute; top: 12px; left: 12px; bottom: auto; max-height: calc(100% - 24px); width: min(440px, calc(100% - 24px)); z-index: 15; container-type: inline-size; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: grid; grid-template-rows: minmax(0, 1fr) auto; animation: fadein .3s ease-out; }
@keyframes fadein { from { opacity: 0; transform: translateX(-12px); } }
.welcome .w-body { overflow-y: auto; overflow-x: hidden; padding: 20px 22px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; }
.welcome .w-body > * { min-width: 0; }
.welcome .title-card { color: var(--ink); font-size: clamp(28px, min(5.4vh, 10cqw), 54px); }
.welcome .today { font-family: var(--f-read); font-style: italic; font-size: clamp(19px, 2.5vh, 23px); line-height: 1.3; }
.welcome .today b { font-style: normal; font-family: var(--f-display); font-stretch: 112%; font-weight: 800; text-transform: uppercase; font-size: .82em; letter-spacing: .02em; padding: 1px 6px; border-radius: 4px; background: var(--era-collapse); color: #2a1e22; }
.welcome .lede { font-family: var(--f-read); font-size: 16.5px; line-height: 1.55; color: var(--ink-2); }
.welcome .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.welcome .facts b { font-size: 26px; }
.welcome .facts span { color: var(--muted); font-size: 12px; }
.welcome .eyebrow, .welcome .howto { color: var(--muted); }
.welcome .howto kbd { color: var(--ink); border-color: var(--line-strong); }
.welcome .w-actions { display: grid; gap: 8px; }
.welcome .w-actions .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.welcome .w-actions .btn { justify-content: center; }
.welcome .w-foot { border-top: 1px solid var(--line); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.welcome .linkish { all: unset; cursor: pointer; font-size: 14px; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.welcome .linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.about-chip { position: absolute; left: 12px; bottom: 12px; z-index: 14; }
@media (max-width: 640px) { .welcome { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; height: min(78%, 620px); max-height: none; } }
.panel .kcard h3 { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; color: var(--ink); letter-spacing: 0; text-transform: uppercase; display: block; }
.progress { position: relative; height: 26px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.progress span { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); transition: width .2s; }
.progress em { position: relative; font-style: normal; font-size: 12.5px; padding: 0 10px; line-height: 24px; color: var(--ink-2); }


/* ---------- the author's master timeline */
.hand { font-family: var(--f-hand); font-weight: 400; }
.canvas text.hand { font-family: var(--f-hand); letter-spacing: .01em; }
.mk .ring { fill: none; stroke: var(--kraft-ink); stroke-opacity: .5; stroke-width: 1; }
.mk.note .halo { stroke: none; }
.mk.note:focus-visible .halo, .mk.note.sel .halo { stroke: var(--kraft-ink); stroke-width: 1.5; }
.mk.note:hover .lab { text-decoration: none; opacity: .75; }
.ring-demo { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid currentColor; vertical-align: -1px; box-sizing: border-box; position: relative; }
.ring-demo::after { content: ""; position: absolute; inset: 2.5px; border-radius: 50%; background: currentColor; }
.ring-tag { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-type); font-size: 11.5px; color: var(--muted); margin-left: 8px; white-space: nowrap; }
.master-block { background: var(--paper); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; color: var(--paper-ink); }
.master-block .eyebrow { color: #7d6a52; }
.master-block .hand { font-size: 18px; line-height: 1.35; }
.master-block .linkish { all: unset; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; color: var(--paper-ink); justify-self: start; }
.master-block .linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hand-line { font-size: 15px; color: var(--paper-ink); background: var(--paper); border-radius: 6px; padding: 4px 9px; margin-top: 6px; display: inline-block; line-height: 1.3; }
.conns { display: grid; gap: 6px; }
.conn { all: unset; cursor: pointer; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 7px 10px; border-radius: 8px; border: 1px dashed var(--lc, var(--line-strong)); font-size: 14px; }
.conn:hover { background: var(--surface-2); }
.conn:focus-visible { outline: 2px solid var(--accent); }
.conn .dir { color: var(--lc, var(--ink-2)); font-weight: 800; }
.conn .what { font-weight: 600; }
.conn .type { font-size: 12px; color: var(--muted); }
.thread { border: 1px solid var(--line); border-left: 4px solid var(--tc, var(--line-strong)); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.thread p { font-size: 14.5px; color: var(--ink-2); }
.thread .steps { display: grid; gap: 4px; }
.stp { all: unset; cursor: pointer; display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 8px; padding: 6px 9px; border-radius: 7px; font-size: 14px; border: 1px solid transparent; }
.stp .tnum { font-family: var(--f-type); font-size: 12px; color: var(--muted); }
.stp:hover { background: var(--surface-2); }
.stp.cur { border-color: var(--tc, var(--line-strong)); background: color-mix(in srgb, var(--tc, var(--line)) 12%, var(--surface)); font-weight: 700; }
.stp:focus-visible { outline: 2px solid var(--accent); }
.master-card { display: grid; gap: 8px; border-top: 1px solid var(--kraft-line); padding-top: 16px; }
.master-card .thumb { all: unset; cursor: pointer; display: block; }
.master-card .thumb img { width: 100%; display: block; border-radius: 8px; border: 1px solid var(--kraft-line); }
.master-card .thumb:hover img { box-shadow: var(--shadow); }
.master-card .thumb:focus-visible { outline: 2px solid var(--kraft-ink); outline-offset: 3px; }
.master-card .linkish { all: unset; cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; color: var(--kraft-ink); }
.master-card .hand { color: var(--paper-ink); }
.legend-dots, .legend-grid { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--kraft-muted); }
.legend-dots span, .legend-grid span { display: inline-flex; align-items: center; gap: 5px; }
.legend-dots i, .legend-grid i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend-grid { font-size: 14px; color: var(--ink-2); gap: 6px 16px; }
.quotes { background: var(--paper); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; color: var(--paper-ink); }
.quotes .hand { font-size: 19px; line-height: 1.3; }
.panel.photo { width: auto; max-width: none; padding: 0; overflow: auto; background: var(--paper); border-color: #d9ccb4; display: block; }
.photo-wrap { height: 100%; display: flex; flex-direction: column; }
.photo-tools { position: sticky; left: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; background: color-mix(in srgb, var(--paper) 88%, transparent); width: 100%; max-width: calc(100vw - 40px); box-sizing: border-box; z-index: 2; }
.photo-wrap img { flex: 1 1 auto; min-height: 0; height: calc(100% - 52px); width: auto; display: block; }
.photo-wrap.zoom { overflow: auto; }
.photo-wrap.zoom img { flex: none; height: auto; width: 7200px; max-width: none; }
.welcome .linkish { font-size: inherit; }
.layers-pop .master-toggle { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }
.layers-pop .master-toggle .ring-demo { color: var(--ink); flex: none; }

/* ---------- engaging inequity */
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.chip.var { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 9px; font-family: var(--f-type); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; background: var(--vc, var(--surface-2)); color: var(--vi, var(--ink-2)); }
.chip.var[data-v="income"] { --vc: #E4ECF9; --vi: #1F4E96; }
.chip.var[data-v="race"] { --vc: #F6E3EC; --vi: #8E2A5C; }
.chip.var[data-v="gender"] { --vc: #EDE6F7; --vi: #5A3B9E; }
.chip.var[data-v="education"] { --vc: #E3F2EA; --vi: #1F6B45; }
.chip.var[data-v="job"] { --vc: #F8ECD9; --vi: #8A5410; }
.chip.var[data-v="place"] { --vc: #E7F0F2; --vi: #1F5F6B; }
.chip.var[data-v="immigration"] { --vc: #F3EBDD; --vi: #6E4F1F; }
.chip.var[data-v="longevity"] { --vc: #FBE6E0; --vi: #9A3A24; }
.chip.var[data-v="generation"] { --vc: #ECECEC; --vi: #3F4551; }
.ineq { border-top: 1px solid var(--line); padding-top: 12px; }
.ineq:first-of-type { border-top: 0; padding-top: 0; }
.ineq-note { font-size: 14px; color: var(--ink-2); }
.ineq-note .linkish, .prompt .linkish { all: unset; cursor: pointer; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.prompt { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; font-size: 14.5px; color: var(--ink-2); }
.author-words { margin: 4px 0 0; padding: 14px 16px; background: var(--paper); color: var(--paper-ink); border-radius: 10px; font-family: var(--f-read); font-size: 17px; line-height: 1.5; font-style: italic; }
.author-words cite { display: block; font-style: normal; font-family: var(--f-type); font-size: 12px; margin-top: 8px; color: #7d6a52; }
ol.principles { margin: 0; padding-left: 22px; display: grid; gap: 12px; }
ol.principles li::marker { font-family: var(--f-display); font-weight: 800; }
ol.principles b { display: block; font-size: 16px; margin-bottom: 2px; }
ol.principles p { color: var(--ink-2); font-size: 14.5px; }
.var-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.var-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.var-card .chip { justify-self: start; }
.var-card .fact { font-family: var(--f-read); font-size: 15.5px; line-height: 1.45; }
.var-card .src { font-size: 12.5px; color: var(--muted); }
.var-card .units { font-family: var(--f-type); font-size: 11.5px; color: var(--muted); }
.funnel-grid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 760px) { .funnel-grid { grid-template-columns: 1fr; } }
.funnel svg { width: 100%; max-width: 320px; display: block; margin: 10px auto 0; overflow: visible; }
.funnel .lvl { fill: var(--vc, var(--surface-2)); stroke: var(--vi, var(--line-strong)); stroke-width: 1.2; }
.funnel .lvl[data-v="income"] { --vc: #E4ECF9; --vi: #1F4E96; }
.funnel .lvl[data-v="gender"] { --vc: #EDE6F7; --vi: #5A3B9E; }
.funnel .lvl[data-v="race"] { --vc: #F6E3EC; --vi: #8E2A5C; }

<script>window.__SOR__={"meta":{"title":"The Story of Retirement","subtitle":"A brief history (because it really hasn't been around that long)","byline":"Jonathan Grimm","org":"Fernbridge Advisors","book":"A Concise History of Retirement","status":"Working draft, 2026","fullPdf":"downloads/the-story-of-retirement-draft.pdf","guidePdf":"downloads/course-guide.pdf"},"eras":[{"id":"classical","start":1340,"end":1890,"color":"classical"},{"id":"conception","start":1890,"end":1920,"color":"conception"},{"id":"crucible","start":1920,"end":1950,"color":"crucible"},{"id":"climax","start":1950,"end":1980,"color":"climax"},{"id":"codify","start":1980,"end":2010,"color":"codify"},{"id":"collapse","start":2010,"end":2040,"color":"collapse"},{"id":"catastrophe","start":2040,"end":2100,"color":"catastrophe"}],"modules":[{"id":"collapse","number":6,"title":"Collapse","years":"2010–2040","definition":"col·lapse (noun) the fall of something","tagline":"We are not approaching the collapse. We are in it.","bigQuestion":"When a system fails slowly, how do we know it is failing — and who carries the cost while it does?","overview":"The book calls 2010–2040 the Collapse, and it insists on the present tense: “We are not approaching the collapse. We are in it.” Grimm’s image is a building that falls slowly. Cracks appear, engineers file reports, someone repaints the lobby, and people keep walking in. The 2008 crash could have been the moment to ask whether the retirement system works. Instead, the book argues, the recovery was a fresh coat of paint rather than a reckoning.\n\nThis module follows the cracks as they widen. The first Baby Boomers turned 65 in 2011; from 2024 through 2027 more than 4.1 million Americans a year reach that age. Detroit cut retiree pensions in bankruptcy, multiemployer plans neared insolvency until taxpayers rescued them, and Congress kept tuning the individual-account system it inherited from the Codify era. Three sharp market drops, in 2020, 2022 and 2025, tested savers who had been told markets always come back.\n\nThe era ends in projection. The 2026 Social Security Trustees Report projects that the retirement trust fund (OASI) will be depleted in late 2032. Unless Congress acts, about 78% of scheduled benefits would then be payable. Your job is to separate what has happened from what is projected, and to test the book’s claim that the collapse is “a mathematical inevitability.”","learningObjectives":["Explain how the 2026 Trustees Report arrives at its projections (OASI depletion in 2032, about 78% of scheduled benefits payable) and distinguish “scheduled” from “payable” benefits.","Trace the defined-benefit failures of the era (Detroit, Central States and the 2021 Special Financial Assistance rescue) and evaluate who absorbed the losses.","Analyze how the SECURE Act (2019) and SECURE 2.0 (2022) extended the individual-account model through nudges such as automatic enrollment.","Compare the book’s savings-gap arithmetic with current Federal Reserve (SCF 2025) and BLS data, identifying where the evidence supports or complicates the argument.","Evaluate how the Two Americas seed shows up in unequal access to workplace plans, unequal wealth and unequal life expectancy."],"policyEvents":[{"year":2010,"title":"Affordable Care Act","type":"legislation","detail":"Enacted in March 2010, the ACA created premium tax credits for households with incomes from 100% to 400% of the federal poverty level. It also expanded Medicaid to adults below 138% of poverty, although not every state has adopted the expansion.","significance":"Healthcare is the book’s “hidden enemy” of old age. Subsidized individual coverage gave workers who leave a job before Medicare eligibility at 65 an option outside employer insurance, an instance of the Government Involvement seed acting as protection.","itemId":"collapse-pol-0"},{"year":2013,"endYear":2014,"title":"Detroit’s Chapter 9 Bankruptcy","type":"policy","detail":"Detroit filed for Chapter 9 bankruptcy on July 18, 2013, with an estimated $18–20 billion in debts and obligations. A “Grand Bargain” of about $816 million from the State of Michigan, foundations and the Detroit Institute of Arts limited the damage. General retirees lost 4.5% of their pensions and their annual cost-of-living increases, and police and fire retirees lost part of theirs. Judge Steven Rhodes confirmed the plan on November 7, 2014.","significance":"Public pensions, the last widespread defined-benefit promise, proved cuttable in bankruptcy. This is the harvest of The Promise seed: a pension is only as secure as the institution behind it.","itemId":"collapse-pol-1"},{"year":2014,"title":"Multiemployer Pension Reform Act (MPRA)","type":"legislation","detail":"Enacted in December 2014 as Division O of the Consolidated and Further Continuing Appropriations Act, 2015 (P.L. 113-235), MPRA let severely underfunded multiemployer plans apply to the Treasury to cut benefits already being paid, provided the cuts would restore solvency. Retirees aged 80 and older and disabled participants were protected, and no benefit could fall below 110% of the PBGC guarantee.","significance":"Federal law now allowed earned pension benefits to be cut for people already retired. The Promise was rewritten after the fact.","itemId":"collapse-pol-2"},{"year":2016,"title":"Treasury Rejects Central States Benefit Cuts","type":"policy","detail":"The Teamsters’ Central States pension fund applied under MPRA to cut benefits for about 270,000 of its nearly 400,000 participants, totaling about $11 billion. On May 6, 2016, the Treasury rejected the application, citing an unreasonable 7.5% return assumption, an inequitable distribution of the cuts and notices that participants could not understand. The fund expected to become insolvent around 2026.","significance":"The rejection bought time without solving anything, and the plan’s fate passed to Congress. It shows the Government Involvement seed as protector and bystander at once.","itemId":"collapse-pol-3"},{"year":2019,"title":"SECURE Act","type":"legislation","detail":"Signed December 20, 2019, as part of the Further Consolidated Appropriations Act, 2020 (P.L. 116-94). The law raised the required minimum distribution age from 70½ to 72 and ended the “stretch IRA” for most non-spouse heirs by imposing a 10-year payout rule. It also opened 401(k)s to long-term part-time workers, let unrelated small employers share pooled plans and created a safe harbor for offering annuities inside 401(k)s.","significance":"The first major retirement law of the Collapse era tuned the individual-account machine rather than questioning it: the Individualism seed with better plumbing.","itemId":"collapse-pol-4"},{"year":2021,"title":"American Rescue Plan: Special Financial Assistance for Multiemployer Pensions","type":"legislation","detail":"The American Rescue Plan Act, signed March 11, 2021, incorporated the multiemployer rescue championed as the Butch Lewis Act. It created non-repayable Special Financial Assistance, paid from general taxpayer funds, for severely underfunded plans. Central States received about $35.8 billion in December 2022 for 357,056 participants; without it, the plan was projected to run out of money in 2025 and benefits would have dropped roughly 60% below plan terms. By May 2026, the PBGC had approved about $77.9 billion for 161 plans covering roughly 1.8 million people.","significance":"The Promise was kept, but by taxpayers rather than by the employers who made it. The Community principle reappeared as a federal backstop.","itemId":"collapse-pol-5"},{"year":2021,"endYear":null,"title":"The fight over fair access to banking","detail":"In January 2021 the Office of the Comptroller of the Currency issued a “fair access” rule requiring large banks to judge customers individually rather than refusing whole categories of lawful business; it was paused weeks later. Fair Access to Banking Act bills were reintroduced in Congress in 2025, and an August 7, 2025, executive order directed regulators to act against politicized “debanking.”","significance":"The newest chapter in a long argument over who gets access to financial services, and on what terms.","decline":null,"type":"policy","itemId":"m-fair-access-2021","master":true,"hand":"Fair Access to Fin. Serv. Act"},{"year":2022,"title":"SECURE 2.0 Act","type":"legislation","detail":"Signed December 29, 2022. From 2025, most new 401(k) and 403(b) plans must automatically enroll workers at 3–10% of pay with annual increases. The law also raised the RMD age to 73, rising to 75 in 2033, and allowed employers to match student-loan payments. Its federal Saver’s Match pays 50% of up to $2,000 in contributions for lower- and moderate-income savers, starting with 2027 contributions.","significance":"Automatic enrollment uses a collective tool, the default, to rescue an individual system. Students should ask whether nudges answer the structural question or only make it quieter.","itemId":"collapse-pol-6"},{"year":2025,"title":"Social Security Fairness Act","type":"legislation","detail":"Signed January 5, 2025 (P.L. 118-273), after votes of 327–75 in the House and 76–20 in the Senate, the Act repealed the Windfall Elimination Provision and the Government Pension Offset. Those rules had reduced or eliminated Social Security benefits for more than 3.2 million people with pensions from jobs not covered by Social Security. By late April 2025, the SSA had paid more than $14.8 billion in retroactive benefits to over 2.2 million people.","significance":"The law redrew a boundary (Seed 1) in favor of public workers. The 2025 Trustees named it the primary contributor to the change in the combined trust fund depletion date, so generosity and solvency pulled in opposite directions.","itemId":"collapse-pol-7"},{"year":2025,"title":"One Big Beautiful Bill Act: Senior Deduction","type":"legislation","detail":"Signed July 4, 2025 (P.L. 119-21), the law added a temporary $6,000 deduction for each taxpayer aged 65 or older for tax years 2025–2028, phasing out above $75,000 in modified adjusted gross income ($150,000 for joint filers). The Committee for a Responsible Federal Budget’s analysis of the 2026 Trustees Report finds that the law cut Social Security’s 75-year balance by 0.16% of taxable payroll, about a quarter of that year’s deterioration, by lowering revenue from income taxes on benefits.","significance":"Tax relief for today’s seniors came partly at the cost of the trust fund’s future. Students can test whether this fits the book’s pattern of “accountability without proximity.”","itemId":"collapse-pol-8"},{"year":2032,"title":"Projected: Social Security Retirement Trust Fund (OASI) Depleted","type":"policy","detail":"Projected. The 2026 Trustees Report (released June 9, 2026) projects that OASI reserves will be depleted in the fourth quarter of 2032. Payroll taxes would then cover about 78% of scheduled benefits, falling to 62% by 2100. CBO’s September 2026 projections are more pessimistic, with exhaustion in fiscal 2032 and a 26% cut. Medicare’s Hospital Insurance fund is projected to be depleted in 2033, when 89% of costs would be payable.","significance":"The book wrote “mid-2030s” and “75–80%,” and the newest official projections move the date earlier. This is the hinge between Collapse and Catastrophe. It is a projection under current law, not a certainty, because Congress can act.","itemId":"collapse-pol-9"}],"marketDrops":[{"year":2020,"endYear":2020,"name":"The COVID Crash","decline":"−34% (S&P 500, Feb 19 – Mar 23, 2020)","detail":"Pandemic shutdowns produced what was then the fastest bear market on record, a nearly 34% fall that lasted barely more than a month. The S&P 500 closed at a new record on August 18, 2020, about five months after the bottom.","retirementImpact":"Savers who had to sell near the bottom, including newly displaced older workers, locked in losses that the averages quickly erased.","itemId":"collapse-mar-0","type":"crisis","master":true,"hand":"COVID Crash"},{"year":2022,"endYear":2022,"name":"The 2022 Bear Market","decline":"≈ −25% (U.S. stocks, Jan 3 – mid-Oct 2022; Morningstar US Market Index −25.4% from peak)","detail":"Rising inflation and interest rates pushed U.S. stocks down about a quarter from their January peak. Bonds offered no shelter: the Morningstar US Core Bond Index fell 12.9% in 2022, its worst year on record.","retirementImpact":"Stocks and bonds fell together, so the “balanced” portfolios sold to near-retirees as the safe option lost value on both sides.","itemId":"collapse-mar-1","type":"crisis"},{"year":2025,"endYear":2025,"name":"The Tariff Shock","decline":"≈ −19% (S&P 500, Feb 19 – Apr 8, 2025)","detail":"After sweeping tariff announcements, the S&P 500 closed almost 19% below its February 19 record on April 8, 2025, just short of a bear market. It recovered to a record close by June 27, 2025.","retirementImpact":"Peak 65 retirees saw a fifth of their equity value threatened within weeks of leaving work: sequence-of-returns risk in real time.","itemId":"collapse-mar-2","type":"crisis"}],"socialMovements":[{"year":2011,"endYear":2011,"name":"Occupy Wall Street","detail":"Occupy began on September 17, 2011, in Zuccotti Park in Lower Manhattan, after a call from the Canadian magazine Adbusters, and popularized the slogan “We are the 99%.” Police cleared the encampment on November 15, 2011.","significance":"It named the Two Americas seed in the language of mass politics just as the first Boomers reached 65.","itemId":"collapse-soc-0","type":"movement"},{"year":2011,"name":"FIRE: Financial Independence, Retire Early","detail":"FIRE draws on the 1992 book Your Money or Your Life by Joe Dominguez and Vicki Robin and spread through blogs. Pete Adeney’s Mr. Money Mustache, launched in 2011 by a blogger who had stopped full-time work at 30, became a hub for followers who save aggressively in order to exit paid work decades early.","significance":"FIRE rebels against 65 = Old and Done while doubling down on Individualism and Market Growth: it is still an escape financed by a personal portfolio.","itemId":"collapse-soc-1","type":"movement"},{"year":2021,"endYear":2022,"name":"The Great Resignation and the Pandemic Retirement Wave","detail":"Quits reached a then-series high of 4.5 million in November 2021 (BLS JOLTS). One estimate counted more than 2.4 million “excess” retirements by August 2021. The St. Louis Fed found that the excess peaked in late 2021 and had disappeared by late 2024.","significance":"The surge and its fade suggest that retirement timing tracks markets and circumstances rather than a fixed plan or age.","itemId":"collapse-soc-2","type":"movement"}],"inequities":[{"title":"Access Depends on the Job","detail":"In March 2026, 72% of private-industry workers had access to an employer retirement plan and 52% participated. Among the lowest-paid quarter of workers, 48% had access and 22% participated, compared with 92% and 81% among the highest-paid quarter. For part-time workers the figures were 44% and 20% (BLS National Compensation Survey).","vars":["job","income"]},{"title":"The Longevity Gap","detail":"A 2016 JAMA study led by Raj Chetty found that at age 40, men in the richest 1% live 14.6 years longer than men in the poorest 1%, and women 10.1 years longer. From 2001 to 2014, the top 5% of earners gained 2.34 (men) and 2.91 (women) years of life expectancy, while the bottom 5% gained only 0.32 and 0.04.","vars":["income","longevity","gender"]},{"title":"The Racial Wealth Gap Widened","detail":"The Federal Reserve’s 2025 Survey of Consumer Finances found that median net worth for Black families fell 25% between 2022 and 2025, to $36,800. Over the same period, median wealth rose to $332,100 for White families and $79,600 for Hispanic families (2025 dollars).","vars":["race","income"]},{"title":"Elder Poverty Is Rising Again","detail":"An AARP Foundation analysis of Census data puts Supplemental Poverty Measure poverty among Americans aged 65 and older at 15.4% in 2025, up from 9.4% in 2020: more than 10 million people. For older women the rate is nearly 17%. Census data show Social Security moved 28.8 million people out of poverty in 2025.","vars":["income","generation"]},{"title":"Aging Into Homelessness","detail":"Using HUD data, the GAO reported in January 2025 that about 146,000 adults aged 55 and older were homeless, about one in five of all people experiencing homelessness and roughly 6% more than in 2023. A 2019 multi-university study projected that the homeless population aged 65 and older would nearly triple, from about 40,000 to 106,000, by 2030 (projected).","vars":["income","generation"]}],"historicalContext":[{"year":2011,"endYear":2029,"title":"Boomers Begin Turning 65","detail":"The oldest Baby Boomers turned 65 on January 1, 2011, and Pew estimated that about 10,000 a day would follow for 19 years. The Census Bureau projects that all Boomers will be 65 or older by 2030.","itemId":"collapse-his-1","type":"history"},{"year":2020,"endYear":null,"title":"The COVID-19 pandemic","detail":"The World Health Organization declared COVID-19 a pandemic on March 11, 2020. More than 1.1 million Americans died of it.","significance":"He pairs it with 1918, “the original COVID-19.” Both pandemics reshaped work and family; this one also pushed a wave of older workers into early retirement.","decline":null,"type":"history","itemId":"m-covid-19","master":true,"hand":"COVID-19"},{"year":2024,"endYear":2027,"title":"Peak 65","detail":"From 2024 through 2027, more than 4.1 million Americans a year, about 11,200 a day, turn 65, according to the Alliance for Lifetime Income’s Retirement Income Institute. The institute notes that most of these households lack a pension.","itemId":"collapse-his-2","type":"history"},{"year":2025,"title":"Student Debt Goes Gray","detail":"Borrowers aged 50 and older held about 26% of outstanding federal student debt in early 2025. The Fed’s 2025 survey found that 20% of families carry student debt, with a median balance of $25,600.","itemId":"collapse-his-3","type":"history"},{"year":2029,"title":"Projected: Older Americans Outnumber Children","detail":"Projected. In the Census Bureau’s 2023 middle-series projections, Americans aged 65 and older outnumber children under 18 for the first time in 2029.","itemId":"collapse-his-4","type":"history"}],"seeds":[{"seed":1,"stage":"harvest","detail":"The boundaries drawn in 1935 still sort who is protected. Part-time, low-wage and gig workers have the least access to workplace plans. The 2025 repeal of WEP/GPO shows that boundaries can be redrawn, but only for groups organized enough to demand it."},{"seed":2,"stage":"harvest","detail":"Government shows both faces at once. It rescues multiemployer pensions with $77.9 billion and restores benefits to public workers, yet passes tax relief that weakens trust fund revenue and leaves the 2032 depletion unaddressed. Protection and abandonment arrive in the same decade."},{"seed":3,"stage":"harvest","detail":"Peak 65 makes the age a demographic wave as well as a cultural endpoint: over 4.1 million Americans a year reach it. Full Social Security retirement age has risen to 67 under the 1983 Amendments, yet 65 remains the cultural finish line, even as the longevity gap means the extra years are not shared equally."},{"seed":4,"stage":"harvest","detail":"Three sharp drops (2020, 2022, 2025) all recovered, which reinforces the belief that markets always come back. The harvest falls on those who had to sell at the bottom, and on 2022’s lesson that stocks and bonds can fall together."},{"seed":5,"stage":"harvest","detail":"Leisure splits in two. FIRE recasts it as escape at 35, and the pandemic wave of excess retirements shows how quickly people leave work when markets allow it. For most Peak 65 households, though, the “golden years” image now runs up against the savings data."},{"seed":6,"stage":"blooming","detail":"Speed and speculation flourish in app-based trading and crypto. The seed is still growing rather than harvested, and its appeal rises as the gap between what people have and what they need widens."},{"seed":7,"stage":"harvest","detail":"The two Americas now differ in lifespan (a 14.6-year gap for men), plan access (92% vs. 48% across wage quartiles) and wealth (Black median net worth fell 25% from 2022 to 2025). The system works best for those who already need it least."},{"seed":8,"stage":"harvest","detail":"Detroit retirees took cuts, and Central States retirees were nearly cut by law before taxpayers stepped in. The betrayal the book describes becomes literal: promised benefits were reduced, suspended or bailed out."},{"seed":9,"stage":"harvest","detail":"SECURE and SECURE 2.0 respond to failure with more individual accounts, made better through defaults and matches. A shortfall is still framed as a personal savings problem, which the book calls converting systemic failure into personal failure."}],"twoPersonLens":{"year":2025,"older":{"born":1965,"headline":"Trying to Exit a System That No Longer Functions","text":"She turned 20 in 1985, in the early years of the 401(k), and was handed a calculator instead of a pension. She was 43 when the 2008 crash cut the market by more than half, 55 when COVID briefly erased a third of it, and 57 when stocks and bonds fell together in 2022. Now 60, she stands just behind the Peak 65 wave. Her full Social Security retirement age is 67, and she reaches it in 2032, the very year the Trustees project the retirement trust fund will run dry. If Congress does nothing, her check could arrive about 22% smaller than her statement promised. She is not behind because she failed the plan. She is leaving a system whose exit door is moving."},"younger":{"born":2005,"headline":"Never Entered It","text":"He was a toddler when Lehman failed and fifteen when the pandemic shut his school. At 20 he works two jobs, one of them through an app. As a part-timer, he belongs to a group in which only 44% of private-sector workers have access to a retirement plan and only 20% take part. He has no pension to lose and no 401(k) to watch, because the system his grandparents retired on never reached him. He turns 67 in 2072. Without reform, the Trustees project that payable retirement benefits will slide from about 78% of scheduled at depletion toward 62% by 2100. He is not grieving the dream. He never downloaded it."},"irony":"The 60-year-old is racing to leave a system as its exit narrows, while the 20-year-old is told to save for a system that never let him in."},"keyTerms":[{"term":"Trust fund depletion","definition":"The point at which a Social Security or Medicare trust fund’s reserves run out. The program does not end; it can pay only what incoming revenue covers."},{"term":"Scheduled vs. payable benefits","definition":"Scheduled benefits are what the current benefit formula promises. Payable benefits are what incoming revenue can fund after depletion: about 78% for OASI in 2032 under the 2026 Trustees’ intermediate assumptions."},{"term":"Worker-to-beneficiary ratio","definition":"The number of covered workers paying into Social Security for each beneficiary: 5.1 in 1960, 2.9 in 2010 and 2.6 in 2025, with 2.3 projected by 2035 (2026 Trustees Report)."},{"term":"Multiemployer pension plan","definition":"A defined-benefit plan jointly funded by many employers in an industry under a collective-bargaining agreement, such as the Teamsters’ Central States fund."},{"term":"Special Financial Assistance (SFA)","definition":"Non-repayable federal funds created by the American Rescue Plan Act of 2021 to keep severely underfunded multiemployer plans paying benefits, administered by the PBGC."},{"term":"Automatic enrollment","definition":"A plan design that enrolls workers by default unless they opt out. SECURE 2.0 requires it for most new 401(k) and 403(b) plans starting in 2025."},{"term":"Required minimum distribution (RMD)","definition":"The minimum that must be withdrawn each year from tax-deferred retirement accounts after a set age: 72 under the SECURE Act, then 73 under SECURE 2.0, rising to 75 in 2033."},{"term":"Supplemental Poverty Measure (SPM)","definition":"A Census poverty measure that counts taxes, government benefits and necessary expenses such as medical costs. It shows higher poverty among older adults than the official measure (14.1% vs. 10.2% in 2022)."},{"term":"Peak 65","definition":"The years 2024–2027, when more than 4.1 million Americans a year turn 65 and the Baby Boom’s arrival at retirement age reaches its height."}],"keyFigures":[{"name":"Steven Rhodes","role":"The federal bankruptcy judge who presided over Detroit’s Chapter 9 case and confirmed its plan of adjustment on November 7, 2014, including the Grand Bargain that limited pension cuts."},{"name":"Raj Chetty","role":"Economist who led the 2016 JAMA study linking income to life expectancy. Its finding of a 14.6-year gap for men between the richest and poorest 1% changes the question of whom a uniform retirement age actually serves."},{"name":"Pete Adeney (“Mr. Money Mustache”)","role":"A blogger who stopped full-time work at 30 and in 2011 launched the site that became a hub of the FIRE movement, a test case for both rejecting and reinforcing the retirement dream."},{"name":"Kalle Lasn","role":"Co-founder of Adbusters, whose 2011 call launched Occupy Wall Street and its “99%” framing of inequality."}],"primarySources":[{"title":"2026 OASDI Trustees Report — Highlights","year":2026,"source":"Social Security Administration, Office of the Chief Actuary","url":"https://www.ssa.gov/oact/TR/2026/II_A_highlights.html","why":"Find the official depletion dates, the payable percentages and the 75-year deficit, and note the phrase “absent legislative action.”"},{"title":"Table IV.B4: Covered Workers and Beneficiaries, 1945–2100","year":2026,"source":"Social Security Administration, 2026 Trustees Report","url":"https://www.ssa.gov/oact/TR/2026/lr4b4.html","why":"Trace the worker-to-beneficiary ratio from 41.9 in 1945 to its projected 1.9, and identify where history ends and projection begins."},{"title":"Changes in U.S. Family Finances from 2022 to 2025: Evidence from the Survey of Consumer Finances","year":2026,"source":"Board of Governors of the Federal Reserve System","url":"https://www.federalreserve.gov/publications/files/scf26.pdf","why":"Compare retirement-account ownership (54.9% of families) and median balances with the book’s savings-gap claims."},{"title":"Employee Benefits in the United States, March 2026","year":2026,"source":"U.S. Bureau of Labor Statistics","url":"https://www.bls.gov/news.release/ebs2.nr0.htm","why":"Note who has access to retirement plans and who actually participates, by wage level and full- or part-time status."},{"title":"Association Between Income and Life Expectancy in the United States, 2001–2014","year":2016,"source":"JAMA (Chetty et al.)","url":"https://jamanetwork.com/journals/jama/fullarticle/2513561","why":"Consider what the income–longevity gap implies for a single retirement age applied to everyone."}],"discussionQuestions":["The book argues that 2008 should have prompted a reckoning but produced only “a fresh coat of paint.” Judging by the laws in this module (SECURE, SECURE 2.0 and the 2021 pension rescue), was the post-2008 response repair, renovation or denial?","Challenge the book: markets regained their prior highs within months of the 2020 and 2025 drops, and the Fed’s 2025 survey shows the median retirement balance among holders rising to $106,000. Does this evidence undercut the claim that the collapse is “a mathematical inevitability,” or do averages hide the people the book is writing about?","Detroit retirees took cuts, while Central States retirees were made whole by taxpayers. What explains the different outcomes, and what do they reveal about The Promise as a moral category?","The Social Security Fairness Act and the 2025 senior deduction both helped current retirees while worsening long-range trust fund finances. How should lawmakers weigh obligations to today’s 65-year-olds against tomorrow’s 20-year-olds?","FIRE and the pandemic retirement wave both rejected the forty-years-then-stop script. Are they signs of the awakening the book calls “who gave you that dream?”, or new versions of the Leisure and Individualism seeds?","Which matters most for the Two Americas seed in this era: unequal access to plans, unequal wealth or unequal lifespans? Defend your choice with data."],"assignment":{"title":"Your Number vs. the Data","type":"Quantitative data investigation","prompt":"The Collapse chapter makes a simple calculation: a $20,000 income at a 4% withdrawal rate requires $500,000, while median savings near retirement are about $65,000. Rebuild and stress-test that argument with official data. Pull at least three figures from each of three sources: (1) the Federal Reserve’s 2025 Survey of Consumer Finances, including its interactive data on medians by age; (2) the 2026 Social Security Trustees Report (depletion dates, payable percentages, worker-to-beneficiary ratios); and (3) either the BLS National Compensation Survey or the current HHS poverty guidelines. Calculate a “number” for a hypothetical 60-year-old under two scenarios, scheduled benefits and payable benefits after 2032, and explain what the gap means. Conclude by stating where the data confirm, sharpen or complicate the book’s claim.","deliverable":"A 1,200–1,500-word data memo with at least one table or chart, a methods paragraph stating every assumption, and at least four cited official sources (APA or Chicago).","points":100,"rubric":[{"criterion":"Data accuracy & sourcing","points":30,"exemplary":"Every figure is correct, dated and traced to an official table; the memo distinguishes historical data from projections and medians from means.","proficient":"Figures are mostly accurate and sourced, with minor dating or labeling gaps.","developing":"Several figures are unsourced, outdated or mislabeled (for example, means presented as medians).","beginning":"Data are missing, invented or impossible to trace."},{"criterion":"Quantitative reasoning","points":30,"exemplary":"Calculations are correct and transparent, assumptions are stated, and the scheduled-vs.-payable scenarios are modeled clearly, with a sensitivity check.","proficient":"Calculations are correct, with some assumptions left implicit.","developing":"Calculations contain errors or skip steps, and the two scenarios are not clearly compared.","beginning":"Little or no calculation, or the math is fundamentally wrong."},{"criterion":"Engagement with the book’s argument","points":25,"exemplary":"Fairly states the book’s claim, then shows precisely where the data confirm, sharpen or complicate it, including who is hidden by the averages.","proficient":"Connects the data to the book’s claim, with a reasonable but general evaluation.","developing":"Mentions the book but does not test its claim against the data.","beginning":"Ignores the book’s argument or simply restates it."},{"criterion":"Clarity & presentation","points":15,"exemplary":"Concise memo structure, with a well-labeled chart or table a non-specialist can read and clean citations.","proficient":"Clear overall, with minor formatting or labeling issues.","developing":"Disorganized, or visuals are hard to interpret.","beginning":"Missing visual, unclear writing or no citations."}]},"quiz":[{"q":"According to the 2026 Social Security Trustees Report, when is the OASI (retirement) trust fund projected to be depleted?","options":["2029","Late 2032","2035","2041"],"answer":1,"explain":"The 2026 Trustees project OASI depletion in the fourth quarter of 2032, after which about 78% of scheduled benefits would be payable without congressional action."},{"q":"What does SECURE 2.0 (2022) require of most new 401(k) and 403(b) plans beginning in 2025?","options":["Guaranteed lifetime pensions","Automatic enrollment of eligible workers","A mandatory 6% employer match","Investment only in index funds"],"answer":1,"explain":"New plans must auto-enroll workers at 3–10% of pay, with annual increases. Workers can still opt out."},{"q":"About how many covered workers were paying into Social Security for each beneficiary in 2025?","options":["About 5.1","About 3.4","About 2.6","About 1.9"],"answer":2,"explain":"Table IV.B4 of the 2026 Trustees Report shows 2.6 in 2025, down from 5.1 in 1960. The ratio is projected to fall to 1.9 by 2075."},{"q":"What did the American Rescue Plan Act’s Special Financial Assistance program (2021) do?","options":["Cut multiemployer pension benefits to restore solvency","Provided non-repayable federal funds to severely underfunded multiemployer pension plans","Converted pensions into 401(k) accounts","Raised the Social Security payroll tax"],"answer":1,"explain":"SFA grants from general taxpayer funds kept plans like Central States paying benefits. By May 2026 about $77.9 billion had been approved."},{"q":"In March 2026, what share of the lowest-paid quarter of private-industry workers had access to an employer retirement plan?","options":["About 92%","About 72%","About 48%","About 10%"],"answer":2,"explain":"The BLS reported 48% access, and only 22% participation, for the lowest wage quartile, compared with 92% access for the highest."}],"sources":[{"label":"SSA — 2026 Trustees Report Highlights","url":"https://www.ssa.gov/oact/TR/2026/II_A_highlights.html"},{"label":"SSA — 2026 Trustees Report, Table IV.B4 (workers per beneficiary)","url":"https://www.ssa.gov/oact/TR/2026/lr4b4.html"},{"label":"SSA — Summary of the 2025 Trustees Reports","url":"https://www.ssa.gov/oact/TRSUM/"},{"label":"CRFB — Analysis of the 2026 Social Security Trustees’ Report","url":"https://www.crfb.org/papers/analysis-2026-social-security-trustees-report"},{"label":"CRFB — Analysis of the 2026 Medicare Trustees’ Report","url":"https://www.crfb.org/papers/analysis-2026-medicare-trustees-report"},{"label":"Becker’s — 2026 Medicare Trustees notes","url":"https://www.beckershospitalreview.com/finance/medicare-advantage-spending-flagged-as-hospital-fund-depletion-moves-up-5-notes/"},{"label":"CBO — 2026 Long-Term Projections for Social Security","url":"https://www.cbo.gov/publication/62556"},{"label":"401(k) Specialist — CBO projects 26% cut in 2032","url":"https://401kspecialistmag.com/social-security-benefit-cut-could-reach-26-in-2032-cbo-projects/"},{"label":"Federal Reserve — Changes in U.S. Family Finances 2022–2025 (SCF)","url":"https://www.federalreserve.gov/publications/files/scf26.pdf"},{"label":"Federal Reserve — Survey of Consumer Finances index","url":"https://www.federalreserve.gov/econres/scfindex.htm"},{"label":"BLS — Employee Benefits in the U.S., March 2026","url":"https://www.bls.gov/news.release/ebs2.nr0.htm"},{"label":"BLS — Retirement benefits table, March 2026","url":"https://www.bls.gov/news.release/ebs2.t01.htm"},{"label":"BLS — Contingent and Alternative Employment Arrangements, July 2023","url":"https://www.bls.gov/news.release/conemp.nr0.htm"},{"label":"BLS — JOLTS, November 2021","url":"https://www.bls.gov/news.release/archives/jolts_01042022.htm"},{"label":"St. Louis Fed — U.S. Retirement Normalization after COVID-19","url":"https://www.stlouisfed.org/on-the-economy/2025/jul/us-retirement-normalization-covid19-pandemic"},{"label":"Pew Research — Baby Boomers Retire (2010)","url":"https://www.pewresearch.org/short-reads/2010/12/29/baby-boomers-retire/"},{"label":"Alliance for Lifetime Income — Peak 65 release","url":"https://www.protectedincome.org/wp-content/uploads/2024/01/Peak-65-Release-final-011024.pdf"},{"label":"Census Bureau — 2023 National Population Projections","url":"https://www.census.gov/newsroom/press-releases/2023/population-projections.html"},{"label":"Census Bureau — Demographic Turning Points (P25-1144)","url":"https://www.census.gov/content/dam/Census/li

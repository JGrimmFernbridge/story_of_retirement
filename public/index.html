ry, and annuities ranged from $180 to $720 a year. Almost 6,000 employees were retired for age on August 20, 1920.","significance":"The federal government became an employer with its own pension plan and mandatory retirement. It shows that the vacancy logic was not limited to private industry.","decline":null,"module":"conception","projected":false,"master":false,"hand":null},{"id":"seed-4","lane":"seeds","type":"seed","year":1924,"endYear":null,"title":"Seed 4: Market Growth","detail":"The Roaring Twenties were the first moment ordinary Americans believed markets could reliably make them wealthy. Brokerages opened Main Street offices and stocks became dinner-table conversation. The assumption that equity markets go up, and that this growth could be depended upon as a savings mechanism, was born here. Black Tuesday buried it temporarily. The 401(k) era dug it back up and built a retirement system on top of it.","significance":"The belief that markets reliably rise, and can stand in for a pension.","decline":null,"seed":4,"module":"crucible","projected":false,"master":true,"hand":"Roaring 20’s → seed: Market"},{"id":"seed-5","lane":"seeds","type":"seed","year":1925,"endYear":null,"title":"Seed 5: Search for Leisure","detail":"The 1920s consumer economy gave the middle class its first taste of leisure as something you could buy. After the war the seed bloomed: retirement was reimagined as earned vacation, and Del Webb's Sun City (1960) built not just retirement housing but a retirement ideology. Retirement became reward, deserved rest, the Dream's final chapter. The aspiration outpaced the math for most Americans long before they realized it.","significance":"Retirement reimagined as an earned vacation.","decline":null,"seed":5,"module":"crucible","projected":false,"master":true,"hand":"Roaring 20’s → seed: Leisure"},{"id":"crucible-pol-0","lane":"policy","type":"legislation","year":1926,"endYear":null,"title":"Revenue Act of 1926 exempts pension trusts","detail":"Building on the Revenue Act of 1921, which shielded income of stock-bonus and profit-sharing trusts from current tax, the 1926 Act exempted the income of employer pension trusts from current taxation. Employer contributions were treated as a deductible payroll cost, and workers owed no tax on contributions or trust earnings until benefits were paid.","significance":"Retirement saving entered the tax code half a century before the 401(k): Washington began subsidizing private pensions through tax deferral, an early and quiet form of Government Involvement (seed 2) whose benefits went only to workers whose employers offered a plan.","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"seed-6","lane":"seeds","type":"seed","year":1926,"endYear":null,"title":"Seed 6: Get Rich Quick","detail":"The 1920s democratized speculation. Ordinary people bought stocks on margin and chased tips, convinced timing and instinct could beat patience. Black Tuesday buried the impulse for two generations. It returned in the 1980s and 1990s with mutual funds and day trading, and again with crypto. Speculation and retirement saving are incompatible impulses wearing the same financial clothes.","significance":"Speculation, opportunity, possibility, speed.","decline":null,"seed":6,"module":"crucible","projected":false,"master":true,"hand":"Market → Speculative · Opportunity · Possibility · Speed → Get Rich Quick. Seed so rooted in our humanity."},{"id":"m-great-depression","lane":"history","type":"history","year":1929,"endYear":1939,"title":"The Great Depression","detail":"From the 1929 crash through the end of the decade, output and prices collapsed, thousands of banks failed, and unemployment reached about 25 percent in 1933.","significance":"Pulled both Americas into the same reckoning and made Social Security politically possible.","decline":null,"module":"crucible","projected":false,"master":true,"hand":"Great Depression 1929–39 → seed: 2 Americas (rich / rural)"},{"id":"crucible-mar-0","lane":"markets","type":"crisis","year":1929,"endYear":1932,"title":"The Great Crash","detail":"The Dow peaked at 381.17 on September 3, 1929, fell nearly 13 percent on Black Monday (Oct. 28) and nearly 12 percent on Black Tuesday (Oct. 29), and bottomed at 41.22 on July 8, 1932; many buyers had put down only about 10 percent and borrowed the rest. The index did not regain its 1929 high until November 23, 1954.","significance":"A 25-year recovery meant anyone counting on stocks to fund old age in 1929 never got their money back during a working lifetime—the first great test of the Market Growth seed (4).","decline":"−89% (Dow, Sept. 3, 1929 – July 8, 1932)","module":"crucible","projected":false,"master":true,"hand":"Black Tuesday. “We name these.”"},{"id":"seed-7","lane":"seeds","type":"seed","year":1929,"endYear":null,"title":"Seed 7: Two Americas","detail":"On the master timeline this seed is planted at Black Tuesday and the Great Depression, 1929–1939, with his note: rich / rural. The divide was already structural: industrial, urban, unionized workers on one side; agricultural, rural and domestic workers on the other. In 1930 two-thirds of American homes had electricity and about a quarter of rural ones did. The Depression pulled both Americas into the same catastrophe with very different resources, and the system built in response was designed for the first America and excluded the second. Rural workers, service workers and care workers, the people who need retirement security most, have always been least served.","significance":"Industrial, urban and unionized America versus rural, agricultural and domestic America.","decline":null,"seed":7,"module":"crucible","projected":false,"master":true,"hand":"Black Tuesday · Great Depression 1929–39 → seed: 2 Americas (rich / rural)"},{"id":"m-elec-1930","lane":"culture","type":"tech","year":1930,"endYear":null,"title":"Two-thirds of homes are electrified, rural America is not","detail":"By 1930 roughly two-thirds of U.S. homes had electricity, but only about a quarter of rural residents did. The Rural Electrification Administration was created in 1935 to close the gap.","significance":"Two Americas in one statistic: the cities wired, the countryside waiting.","decline":null,"module":"crucible","projected":false,"master":true,"hand":"70%"},{"id":"crucible-soc-0","lane":"movements","type":"movement","year":1932,"endYear":null,"title":"Bonus Army","detail":"In the summer of 1932, thousands of World War I veterans and their families—by one estimate about 17,000 veterans and 26,000 others—camped in Washington to demand early payment of a bonus Congress had made payable in 1945. After the Senate rejected early payment on June 17, police shot two veterans on July 28, and President Hoover ordered the Army under General Douglas MacArthur to clear the camps, which were burned.","significance":"Troops routing veterans showed how a deferred promise to aging men could become a crisis of legitimacy; in 1936 Congress paid the bonus early over Roosevelt’s veto.","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"crucible-his-1","lane":"history","type":"history","year":1933,"endYear":null,"title":"The Depression’s floor","detail":"Unemployment exceeded 25 percent, roughly 10,000 banks had failed, and gross national product had fallen from $105 billion in 1929 to $55 billion in 1932. By 1934 more than half of older Americans lacked enough income to support themselves.","significance":"","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"crucible-soc-1","lane":"movements","type":"movement","year":1933,"endYear":1936,"title":"Townsend Movement","detail":"In early 1933 Dr. Francis Townsend, a 66-year-old retired physician in Long Beach, California, proposed a $200 monthly pension for every American 60 and older, financed by a 2 percent tax on business transactions and required to be spent within 30 days. Within about two years some 7,000 Townsend Clubs claimed more than 2.2 million members.","significance":"Economically impractical but politically undeniable, the movement helped prod Roosevelt toward Social Security, and its followers’ disappointment with the Act’s modest, earned benefits kept the pressure on.","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"crucible-soc-2","lane":"movements","type":"movement","year":1934,"endYear":1935,"title":"Share Our Wealth","detail":"Louisiana Senator Huey Long’s “Every Man a King” program proposed capping private fortunes, guaranteeing every family a basic standard of living, and paying a pension to everyone over 60. By 1935 the movement claimed 27,000 local clubs and 7.7 million members.","significance":"Alongside Townsend, it demonstrated that if Washington did not answer the old-age question, more radical answers were ready.","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"crucible-pol-1","lane":"policy","type":"legislation","year":1934,"endYear":1937,"title":"Railroad Retirement Acts","detail":"Congress passed the first federal railroad retirement law in 1934; the Supreme Court struck it down in Railroad Retirement Board v. Alton Railroad (1935). Replacement acts in 1935 and 1937 created a national industry program that began paying annuities in July 1936 and absorbed about 50,000 private railroad pensions.","significance":"A separate federal system for one industry, using age 65, helped set the threshold the Committee on Economic Security adopted—and showed how retirement protection could be organized around particular kinds of work (Two Americas, seed 7).","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"m-fha-1934","lane":"policy","type":"legislation","year":1934,"endYear":null,"title":"National Housing Act creates the FHA","detail":"Signed June 27, 1934, the act created the Federal Housing Administration to insure home mortgages. FHA underwriting treated racial mixing as a risk to property values: its 1938 manual told appraisers to check whether “incompatible racial and social groups are present” and said neighborhoods should stay “occupied by the same social and racial classes.” A sister agency, the Home Owners’ Loan Corporation (1933), drew the color-coded maps that gave redlining its name.","significance":"Home equity became the second pillar of middle-class retirement, and federal policy rationed it by race for a generation. The effects on family wealth outlived the rules.","decline":null,"module":"crucible","projected":false,"master":true,"hand":"’33 / ’34 FHA created. REDLINING. Housing shortage led to FHA. FHA → mandated segregation for new housing."},{"id":"lens-1935-2","lane":"lens","type":"lens","year":1935,"endYear":null,"title":"Two-Person Lens, 1935","detail":"","significance":"Social Security was designed for the 60-year-old's desperation but will be perfected for the 20-year-old's comfort.","decline":null,"module":"crucible","projected":false,"lens":"lens-1935-2"},{"id":"crucible-pol-2","lane":"policy","type":"legislation","year":1935,"endYear":null,"title":"Social Security Act","detail":"Signed by Franklin Roosevelt on August 14, 1935, the Act created federal old-age insurance (Title II), financed by a payroll tax of 1 percent each on employers and workers on the first $3,000 of annual wages beginning in 1937, alongside federal grants for means-tested state old-age assistance (Title I). Section 210(b) excluded agricultural labor, domestic service in private homes, government work, and nonprofit employment, among others. Planners chose 65 because about half of existing state pension systems used it, Railroad Retirement used it, and actuarial studies showed it could be financed with modest payroll taxes.","significance":"The floor against destitution the Depression demanded—and the moment Government Involvement (seed 2), 65 = Old and Done (seed 3), and Segregation & Boundaries (seed 1) were written into the same statute.","decline":null,"module":"crucible","projected":false,"master":true,"hand":"1935 Social Security Act ← Not for all · 65/Old · Gov’t"},{"id":"crucible-mar-1","lane":"markets","type":"crisis","year":1937,"endYear":1938,"title":"The Recession of 1937–38","detail":"Between May 1937 and June 1938 real GDP fell 10 percent, industrial production fell 32 percent, and unemployment climbed back to about 20 percent. Economists cite tighter monetary policy and fiscal tightening—including the first collection of Social Security payroll taxes in 1937—among the causes.","significance":"A new retirement tax arrived at the worst possible moment, an early lesson that how a pension system is financed has economy-wide consequences.","decline":"≈ −41% (Dow, monthly averages, Feb. 1937 – Apr. 1938)","module":"crucible","projected":false,"master":false,"hand":null},{"id":"crucible-pol-3","lane":"policy","type":"policy","year":1937,"endYear":null,"title":"Helvering v. Davis","detail":"On May 24, 1937, the Supreme Court upheld Social Security’s old-age benefits as a valid exercise of Congress’s power to tax and spend for the general welfare; Justice Benjamin Cardozo wrote for the majority over the dissents of Justices McReynolds and Butler. A companion case decided the same day, Steward Machine Co. v. Davis, upheld the Act’s unemployment-insurance tax.","significance":"Cardozo’s line that “the discretion belongs to Congress, unless the choice is clearly wrong” gave federal retirement policy its constitutional footing.","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"m-ww2","lane":"history","type":"history","year":1939,"endYear":1945,"title":"World War II","detail":"War began in Europe in September 1939. The United States entered after the attack on Pearl Harbor and fought until Japan’s surrender in 1945.","significance":"Full employment, wage controls and the push for employer pensions. The generation that fought it built the golden age of retirement.","decline":null,"module":"crucible","projected":false,"master":true,"hand":"WW2 1939–1945 · US in WW2"},{"id":"crucible-pol-4","lane":"policy","type":"legislation","year":1939,"endYear":null,"title":"Social Security Amendments of 1939","detail":"The amendments turned an individual retirement program into a family one, adding benefits for a retired worker’s wife and minor children and for survivors—widows, children, and dependent parents. They also moved the start of monthly benefits up to 1940 and cancelled a payroll-tax increase scheduled for that year.","significance":"Family benefits built the one-earner, male-breadwinner household into the system—the assumption the book later calls a “design specification.”","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"m-arroyo-1940","lane":"culture","type":"tech","year":1940,"endYear":null,"title":"The Arroyo Seco Parkway, the first freeway in the West","detail":"Dedicated December 30, 1940, between Los Angeles and Pasadena, it was California’s first freeway.","significance":"The car-and-freeway geography of the postwar suburbs, where much of the golden age’s home equity was built, starts here.","decline":null,"module":"crucible","projected":false,"master":true,"hand":"1940 Freeway Arroyo Secco"},{"id":"crucible-pol-5","lane":"policy","type":"policy","year":1940,"endYear":null,"title":"First monthly benefit check","detail":"On January 31, 1940, Ida May Fuller received the first monthly Social Security retirement check, for $22.54. She had paid $24.75 in payroll taxes over three years of covered work; she lived to 100 and collected $22,888.92 in benefits.","significance":"Early retirees received far more than they paid in—possible because, at the start, there were vastly more covered workers than beneficiaries, a demographic gift the book counts among the later anomaly’s pillars.","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"m-pearl-1941","lane":"history","type":"history","year":1941,"endYear":null,"title":"Pearl Harbor","detail":"Japan attacked the U.S. naval base at Pearl Harbor, Hawaii, on December 7, 1941, and the United States entered the war.","significance":"","decline":null,"module":"crucible","projected":false,"master":true,"hand":"1941 Pearl Harbor"},{"id":"crucible-his-2","lane":"history","type":"history","year":1942,"endYear":null,"title":"The National War Labor Board","detail":"Created by executive order on January 12, 1942, the Board limited raises under the “Little Steel formula,” keyed to a 15 percent rise in living costs since January 1941. With cash wages capped, fringe benefits became the currency of competition for workers.","significance":"","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"crucible-pol-6","lane":"policy","type":"legislation","year":1942,"endYear":null,"title":"Stabilization Act of 1942","detail":"Signed October 2, 1942, the Act directed the President to stabilize wages and salaries at their September 15, 1942 levels but excluded “insurance and pension benefits in a reasonable amount.” Barred from competing on pay, employers competing for scarce wartime labor offered pensions, health insurance, and paid vacations instead.","significance":"Pensions became a workaround to wage controls, planting The Promise (seed 8) as an employer fringe benefit rather than a public right.","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"crucible-pol-7","lane":"policy","type":"legislation","year":1942,"endYear":null,"title":"Revenue Act of 1942: qualified-plan rules","detail":"Some early-1940s plans covered only officers and managers, letting them defer tax on much of their income. The 1942 Act set the first requirements for a tax-“qualified” plan: it must exist for the exclusive benefit of employees, may not divert trust funds, and may not discriminate in favor of officers or highly paid workers. Congress left these statutory rules essentially unchanged until ERISA in 1974.","significance":"Tax deferral now came with conditions—but the subsidy still reached only workers whose employers chose to sponsor a plan.","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"crucible-his-3","lane":"history","type":"history","year":1944,"endYear":null,"title":"Bretton Woods","detail":"In July 1944, delegates from 44 nations created the International Monetary Fund and the World Bank and fixed the dollar to gold at $35 an ounce, anchoring a postwar order centered on the U.S. economy.","significance":"","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"crucible-pol-8","lane":"policy","type":"legislation","year":1944,"endYear":null,"title":"Servicemen’s Readjustment Act (GI Bill)","detail":"Signed June 22, 1944, the GI Bill funded education and training, unemployment pay, and loans for homes and businesses. About eight million veterans used its education benefits within seven years, and 4.3 million home loans worth $33 billion had been made by 1955.","significance":"It built the asset base—degrees and home equity—that would sit beside pensions in the postwar middle class, but its local administration made it a channel for Segregation & Boundaries (seed 1).","decline":null,"module":"crucible","projected":false,"master":true,"hand":"GI Bill. Often state admin of benefits. Racial seg states did not get $ owed housing + other."},{"id":"m-atom-1945","lane":"history","type":"history","year":1945,"endYear":null,"title":"The atomic bomb","detail":"The United States dropped atomic bombs on Hiroshima and Nagasaki in August 1945, and Japan surrendered weeks later.","significance":"The book’s Crucible chapter places it among the shocks the 1950 sixty-year-old carried into retirement.","decline":null,"module":"crucible","projected":false,"master":true,"hand":"Atom bomb"},{"id":"crucible-his-4","lane":"history","type":"history","year":1946,"endYear":null,"title":"The baby boom begins","detail":"The Census Bureau dates the baby boom to births from 1946 through 1964. Combined with a still-small pool of retirees, it helped put the ratio of covered workers to Social Security beneficiaries at 16.5 in 1950—the demographic dividend the book counts among the anomaly’s pillars.","significance":"","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"crucible-mar-2","lane":"markets","type":"crisis","year":1946,"endYear":null,"title":"Postwar reconversion slump","detail":"As the wartime economy reconverted, the S&P 500 fell 26.6 percent in about four months, and fell another 20.6 percent between June 1948 and June 1949. The Dow’s monthly average ended 1949 (196.62) roughly where it had begun 1946 (198.12).","significance":"Four flat, volatile years gave postwar workers little reason to trust individual stock portfolios with their old age—one reason the era’s security was built on pooled, employer-guaranteed pensions instead.","decline":"−26.6% (S&P 500, May 29 – Oct. 9, 1946)","module":"crucible","projected":false,"master":false,"hand":null},{"id":"m-coldwar","lane":"history","type":"history","year":1947,"endYear":1991,"title":"The Cold War","detail":"A four-decade rivalry between the United States and the Soviet Union, from the Truman Doctrine in 1947 to the Soviet collapse in 1991.","significance":"The book describes postwar anxiety and abundance as roommates; that mood made a secure retirement feel like the reward.","decline":null,"module":"crucible","projected":false,"master":true,"hand":"Cold War ’47–’91"},{"id":"crucible-pol-9","lane":"policy","type":"policy","year":1948,"endYear":null,"title":"Inland Steel: pensions become bargainable","detail":"In 1948 the National Labor Relations Board ruled that Inland Steel had to bargain with the United Steelworkers over its retirement plan. On September 23, 1948, the Seventh Circuit Court of Appeals upheld the ruling, reasoning that pensions are part of the wage structure and a condition of employment.","significance":"Once pensions were a mandatory subject of bargaining, unions could strike for them—opening the way to the 1949–1950 pension settlements in steel and autos.","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"crucible-soc-3","lane":"movements","type":"movement","year":1949,"endYear":1950,"title":"Labor’s pension drive","detail":"Armed with the Inland Steel ruling, unions made pensions a central demand: in September 1949 Ford agreed to pay the full cost of a funded plan paying $100 a month to workers with 30 years of service. After a steel strike that autumn, Bethlehem Steel’s October 31, 1949 settlement set a pattern of $100 a month at 65 with 25 years of service, again counting Social Security.","significance":"The Promise (seed 8) became a contract, stacking private pensions on top of Social Security and tying a worker’s old age to one employer’s long-term health.","decline":null,"module":"crucible","projected":false,"master":false,"hand":null},{"id":"lens-1950-3","lane":"lens","type":"lens","year":1950,"endYear":null,"title":"Two-Person Lens, 1950","detail":"","significance":"The 60-year-old who signed the contract knew exactly what they were buying; the 20-year-old who inherited it had no idea what it cost.","decline":null,"module":"crucible","projected":false,"lens":"lens-1950-3"},{"id":"note-middle","lane":"notes","type":"note","year":1950,"endYear":1975,"title":"Rise of the middle class","detail":"The postwar decades when the middle class grew fastest. The Climax chapter calls them an unrepeatable anomaly.","significance":"","decline":null,"color":"var(--t-culture)","module":"climax","projected":false,"master":true,"hand":"Rise of the middle class"},{"id":"climax-pol-0","lane":"policy","type":"legislation","year":1950,"endYear":null,"title":"Social Security Amendments of 1950","detail":"Signed by President Truman on August 28, 1950, the amendments raised benefits for current beneficiaries by an average of about 77 percent and extended coverage to roughly 10 million more people, including regularly employed farm and domestic workers and most of the nonfarm self-employed. State and local government and nonprofit employees could join on an elective basis.","significance":"Social Security moved from a modest floor toward an adequate base income—the leg of the stool that would carry the most weight and outlast the others.","decline":null,"module":"climax","projected":false,"master":false,"hand":null},{"id":"climax-pol-1","lane":"policy","type":"policy","year":1950,"endYear":null,"title":"The “Treaty of Detroit”","detail":"On May 23, 1950, General Motors and the United Auto Workers reached a five-year contract—a private collective-bargaining agreement—that included a fully funded pension of $125 a month counting Social Security, continued cost-of-living raises, and GM payment of half the cost of health coverage. Fortune magazine dubbed it the “Treaty of Detroit.”","significance":"The Promise (seed 8) in its purest form: long-term security in exchange for labor peace, tying a worker’s old age to one company’s fortunes.","decline":null,"module":"climax","projected":false,"master":false,"hand":null},{"id":"seed-8","lane":"seeds","type":"seed","year":1950,"endYear":null,"title":"Seed 8: The Promise","detail":"The author plants the Promise at 1950, beside his sketch of the three-legged stool: Social Security, an employer pension and personal savings, with the words “for some…” The corporate pension era made the promise tangible: work here for thirty years and we will take care of you. A promise made at that scale, and believed at that scale, creates an expectation that cannot be quietly withdrawn. When the system began failing, it didn’t feel like a policy adjustment. It felt like betrayal, which is a moral category, not just an economic one.","significance":"\"Work here thirty years and we'll take care of you.\"","decline":null,"seed":8,"module":"climax","projected":false,"master":true,"hand":"Promise — 3 leg stool (for some…)"},{"id":"m-brown-1954","lane":"history","type":"history","year":1954,"endYear":null,"title":"Brown v. Board of Education","detail":"On May 17, 1954, the Supreme Court ruled that state-mandated segregation of public schools violates the Fourteenth Amendment.","significance":"Education is now one of the strongest predictors of household wealth. Who could attend which schools shaped who would later retire securely.","decline":null,"module":"climax","projected":false,"master":true,"hand":"Brown v Board of Education ’54"},{"id":"m-civil-rights","lane":"movements","type":"movement","year":1954,"endYear":1968,"title":"The civil rights movement","detail":"From the Montgomery bus boycott to the Civil Rights, Voting Rights and Fair Housing Acts, a mass movement dismantled legal segregation.","significance":"Won formal equality, while systems built on earlier exclusions, in housing and in retirement, kept compounding.","decline":null,"module":"climax","projected":false,"master":true,"hand":"Civil Rights Movement"},{"id":"climax-pol-2","lane":"policy","type":"legislation","year":1956,"endYear":null,"title":"Disability insurance and early retirement","detail":"After a 1954 “disability freeze” protected the records of disabled workers, the 1956 amendments paid cash benefits to disabled workers aged 50–64 and to disabled adult children. They also let women claim reduced retirement benefits at 62; the 1961 amendments extended the age-62 option to men.","significance":"Age 62 created an earlier exit ramp without retiring the cultural meaning of 65—seed 3 now had a soft and a hard boundary.","decline":null,"module":"climax","projected":false,"master":false,"hand":null},{"id":"m-sputnik-1957","lane":"history","type":"history","year":1957,"endYear":null,"title":"Sputnik and the space race","detail":"The Soviet Union launched Sputnik, the first artificial satellite, on October 4, 1957.","significance":"","decline":null,"module":"climax","projected":false,"master":true,"hand":"Space race · Sputnik ’57"},{"id":"climax-soc-0","lane":"movements","type":"movement","year":1958,"endYear":null,"title":"AARP","detail":"Retired teacher Ethel Percy Andrus, who had founded the National Retired Teachers Association in 1947, incorporated the American Association of Retired Persons on July 1, 1958, after hundreds of non-teachers wrote asking for access to affordable health insurance.","significance":"Retirees became an organized constituency—a consumer market and, before long, one of the most influential lobbies in American politics.","decline":null,"module":"climax","projected":false,"master":false,"hand":null},{"id":"climax-his-0","lane":"history","type":"history","year":1960,"endYear":null,"title":"The demographic dividend shrinks","detail":"The ratio of covered workers to Social Security beneficiaries fell from 16.5 in 1950 to 5.1 in 1960 and 3.2 by 1980 as the program matured. Meanwhile a man reaching 65 could expect about 13.1 more years in 1950 and 14.6 in 1980; a woman, 16.2 and 19.1.","significance":"","decline":null,"module":"climax","projected":false,"master":false,"hand":null},{"id":"lens-1960-4","lane":"lens","type":"lens","year":1960,"endYear":null,"title":"Two-Person Lens, 1960","detail":"","significance":"This is the moment the retirement promise looks most stable, just as the conditions that made it possible begin to erode.","decline":null,"module":"climax","projected":false,"lens":"lens-1960-4"},{"id":"climax-mar-0","lane":"markets","type":"crisis","year":1961,"endYear":1962,"title":"The Kennedy Slide","detail":"Stocks fell 28 percent in about six months in the middle of the postwar boom. The S&P 500 regained its prior high in September 1963.","significance":"A quick recovery reinforced the era’s belief that markets bend but do not break—while most workers’ retirement income still came from pooled, guaranteed sources.","decline":"−28.0% (S&P 500, Dec. 12, 1961 – June 26, 1962)","module":"climax","projected":false,"master":false,"hand":null},{"id":"climax-soc-1","lane":"movements","type":"movement","year":1961,"endYear":1965,"title":"National Council of Senior Citizens and the Medicare campaign","detail":"Formally announced in July 1961 with seed money from the AFL-CIO and unions such as the UAW and Steelworkers, the NCSC organized union retirees through rallies—including a televised event at Madison Square Garden—letter-writing, and pressure on opponents to win health insurance for the aged.","significance":"Organized labor carried its fight for security beyond the bargaining table into national politics, helping deliver Medicare in 1965.","decline":null,"module":"climax","projected":false,"master":false,"hand":null},{"id":"m-cuba-1962","lane":"history","type":"history","year":1962,"endYear":null,"title":"The Cuban Missile Crisis","detail":"In October 1962 the United States and the Soviet Union came to the brink of nuclear war over Soviet missiles in Cuba.","significance":"","decline":null,"module":"climax","projected":false,"master":true,"hand":"Cuban missile crisis ’62"},{"id":"m-jfk-1963","lane":"history","type":"history","year":1963,"endYear":null,"title":"President Kennedy is assassinated","detail":"John F. Kennedy was assassinated in Dallas on November 22, 1963.","significance":"","decline":null,"module":"climax","projected":false,"master":true,"hand":"JFK"},{"id":"m-equal-pay-1963","lane":"policy","type":"legislation","year":1963,"endYear":null,"title":"Equal Pay Act","detail":"Signed June 10, 1963, the act required equal pay for women and men doing substantially equal work in the same workplace.","significance":"Wages drive savings, pensions and Social Security benefits. A pay gap becomes a retirement gap.","decline":null,"module":"climax","projected":false,"master":true,"hand":"Equal Pay Act"},{"id":"m-beatles","lane":"culture","type":"culture","year":1964,"endYear":1970,"title":"The Beatles era","detail":"The Beatles’ February 1964 appearance on The Ed Sullivan Show set off Beatlemania in the United States. The band broke up in 1970.","significance":"","decline":null,"module":"climax","projected":false,"master":true,"hand":"The Beatles Era"},{"id":"climax-his-1","lane":"history","type":"history","year":1964,"endYear":null,"title":"Civil Rights Act","detail":"Signed July 2, 1964, the Act’s Title VII prohibited employment discrimination based on race, color, religion, sex, or national origin and created the Equal Employment Opportunity Commission.","significance":"","decline":null,"module":"climax","projected":false,"master":true,"hand":"Civil Rights Act"},{"id":"m-vietnam","lane":"history","type":"history","year":1965,"endYear":1973,"title":"The Vietnam War","detail":"U.S. combat troops arrived in Vietnam in 1965 and the last left in 1973. Saigon fell in 1975.","significance":"The Climax chapter names Vietnam and Watergate as what corroded the institutional trust that collective promises depend on.","decline":null,"module":"climax","projected":false,"master":true,"hand":"Vietnam War"},{"id":"note-stool","lane":"notes","type":"note","year":1965,"endYear":1980,"title":"“3-legged stool”: Gov’t · Pension · Savings","detail":"The three sources meant to carry retirement: Social Security, an employer pension and personal savings. His seed note adds: “for some…”","significance":"","decline":null,"color":"var(--t-seed)","module":"climax","projected":false,"master":true,"hand":"“3-legged stool”: Gov’t · Pension · Savings"},{"id":"climax-pol-3","lane":"policy","type":"legislation","year":1965,"endYear":null,"title":"Medicare and Medicaid","detail":"President Johnson signed the law on July 30, 1965, at the Truman Library in Independence, Missouri, and Harry Truman became Medicare’s first enrollee. Nearly 20 million beneficiaries enrolled in Medicare in its first three years.","significance":"The third leg of the stool: the book argues medical catastrophe had been retirement’s hidden enemy, and Medicare armored older households against it.","decline":null,"module":"climax","projected":false,"master":true,"hand":"Medicare + Medicaid"},{"id":"m-summer-love","lane":"culture","type":"culture","year":1967,"endYear":null,"title":"The Summer of Love","detail":"In 1967 tens of thousands of young people gathered in San Francisco’s Haight-Ashbury, the high point of the counterculture.","significance":"","decline":null,"module":"climax","projected":false,"master":true,"hand":"Summer of Love"},{"id":"climax-pol-4","lane":"policy","type":"legislation","year":1967,"endYear":null,"title":"Age Discrimination in Employment Act","detail":"The ADEA barred employment discrimination against workers aged 40 to 65. Congress raised the upper limit to 70 in 1978 and eliminated it in 1986, ending most mandatory retirement.","significance":"As first written, the law protected workers only until 65—quietly confirming 65 = Old and Done (seed 3) even as it fought age bias.","decline":null,"module":"climax","projected":false,"master":false,"hand":null},{"id":"m-mlk-1968","lane":"history","type":"history","year":1968,"endYear":null,"title":"Martin Luther King Jr. is assassinated","detail":"King was assassinated in Memphis on April 4, 1968. Congress passed the Fair Housing Act a week later.","significance":"","decline":null,"module":"climax","projected":false,"master":true,"hand":"MLK"},{"id":"climax-mar-1","lane":"markets","type":"crisis","year":1968,"endYear":1970,"title":"The 1968–70 bear market","detail":"As inflation rose and the economy slid into the 1969–70 recession, the S&P 500 lost more than a third of its value. It did not break even until March 1972.","significance":"For anyone counting on stocks, it was the first serious postwar test of the Market Growth seed (4); most workers’ retirement income still came from guaranteed sources.","decline":"−36.1% (S&P 500, Nov. 29, 1968 – May 26, 1970)","module":"climax","projected":false,"master":false,"hand":null},{"id":"m-fair-housing-1968","lane":"policy","type":"legislation","year":1968,"endYear":null,"title":"Fair Housing Act","detail":"Signed April 11, 1968, Title VIII of the Civil Rights Act of 1968 banned discrimination in the sale, rental and financing of housing.","significance":"Outlawed redlining going forward, but could not return the decades of home equity families had been denied.","decline":null,"module":"climax","projected":false,"master":true,"hand":"’68 Fair Housing Act to end REDLINING"},{"id":"m-moon-1969","lane":"culture","type":"tech","year":1969,"endYear":null,"title":"The Moon landing","detail":"Apollo 11 landed on the Moon on July 20, 1969.","significance":"A high point of postwar confidence in what large institutions could do.","decline":null,"module":"climax","projected":false,"master":true,"hand":"Moon landing"},{"id":"climax-soc-2","lane":"movements","type":"movement","year":1970,"endYear":null,"title":"Gray Panthers","detail":"Forced to retire from her job with the Presbyterian Church at 65 in 1970, Maggie Kuhn and friends in similar circumstances founded the group that became the Gray Panthers. It campaigned on pension rights and age discrimination under the banner of “young and old together.”","significance":"The first organized challenge to 65 = Old and Done (seed 3); the movement helped bring about the end of most forced-retirement rules.","decline":null,"module":"climax","projected":false,"master":false,"hand":null},{"id":"climax-his-2","lane":"history","type":"history","year":1971,"endYear":null,"title":"The Nixon shock","detail":"On August 15, 1971, President Nixon ended the dollar’s convertibility to gold, imposed a 90-day wage and price freeze, and added a 10 percent import surcharge. The Bretton Woods system that had anchored the postwar order soon collapsed.","significance":"","decline":null,"module":"climax","projected":false,"master":false,"hand":null},{"id":"m-watergate","lane":"history","type":"history","year":1972,"endYear":1974,"title":"Watergate","detail":"The June 1972 break-in at the Democratic National Committee’s offices led to President Nixon’s resignation on August 9, 1974.","significance":"With Vietnam, the book’s example of trust in institutions eroding just as retirement depended on it.","decline":null,"module":"climax","projected":false,"master":true,"hand":"Watergate"},{"id":"climax-pol-5","lane":"policy","type":"legislation","year":1972,"endYear":null,"title":"Social Security Amendments of 1972","detail":"A July 1972 law raised benefits 20 percent and created automatic cost-of-living adjustments, first paid in January 1975. An October 1972 law created Supplemental Security Income (SSI), a federal means-tested benefit for aged, blind, and disabled people that began January 1, 1974.","significance":"The book calls automatic COLAs the high-water mark of the program’s ambition: for the first time, inflation could not quietly erode a promised benefit.","decline":null,"module":"climax","projected":false,"master":false,"hand":null},{"id":"climax-his-3","lane":"history","type":"history","year":1973,"endYear":1974,"title":"The oil embargo","detail":"Arab oil producers embargoed the United States from October 19, 1973, to March 1974, and the price of oil nearly quadrupled, from about $2.90 to $11.65 a barrel. The book reads the embargo as the announcement that cheap energy—one of its five economic pillars—had ended.","significance":"","decline":null,"module":"climax","projected":false,"master":false,"hand":null},{"id":"climax-mar-2","lane":"markets","type":"crisis","year":1973,"endYear":1974,"title":"The oil-shock bear market","detail":"The oil embargo, accelerating inflation, and recession drove the S&P 500 down by nearly half; ERISA was signed a month before the bottom. The index did not regain its 1973 high until July 1980, and with inflation above 11 percent in 1974, real losses ran deeper still.","significance":"Pension sponsors watched invested assets shrink just as ERISA’s new funding standards arrived—pressure the book links to the corporate appetite for alternatives such as the 401(k).","decline":"−48.2% (S&P 500, Jan. 11, 1973 – Oct. 3, 1974)","module":"climax","projected":false,"master":false,"hand":null},{"id":"climax-pol-6","lane":"policy","type":"legislation","year":1974,"endYear":null,"title":"Employee Retirement Income Security Act (ERISA)","detail":"Signed by President Ford on September 2, 1974, ERISA set federal standards for private-plan reporting, funding, participation, vesting, and fiduciary conduct and created the Pension Benefit Guaranty Corporation to insure defined-benefit pensions. It also created the individual retirement account for workers without an employer plan, with deductible contributions up to the lesser of $1,500 or 15 percent of earnings.","significance":"ERISA protected The Promise after Studebaker—but its IRA quietly introduced the individual account into federal retirement policy.","decline":null,"module":"climax","projected":false,"master":true,"hand":"ERISA · IRA"},{"id":"m-ecoa-1974","lane":"policy","type":"legislation","year":1974,"endYear":null,"title":"Equal Credit Opportunity Act","detail":"Signed October 28, 1974, and effective in 1975, the act barred lenders from discriminating on the basis of sex or marital status; 1976 amendments added race, color, religion, national origin and age. Before it, lenders often refused women credit in their own names or required a husband’s signature.","significance":"Credit in your own name comes before owning a home or a business, two of the main ways families build wealth for later life.","decline":null,"module":"climax","projected":false,"master":true,"hand":"Equal Credit Opportunity Act. Women get the right to have bank acct + credit + loans w/o male co-signer."},{"id":"m-microsoft-1975","lane":"culture","type":"tech","year":1975,"endYear":null,"title":"Microsoft is founded","detail":"Bill Gates and Paul Allen founded Microsoft on April 4, 1975.","significance":"","decline":null,"module":"climax","projected":false,"master":true,"hand":"Microsoft ’75"},{"id":"m-apple-1976","lane":"culture","type":"tech","year":1976,"endYear":null,"title":"Apple Computer is founded","detail":"Steve Jobs, Steve Wozniak and Ronald Wayne founded Apple Computer on April 1, 1976.","significance":"","decline":null,"module":"climax","projected":false,"master":true,"hand":"Apple Computer ’76"},{"id":"climax-his-4","lane":"markets","type":"money","year":1976,"endYear":null,"title":"The first index fund for individual investors","detail":"John Bogle launched the First Index Investment Trust (now the Vanguard 500 Index Fund) on August 31, 1976. It hoped to raise $50–150 million and raised a little more than $11 million, an outcome Bogle called “an abject failure.”","significance":"","decline":null,"module":"climax","projected":false,"master":false,"hand":null},{"id":"climax-pol-7","lane":"policy","type":"legislation","year":1977,"endYear":null,"title":"Social Security Amendments of 1977","detail":"Stagflation had exposed a flaw in the 1972 COLA method that over-indexed benefits for new retirees and threatened solvency. The 1977 amendments raised payroll taxes and the taxable wage base, slightly reduced future benefits, and switched to wage indexing, with a transition that produced the so-called “notch” for people born in 1917–1921.","significance":"The first major retrenchment: the anomaly’s arithmetic had to be repaired, and the people who paid were the cohort about to retire.","decline":null,"module":"climax","projected":false,"master":false,"hand":null},{"id":"m-cra-1977","lane":"policy","type":"legislation","year":1977,"endYear":null,"title":"Community Reinvestment Act","detail":"Signed October 12, 1977, the act requires federal regulators to assess whether banks meet the credit needs of their whole communities, including low- and moderate-income neighborhoods.","significance":"The third step in the redlining thread: from drawing the lines (1930s), to banning them (1968), to requiring lending inside them (1977).","decline":null,"module":"climax","projected":false,"master":true,"hand":"’77 Community Reinvestment Act — combat REDLINING"},{"id":"climax-pol-8","lane":"policy","type":"legislation","year":1978,"endYear":null,"title":"Revenue Act of 1978: Section 401(k)","detail":"Signed by President Carter on November 6, 1978, a tax bill added Section 401(k) to the Internal Revenue Code, effective January 1, 1980, letting employees defer part of their pay into qualified plans before tax. The same law created simplified employee pensions (SEPs).","significance":"Grimm writes that the rules of the game were rewritten in 1978 and the players were not informed; historians of the provision note it was not designed to replace pensions.","decline":null,"module":"climax","projected":false,"master":true,"hand":"401K → seed: Individualism"},{"id":"climax-his-5","lane":"history","type":"history","year":1979,"endYear":1980,"title":"Stagflation peaks","detail":"U.S. consumer-price inflation reached 11.1 percent in 1974, 11.3 percent in 1979, and 13.5 percent in 1980, alongside weak growth. Fixed incomes without cost-of-living protection lost purchasing power rapidly.","significance":"","decline":null,"module":"climax","projected":false,"master":false,"hand":null},{"id":"m-iran-1979","lane":"history","type":"history","year":1979,"endYear":1982,"title":"Iran, the energy crisis and the early-1980s recession","detail":"The Iranian Revolution sent oil prices soaring in 1979. To break double-digit inflation the Federal Reserve pushed interest rates to record highs (the prime rate reached 21.5 percent), and unemployment hit 10.8 percent in late 1982, the highest since the Great Depression.","significance":"High rates and inflation strained pensions and household budgets just as the 401(k) arrived.","decline":null,"module":"climax","projected":false,"master":true,"hand":"Iran · Energy crisis ’79–’82 · High % rate → Worst recession since Great Depression. ↑ Unemploy · ↑ Inflation · Global crisis."},{"id":"grimm-pension-peak","lane":"policy","type":"policy","year":1979,"endYear":null,"title":"Pension coverage peaks","detail":"About 38% of private-sector wage and salary workers participated in a defined-benefit pension in 1979, the high-water mark (EBRI). The share declines nearly every year afterward.","significance":"The people who believe retirement works are largely those who entered the workforce in this narrow window.","decline":null,"module":"climax","projected":false},{"id":"lens-1980-5","lane":"lens","type":"lens","year":1980,"endYear":null,"title":"Two-Person Lens, 1980","detail":"","significance":"In 1980 the 60-year-old was cashing out a promise; the 20-year-old was being handed a calculator and told “good luck.”","decline":null,"module":"climax","projected":false,"lens":"lens-1980-5"},{"id":"codify-mar-0","lane":"markets","type":"crisis","year":1980,"endYear":1982,"title":"The Volcker-era bear market","detail":"As inflation peaked at 13.5 percent in 1980 and the Federal Reserve tightened to break it, stocks fell for nearly two years. The S&P 500 regained its prior high by November 1982, launching a long bull market.","significance":"The first 401(k) plans opened near a market bottom, so early participants experienced the model at its most flattering.","decline":"−27.1% (S&P 500, Nov. 28, 1980 – Aug. 12, 1982)","module":"codify","projected":false,"master":false,"hand":null},{"id":"codify-his-1","lane":"markets","type":"money","year":1980,"endYear":2010,"title":"The mutual-fund boom","detail":"Mutual-fund assets grew from $134.8 billion across 564 funds in 1980 to $11.8 trillion across more than 7,500 funds in 2010. Defined-contribution plan assets grew from $162 billion to $3.8 trillion over the same span.","significance":"","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"codify-soc-0","lane":"movements","type":"movement","year":1980,"endYear":null,"title":"Older Women’s League (OWL)","detail":"Founded by Tish Sommers and Laurie Shields after an October 1980 White House mini-conference on older women in Des Moines, OWL organized around the economic and retirement security of midlife and older women. It successfully advocated for the Retirement Equity Act of 1984.","significance":"Named the gap the one-earner design left for divorced, widowed, and caregiving women, and won a statutory repair.","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"note-chains","lane":"notes","type":"note","year":1980,"endYear":1989,"title":"80’s chain restaurant phenomenon","detail":"The Collapse chapter returns to these chains as a “you’re supposed to” one generation built and the next quietly refused.","significance":"","decline":null,"color":"var(--t-culture)","module":"codify","projected":false,"master":true,"hand":"80’s chain restaurant phenomenon"},{"id":"m-didmca-1980","lane":"policy","type":"legislation","year":1980,"endYear":null,"title":"Bank deregulation (DIDMCA)","detail":"Signed March 31, 1980, the Depository Institutions Deregulation and Monetary Control Act began phasing out federal ceilings on the interest banks could pay depositors (Regulation Q).","significance":"Opened the competition for savers’ money that market-based retirement products would win.","decline":null,"module":"codify","projected":false,"master":true,"hand":"1980 Bank deregulation DIDMCA"},{"id":"codify-his-0","lane":"history","type":"history","year":1981,"endYear":null,"title":"Reagan, Thatcher, and the new individualism","detail":"Reagan’s first inaugural declared that “in this present crisis, government is not the solution to our problem; government is the problem.” In a 1987 interview with Woman’s Own, Margaret Thatcher said “there is no such thing as society”—a line she later complained was quoted without her point that people also owe duties to their neighbors.","significance":"","decline":null,"module":"codify","projected":false,"master":true,"hand":"Reagan + Thatcher"},{"id":"codify-pol-0","lane":"policy","type":"legislation","year":1981,"endYear":null,"title":"Economic Recovery Tax Act (ERTA)","detail":"Signed by President Reagan on August 13, 1981, at his California ranch, ERTA cut marginal income-tax rates and opened IRAs to every worker, raising the annual limit to the lesser of $2,000 or 100 percent of earnings ($2,250 for a worker with a nonworking spouse). IRA participation rose quickly afterward.","significance":"Tax policy began treating every worker as an individual saver—Individualism (seed 9) written into the code in its arrival year.","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"codify-pol-1","lane":"policy","type":"policy","year":1981,"endYear":null,"title":"IRS issues 401(k) regulations","detail":"Section 401(k) had taken effect January 1, 1980, but employers hesitated until the IRS issued regulations on November 10, 1981, clarifying that employees could defer part of their salary before tax. Benefits consultant Ted Benna’s firm, the Johnson Companies, adopted an early plan in 1981, and many large employers’ plans began operating in January 1982.","significance":"The administrative date many call the 401(k)’s birthday; historians of the provision note it was not designed to replace pensions—which is exactly what the book says it came to do.","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"seed-9","lane":"seeds","type":"seed","year":1981,"endYear":null,"title":"Seed 9: Individualism","detail":"The first 401(k) plans, launched in 1981, completed the ideological shift: collective retirement security became individual retirement responsibility. The politics of the era supplied the philosophy, the 401(k) supplied the mechanism, and the financial services industry supplied the marketing. The book calls it the most consequential seed because it converts every systemic failure into a personal one. The plan didn't fail you. You failed the plan.","significance":"Collective security becomes personal responsibility.","decline":null,"seed":9,"module":"codify","projected":false,"master":true,"hand":"401K → seed: Individualism"},{"id":"note-prominence","lane":"notes","type":"note","year":1982,"endYear":1999,"title":"Market prominence: individuals in · new Roaring 20’s · retirement accts · wild west · movies!","detail":"Markets move to the center of ordinary financial life.","significance":"","decline":null,"color":"var(--t-crisis)","module":"codify","projected":false,"master":true,"hand":"Market prominence: individuals in · new Roaring 20’s · retirement accts · wild west · movies!"},{"id":"note-1665","lane":"notes","type":"note","year":1982,"endYear":2000,"title":"Market +16.65%","detail":"His note on the long bull market. For reference, the S&P 500 rose from 102.42 (Aug. 12, 1982) to 1,527.46 (Mar. 24, 2000), about 16.6% a year in price alone.","significance":"","decline":null,"color":"var(--t-money)","module":"codify","projected":false,"master":true,"hand":"Market +16.65%"},{"id":"codify-soc-1","lane":"movements","type":"movement","year":1983,"endYear":1994,"title":"The “Notch Baby” campaign","detail":"From the early 1980s, people born in 1917–1921 organized against benefits that, after the 1977 amendments, were lower than those of people born just before them; more than 100 bills were introduced, but none became law. In December 1994 a congressionally created commission concluded that the benefits were equitable and that no remedy was warranted.","significance":"A grievance about formula design became a durable movement—proof of how personally Americans now experienced Social Security as a promise.","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"codify-pol-2","lane":"policy","type":"legislation","year":1983,"endYear":null,"title":"Social Security Amendments of 1983","detail":"Signed April 20, 1983, after the Greenspan Commission reported in January 1983 that the retirement trust fund could run out of money as early as August 1983, the law made up to half of benefits taxable above $25,000 (single) or $32,000 (joint) of income, delayed a COLA, covered new federal employees, and accelerated payroll-tax increases. It also raised the full retirement age in two stages from 65 to 67, beginning with people born in 1938 and fully phased in for those born in 1960 or later.","significance":"The first time Washington moved the retirement age—quietly loosening 65 = Old and Done (seed 3) by statute while the culture kept the number.","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"codify-pol-3","lane":"policy","type":"legislation","year":1984,"endYear":null,"title":"Retirement Equity Act","detail":"The law lowered the minimum age for pension-plan participation from 25 to 21, required a spouse’s written consent before a worker could waive survivor benefits, and stopped counting a one-year maternity or paternity leave as a break in service. The Older Women’s League advocated for it.","significance":"A rare repair to the one-earner “design specification,” acknowledging that women’s security had depended on husbands’ choices.","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"lens-1985-6","lane":"lens","type":"lens","year":1985,"endYear":null,"title":"Two-Person Lens, 1985","detail":"","significance":"The 60-year-old is cashing out a promise made in a different economic era. The 20-year-old is being handed a calculator and told good luck.","decline":null,"module":"codify","projected":false,"lens":"lens-1985-6"},{"id":"note-industry","lane":"notes","type":"note","year":1985,"endYear":1995,"title":"Industry to support transfer","detail":"An industry grew up to manage the transfer of retirement risk from employers to individuals, the Codify chapter’s “game” and “industry.”","significance":"","decline":null,"color":"var(--t-money)","module":"codify","projected":false,"master":true,"hand":"Industry to support transfer"},{"id":"codify-pol-4","lane":"policy","type":"legislation","year":1986,"endYear":null,"title":"Tax Reform Act of 1986","detail":"TRA ’86 imposed a $7,000 annual cap on pre-tax 401(k) deferrals beginning in 1987, tightened nondiscrimination testing, required faster vesting, and limited deductible IRA contributions for workers covered by employer plans above income thresholds. The share of tax filers with wage income making deductible IRA contributions fell from 18.6 percent in 1985 to 4.2 percent by 1995.","significance":"Shows how sensitive individual saving is to tax design—and how quickly voluntary participation falls when incentives change.","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"codify-mar-1","lane":"markets","type":"crisis","year":1987,"endYear":null,"title":"Black Monday","detail":"The Dow fell 508 points, or 22.6 percent, on October 19, 1987—still its largest one-day percentage loss. The Fed promised liquidity the next morning, and stocks surpassed their pre-crash highs in less than two years.","significance":"A fast recovery reinforced the Market Growth seed (4): crashes looked like buying opportunities to anyone with decades left to wait.","decline":"−22.6% in one day (Dow, Oct. 19, 1987); −33.5% (S&P 500, Aug. 25 – Dec. 4, 1987)","module":"codify","projected":false,"master":true,"hand":"S+P500 ’82 $102 → ’87 $336: 3x ↑, then ↓ 30% drop. Black Monday."},{"id":"m-wboa-1988","lane":"policy","type":"legislation","year":1988,"endYear":null,"title":"Women’s Business Ownership Act","detail":"Signed October 25, 1988, the act ended the need for a husband or male relative to co-sign a woman’s business loan, and created the Women’s Business Center program and the National Women’s Business Council.","significance":"Business ownership is a path to wealth outside the paycheck-and-pension track.","decline":null,"module":"codify","projected":false,"master":true,"hand":"Women can get business loan w/o male co-signer. Business Ownership Act."},{"id":"m-cnbc-1989","lane":"culture","type":"culture","year":1989,"endYear":null,"title":"CNBC launches","detail":"CNBC began broadcasting on April 17, 1989, bringing all-day business news and live market prices into living rooms.","significance":"Money becomes television: fuel for both the Market Growth and Get Rich Quick seeds.","decline":null,"module":"codify","projected":false,"master":true,"hand":"’89 CNBC $TV"},{"id":"m-gulf-war","lane":"history","type":"history","year":1990,"endYear":1991,"title":"The Gulf War","detail":"Iraq invaded Kuwait on August 2, 1990. A U.S.-led coalition drove Iraqi forces out by the end of February 1991.","significance":"","decline":null,"module":"codify","projected":false,"master":true,"hand":"Gulf War"},{"id":"m-www-1991","lane":"culture","type":"tech","year":1991,"endYear":null,"title":"The World Wide Web goes public","detail":"Tim Berners-Lee’s World Wide Web became publicly available in August 1991, and CERN released it royalty-free in April 1993.","significance":"","decline":null,"module":"codify","projected":false,"master":true,"hand":"World Wide Web"},{"id":"m-ussr-1991","lane":"history","type":"history","year":1991,"endYear":null,"title":"The end of the Soviet Union","detail":"The Soviet Union dissolved on December 26, 1991, ending the Cold War.","significance":"Market capitalism without a rival, the backdrop for the 1990s’ faith in markets.","decline":null,"module":"codify","projected":false,"master":true,"hand":"’91 End of Soviet Union"},{"id":"m-la-1992","lane":"history","type":"history","year":1992,"endYear":null,"title":"The Los Angeles riots","detail":"The March 1991 police beating of Rodney King was caught on video. The acquittal of the officers in April 1992 set off days of unrest in Los Angeles.","significance":"","decline":null,"module":"codify","projected":false,"master":true,"hand":"LA Riots · Rodney King"},{"id":"m-wtc-1993","lane":"history","type":"history","year":1993,"endYear":null,"title":"The World Trade Center truck bombing","detail":"A truck bomb exploded beneath the North Tower of the World Trade Center on February 26, 1993, killing six people.","significance":"","decline":null,"module":"codify","projected":false,"master":true,"hand":"Truck · World Trade"},{"id":"m-waco-1993","lane":"history","type":"history","year":1993,"endYear":null,"title":"The Waco siege","detail":"A 51-day standoff between federal agents and the Branch Davidians near Waco, Texas, ended in a fire on April 19, 1993.","significance":"","decline":null,"module":"codify","projected":false,"master":true,"hand":"Waco TX"},{"id":"m-dadt-1993","lane":"history","type":"history","year":1993,"endYear":null,"title":"“Don’t Ask, Don’t Tell”","detail":"The 1993 policy barred openly gay, lesbian and bisexual people from military service while ending questioning about orientation. It was repealed in 2011.","significance":"","decline":null,"module":"codify","projected":false,"master":true,"hand":"’93 Don’t Ask Don’t Tell"},{"id":"note-model","lane":"notes","type":"note","year":1993,"endYear":2000,"title":"Retirement model vs anomaly","detail":"The book’s central question for the Codify era: was the golden age a model to copy, or an anomaly that could not be repeated?","significance":"","decline":null,"color":"var(--t-money)","module":"codify","projected":false,"master":true,"hand":"Retirement model vs anomaly"},{"id":"m-amazon-1994","lane":"culture","type":"tech","year":1994,"endYear":null,"title":"Amazon is founded","detail":"Jeff Bezos founded Amazon in July 1994 as an online bookstore.","significance":"","decline":null,"module":"codify","projected":false,"master":true,"hand":"Amazon ’94"},{"id":"codify-his-2","lane":"history","type":"history","year":1994,"endYear":null,"title":"Contract with America","detail":"Released September 27, 1994, the House Republican platform included a “Senior Citizens Fairness Act” to raise the Social Security earnings limit, repeal the 1993 increase in the taxation of benefits, and create tax incentives for private long-term-care insurance.","significance":"","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"m-oj-1995","lane":"culture","type":"culture","year":1995,"endYear":null,"title":"The O.J. Simpson trial","detail":"The televised murder trial of O.J. Simpson ended in an acquittal on October 3, 1995, one of the most-watched events of the decade.","significance":"","decline":null,"module":"codify","projected":false,"master":true,"hand":"OJ"},{"id":"m-okc-1995","lane":"history","type":"history","year":1995,"endYear":null,"title":"The Oklahoma City bombing","detail":"A truck bomb destroyed the Alfred P. Murrah Federal Building in Oklahoma City on April 19, 1995, killing 168 people.","significance":"","decline":null,"module":"codify","projected":false,"master":true,"hand":"OKC bomb"},{"id":"m-asia-1997","lane":"markets","type":"crisis","year":1997,"endYear":null,"title":"The Asian financial crisis reaches Wall Street","detail":"Currency collapses that began in Thailand in July 1997 spread across East Asia. On October 27 the Dow fell 554 points, and market-wide circuit breakers halted U.S. trading for the first time.","significance":"A “mini panic” the long bull market quickly absorbed, teaching a generation of 401(k) savers that dips are buying opportunities.","decline":"−7.18% in one day (Dow, Oct. 27, 1997)","module":"codify","projected":false,"master":true,"hand":"’97 Asian $ crisis — mini panic"},{"id":"codify-pol-5","lane":"policy","type":"legislation","year":1997,"endYear":null,"title":"Taxpayer Relief Act: the Roth IRA","detail":"Signed by President Clinton on August 5, 1997, the law created the Roth IRA, effective January 1, 1998: contributions are made after tax and qualified withdrawals are tax-free. It also raised income limits for deductible traditional IRAs and allowed penalty-free withdrawals for higher education and first-home purchases.","significance":"Another individual account, another tax choice for the saver to optimize—the system grew more complex as it grew more personal.","decline":null,"module":"codify","projected":false,"master":true,"hand":"Roth IRA"},{"id":"m-lewinsky-1998","lane":"history","type":"history","year":1998,"endYear":null,"title":"The Lewinsky scandal","detail":"The scandal broke in January 1998. The House impeached President Clinton that December, and the Senate acquitted him in February 1999.","significance":"","decline":null,"module":"codify","projected":false,"master":true,"hand":"’98 Lewinsky"},{"id":"m-russia-1998","lane":"markets","type":"crisis","year":1998,"endYear":null,"title":"Russia defaults; Long-Term Capital Management fails","detail":"In August 1998 Russia devalued the ruble and defaulted on its domestic debt. The losses helped topple the hedge fund Long-Term Capital Management, and the New York Fed organized a private rescue in September.","significance":"Another sharp scare that recovered within months, reinforcing faith in buying and holding.","decline":"about −19% (S&P 500, July 17 – Oct. 8, 1998)","module":"codify","projected":false,"master":true,"hand":"’98 Russian $ crisis"},{"id":"note-bloom","lane":"notes","type":"note","year":1998,"endYear":2008,"title":"All 9 seeds in full bloom · Personal finance","detail":"By the turn of the century every one of the nine seeds is in full bloom, and retirement has become “personal finance.”","significance":"","decline":null,"color":"var(--t-seed)","module":"codify","projected":false,"master":true,"hand":"All 9 seeds in full bloom · Personal finance"},{"id":"m-y2k","lane":"culture","type":"tech","year":1999,"endYear":null,"title":"Y2K","detail":"Fear that computers would fail when dates rolled over to 2000 prompted a costly worldwide fix. The new year arrived with few problems.","significance":"","decline":null,"module":"codify","projected":false,"master":true,"hand":"Y2K"},{"id":"m-columbine-1999","lane":"history","type":"history","year":1999,"endYear":null,"title":"Columbine","detail":"On April 20, 1999, two students killed 13 people at Columbine High School in Colorado.","significance":"","decline":null,"module":"codify","projected":false,"master":true,"hand":"’99 Columbine"},{"id":"m-dow10k-1999","lane":"markets","type":"money","year":1999,"endYear":null,"title":"The Dow closes above 10,000","detail":"On March 29, 1999, the Dow Jones Industrial Average closed above 10,000 for the first time.","significance":"A headline number that made the market feel like a reliable escalator.","decline":null,"module":"codify","projected":false,"master":true,"hand":"Dow over $10K"},{"id":"codify-mar-2","lane":"markets","type":"crisis","year":2000,"endYear":2002,"title":"The dot-com crash","detail":"The Nasdaq Composite peaked at 5,048.62 on March 10, 2000, and fell 78 percent by October 2002; the S&P 500 lost nearly half its value. The S&P did not fully recover until May 2007—months before the next crash began.","significance":"Workers in their 50s lost years of accumulation just as they entered their final saving decade, and Enron employees learned what concentration in employer stock could do.","decline":"−49.1% (S&P 500, Mar. 24, 2000 – Oct. 9, 2002); Nasdaq −78%","module":"codify","projected":false,"master":true,"hand":"Dotcom Bubble. $5T ↓. S+P500 1400 ↓ 815."},{"id":"codify-his-3","lane":"history","type":"history","year":2001,"endYear":null,"title":"Enron’s collapse","detail":"At the end of 2000, 62 percent of the assets in Enron’s 401(k) plan were invested in Enron stock. Shares that traded above $80 in January 2001 were worth less than 70 cents by January 2002, after the company filed for bankruptcy on December 2, 2001.","significance":"","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"codify-his-4","lane":"history","type":"history","year":2001,"endYear":null,"title":"China joins the WTO","detail":"The World Trade Organization approved China’s accession on November 10, 2001, accelerating the global competition the book links to the end of American manufacturing hegemony and the geographic stability that had anchored lifelong employment.","significance":"","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"m-911","lane":"history","type":"history","year":2001,"endYear":null,"title":"September 11","detail":"Terrorist attacks on September 11, 2001, killed nearly 3,000 people in New York, at the Pentagon and in Pennsylvania. U.S. stock markets closed for four trading days.","significance":"His note: social, political and economic at once. It struck in the middle of the dot-com bear market.","decline":null,"module":"codify","projected":false,"master":true,"hand":"9/11 — Social · Political · Economic"},{"id":"correction-soc-0","lane":"movements","type":"movement","year":2001,"endYear":null,"title":"The Village Movement","detail":"Beacon Hill Village, founded in Boston in 2001, pioneered a member-run model in which older adults pay dues and receive volunteer help with transportation, errands and home tasks so they can stay in their own homes, with vetted professionals for the rest. By 2015 the Village to Village Network counted 251 member organizations serving about 25,000 members.","significance":"It rebuilds Community as neighbor-to-neighbor risk sharing rather than as a financial product: the classical answer in modern form.","decline":null,"module":"correction","projected":false,"master":false,"hand":null},{"id":"codify-pol-6","lane":"policy","type":"legislation","year":2001,"endYear":null,"title":"Economic Growth and Tax Relief Reconciliation Act (EGTRRA)","detail":"Signed June 7, 2001, EGTRRA raised the 401(k) deferral limit from $11,000 in 2002 to $15,000 in 2006, raised the IRA limit in steps to $5,000 by 2008, added “catch-up” contributions for savers 50 and older, authorized Roth 401(k) contributions beginning in 2006, and created a nonrefundable “saver’s credit” of up to $1,000 for lower-income contributors.","significance":"Higher limits mostly help those who can already save the maximum; the saver’s credit was a modest attempt to reach those who could not.","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"note-629","lane":"notes","type":"note","year":2002,"endYear":2007,"title":"Market 6.29%","detail":"His note on the market between the dot-com crash and the 2008 crisis.","significance":"","decline":null,"color":"var(--t-money)","module":"codify","projected":false,"master":true,"hand":"Market 6.29%"},{"id":"codify-pol-7","lane":"policy","type":"legislation","year":2003,"endYear":null,"title":"Medicare Modernization Act: Part D","detail":"Signed December 8, 2003, the law created a voluntary outpatient prescription-drug benefit, Medicare Part D, beginning January 1, 2006. Under the 2006 standard design, beneficiaries paid the full cost of drugs between $2,250 in total spending and $3,600 in out-of-pocket costs—the coverage gap known as the “doughnut hole.”","significance":"The health leg of the stool expanded, but through a market of private plans that retirees had to compare and choose among themselves.","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"codify-soc-2","lane":"movements","type":"movement","year":2005,"endYear":null,"title":"The fight over personal accounts","detail":"Opposition to President Bush’s 2005 personal-accounts plan united congressional Democrats, divided Republicans, and grew as the president campaigned: Gallup found disapproval of his handling of Social Security rising from 48 to 64 percent between the State of the Union and June. The effort was abandoned by the fall.","significance":"Public resistance drew a line around Social Security as a pooled, guaranteed program even as private retirement became almost entirely individual.","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"codify-pol-8","lane":"policy","type":"policy","year":2005,"endYear":null,"title":"Bush’s personal-accounts proposal","detail":"After his 2004 reelection, President George W. Bush made voluntary personal retirement accounts within Social Security his top domestic priority, pressing the case in his 2005 State of the Union and on national tours. Public disapproval of his handling of Social Security rose from 48 to 64 percent by June, and by October Bush acknowledged the effort had failed.","significance":"The high-water mark of Individualism (seed 9): Social Security was the one leg of the stool the public refused to convert into an individual account.","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"codify-pol-9","lane":"policy","type":"legislation","year":2006,"endYear":null,"title":"Pension Protection Act","detail":"Signed August 17, 2006, the PPA made it easier for employers to enroll workers in 401(k) plans automatically and protected fiduciaries who invest non-directing participants in “qualified default investment alternatives,” such as target-date or balanced funds.","significance":"A tacit admission that the do-it-yourself model needed defaults to work: the system began quietly making choices for savers it had said were in control.","decline":null,"module":"codify","projected":false,"master":false,"hand":null},{"id":"codify-his-5","lane":"history","type":"history","year":2007,"endYear":2009,"title":"The Great Recession","detail":"The recession ran from December 2007 to June 2009, the longest since World War II at the time; Lehman Brothers failed in September 2008, unemployment peaked at 10 percent in October 2009, and household net worth fell by about $14 trillion.","significance":"","decline":null,"module":"codify","projected":false,"master":true,"hand":"Great Recession"},{"id":"codify-mar-3","lane":"markets","type":"crisis","year":2007,"endYear":2009,"title":"The Global Financial Crisis","detail":"The S&P 500 lost more than half its value in 17 months, and in October 2008 CBO Director Peter Orszag told Congress that American workers had lost more than $2 trillion in retirement savings over the previous 15 months. The index did not regain its 2007 closing high until March 2013.","significance":"The defining test of the Great Risk Transfer: the book’s “Two Clocks” portraits show a 60-year-old who did everything right losing her plan at exactly the wrong moment.","decline":"−56.8% (S&P 500, Oct. 9, 2007 – Mar. 9, 2009)","module":"codify","projected":false,"master":true,"hand":"Housing Bubble. S+P500 1500 ↓ 38.5% · 735."},{"id":"collapse-his-0","lane":"culture","type":"tech","year":2010,"endYear":null,"title":"Uber and the Gig Economy","detail":"Founded in 2009 as UberCab, Uber began service in San Francisco on July 5, 2010. By July 2023, the BLS counted 11.9 million independent contractors, 7.4% of total employment, workers who generally fall outside employer-sponsored retirement plans.","significance":"","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"lens-2010-7","lane":"lens","type":"lens","year":2010,"endYear":null,"title":"Two-Person Lens, 2010","detail":"","significance":"The 60-year-old still has time to panic; the 20-year-old has already moved past grief into improvisation—and neither was ever asked who gave them the dream.","decline":null,"module":"codify","projected":false,"lens":"lens-2010-7"},{"id":"collapse-pol-0","lane":"policy","type":"legislation","year":2010,"endYear":null,"title":"Affordable Care Act","detail":"Enacted in March 2010, the ACA created premium tax credits for households with incomes from 100% to 400% of the federal poverty level. It also expanded Medicaid to adults below 138% of poverty, although not every state has adopted the expansion.","significance":"Healthcare is the book’s “hidden enemy” of old age. Subsidized individual coverage gave workers who leave a job before Medicare eligibility at 65 an option outside employer insurance, an instance of the Government Involvement seed acting as protection.","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"collapse-his-1","lane":"history","type":"history","year":2011,"endYear":2029,"title":"Boomers Begin Turning 65","detail":"The oldest Baby Boomers turned 65 on January 1, 2011, and Pew estimated that about 10,000 a day would follow for 19 years. The Census Bureau projects that all Boomers will be 65 or older by 2030.","significance":"","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"collapse-soc-0","lane":"movements","type":"movement","year":2011,"endYear":2011,"title":"Occupy Wall Street","detail":"Occupy began on September 17, 2011, in Zuccotti Park in Lower Manhattan, after a call from the Canadian magazine Adbusters, and popularized the slogan “We are the 99%.” Police cleared the encampment on November 15, 2011.","significance":"It named the Two Americas seed in the language of mass politics just as the first Boomers reached 65.","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"collapse-soc-1","lane":"movements","type":"movement","year":2011,"endYear":null,"title":"FIRE: Financial Independence, Retire Early","detail":"FIRE draws on the 1992 book Your Money or Your Life by Joe Dominguez and Vicki Robin and spread through blogs. Pete Adeney’s Mr. Money Mustache, launched in 2011 by a blogger who had stopped full-time work at 30, became a hub for followers who save aggressively in order to exit paid work decades early.","significance":"FIRE rebels against 65 = Old and Done while doubling down on Individualism and Market Growth: it is still an escape financed by a personal portfolio.","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"collapse-pol-1","lane":"policy","type":"policy","year":2013,"endYear":2014,"title":"Detroit’s Chapter 9 Bankruptcy","detail":"Detroit filed for Chapter 9 bankruptcy on July 18, 2013, with an estimated $18–20 billion in debts and obligations. A “Grand Bargain” of about $816 million from the State of Michigan, foundations and the Detroit Institute of Arts limited the damage. General retirees lost 4.5% of their pensions and their annual cost-of-living increases, and police and fire retirees lost part of theirs. Judge Steven Rhodes confirmed the plan on November 7, 2014.","significance":"Public pensions, the last widespread defined-benefit promise, proved cuttable in bankruptcy. This is the harvest of The Promise seed: a pension is only as secure as the institution behind it.","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"collapse-pol-2","lane":"policy","type":"legislation","year":2014,"endYear":null,"title":"Multiemployer Pension Reform Act (MPRA)","detail":"Enacted in December 2014 as Division O of the Consolidated and Further Continuing Appropriations Act, 2015 (P.L. 113-235), MPRA let severely underfunded multiemployer plans apply to the Treasury to cut benefits already being paid, provided the cuts would restore solvency. Retirees aged 80 and older and disabled participants were protected, and no benefit could fall below 110% of the PBGC guarantee.","significance":"Federal law now allowed earned pension benefits to be cut for people already retired. The Promise was rewritten after the fact.","decline":null,"module":"collapse","projected":false,"master":false,"hand":null},{"id":"collapse-pol-3","lane":"policy","type":"policy","year":2016,"endYear":null,"title":"Treasury Rejects Central States Benefit Cuts","detail":"The Teamsters’ Central States pension fund applied under MPRA to cut benefits for about 270,000 of its nearly 400,000 participants, totaling about $11 billion. On May 6, 2016, the Treas
